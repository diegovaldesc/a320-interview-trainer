<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 254" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">En qué orden se vacían</title>
  <desc id="d">Tres pasos: 1, se vacía el center tank; 2, los inner tanks bajan hasta unos 750 kg; 3, los outer tanks pasan su combustible a los inner tanks. Las dos versiones del A320 siguen el mismo orden.</desc>
  <rect x="1" y="1" width="358" height="252" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <defs><marker id="a2E9D5B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2E9D5B"/></marker></defs>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">En qué orden se vacían</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">Las dos versiones del A320 siguen el mismo orden.</text>
  <circle cx="26" cy="76" r="8.5" fill="#0E5E6F" stroke="none" stroke-width="1"/>
  <text x="26" y="79.8" text-anchor="middle" font-size="10.5" font-weight="800" fill="#FFFFFF">1</text>
  <text x="40" y="74" font-size="11" font-weight="800" fill="#1E2A33">Center tank</text>
  <text x="40" y="88" font-size="10" fill="#33424D">se vacía primero</text>
  <rect x="140" y="62" width="28" height="30" rx="3" fill="#F3F5F7" stroke="#C9D3DB" stroke-width="1.2"/>
  <rect x="168" y="62" width="48" height="30" rx="3" fill="#F3F5F7" stroke="#C9D3DB" stroke-width="1.2"/>
  <rect x="216" y="62" width="48" height="30" rx="3" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.6"/>
  <rect x="264" y="62" width="48" height="30" rx="3" fill="#F3F5F7" stroke="#C9D3DB" stroke-width="1.2"/>
  <rect x="312" y="62" width="28" height="30" rx="3" fill="#F3F5F7" stroke="#C9D3DB" stroke-width="1.2"/>
  <circle cx="26" cy="134" r="8.5" fill="#0E5E6F" stroke="none" stroke-width="1"/>
  <text x="26" y="137.8" text-anchor="middle" font-size="10.5" font-weight="800" fill="#FFFFFF">2</text>
  <text x="40" y="132" font-size="11" font-weight="800" fill="#1E2A33">Inner tanks</text>
  <text x="40" y="146" font-size="10" fill="#33424D">hasta unos 750 kg</text>
  <rect x="140" y="120" width="28" height="30" rx="3" fill="#F3F5F7" stroke="#C9D3DB" stroke-width="1.2"/>
  <rect x="168" y="120" width="48" height="30" rx="3" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.6"/>
  <rect x="216" y="120" width="48" height="30" rx="3" fill="#F3F5F7" stroke="#C9D3DB" stroke-width="1.2"/>
  <rect x="264" y="120" width="48" height="30" rx="3" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.6"/>
  <rect x="312" y="120" width="28" height="30" rx="3" fill="#F3F5F7" stroke="#C9D3DB" stroke-width="1.2"/>
  <circle cx="26" cy="192" r="8.5" fill="#0E5E6F" stroke="none" stroke-width="1"/>
  <text x="26" y="195.8" text-anchor="middle" font-size="10.5" font-weight="800" fill="#FFFFFF">3</text>
  <text x="40" y="190" font-size="11" font-weight="800" fill="#1E2A33">Outer → inner</text>
  <text x="40" y="204" font-size="10" fill="#33424D">con 750 kg en el inner</text>
  <rect x="140" y="178" width="28" height="30" rx="3" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.6"/>
  <rect x="168" y="178" width="48" height="30" rx="3" fill="#F3F5F7" stroke="#C9D3DB" stroke-width="1.2"/>
  <rect x="216" y="178" width="48" height="30" rx="3" fill="#F3F5F7" stroke="#C9D3DB" stroke-width="1.2"/>
  <rect x="264" y="178" width="48" height="30" rx="3" fill="#F3F5F7" stroke="#C9D3DB" stroke-width="1.2"/>
  <rect x="312" y="178" width="28" height="30" rx="3" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.6"/>
  <line x1="146" y1="193" x2="170" y2="193" stroke="#2E9D5B" stroke-width="2" marker-end="url(#a2E9D5B)"/>
  <line x1="334" y1="193" x2="310" y2="193" stroke="#2E9D5B" stroke-width="2" marker-end="url(#a2E9D5B)"/>
  <text x="140" y="244" font-size="10" fill="#5B6B78">Outer · Inner · Center · Inner · Outer</text>
</svg>
