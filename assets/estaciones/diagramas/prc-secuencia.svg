<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">El orden de los procedimientos</title>
  <desc id="d">Primero una trayectoria segura (las acciones READ &amp; DO desde 400 ft AGL en el despegue). Después: 1, memory items u OEB immediate actions; 2, OEB; 3, ECAM (procedimiento, páginas SD y STATUS); 4, QRH y QRH summaries si corresponde. Al final, ECAM ACTIONS COMPLETE: evaluar, decidir e informar. Un procedimiento a la vez.</desc>
  <rect x="1" y="1" width="358" height="358" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <defs><marker id="a0E5E6F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0E5E6F"/></marker></defs>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">El orden de los procedimientos</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">Siempre después de una trayectoria segura</text>
  <rect x="40" y="58" width="280" height="34" rx="7" fill="#E5F4EA" stroke="#2E9D5B" stroke-width="1.4"/>
  <text x="180" y="72.5" text-anchor="middle" font-size="11" font-weight="800" fill="#1E2A33">Trayectoria segura</text>
  <text x="180" y="85.5" text-anchor="middle" font-size="10" fill="#33424D">READ &amp; DO desde 400 ft AGL al despegar</text>
  <line x1="180" y1="92" x2="180" y2="103" stroke="#0E5E6F" stroke-width="1.5" marker-end="url(#a0E5E6F)"/>
  <rect x="40" y="104" width="280" height="34" rx="7" fill="#FCEBD3" stroke="#C77700" stroke-width="1.4"/>
  <text x="180" y="118.5" text-anchor="middle" font-size="11" font-weight="800" fill="#1E2A33">1. Memory items</text>
  <text x="180" y="131.5" text-anchor="middle" font-size="10" fill="#33424D">u OEB immediate actions (de memoria)</text>
  <line x1="180" y1="138" x2="180" y2="149" stroke="#0E5E6F" stroke-width="1.5" marker-end="url(#a0E5E6F)"/>
  <rect x="40" y="150" width="280" height="34" rx="7" fill="#FFFFFF" stroke="#C9D3DB" stroke-width="1.4"/>
  <text x="180" y="171" text-anchor="middle" font-size="11" font-weight="800" fill="#1E2A33">2. OEB</text>
  <line x1="180" y1="184" x2="180" y2="195" stroke="#0E5E6F" stroke-width="1.5" marker-end="url(#a0E5E6F)"/>
  <rect x="40" y="196" width="280" height="34" rx="7" fill="#FFFFFF" stroke="#C9D3DB" stroke-width="1.4"/>
  <text x="180" y="210.5" text-anchor="middle" font-size="11" font-weight="800" fill="#1E2A33">3. ECAM</text>
  <text x="180" y="223.5" text-anchor="middle" font-size="10" fill="#33424D">procedimiento, páginas SD y STATUS</text>
  <line x1="180" y1="230" x2="180" y2="241" stroke="#0E5E6F" stroke-width="1.5" marker-end="url(#a0E5E6F)"/>
  <rect x="40" y="242" width="280" height="34" rx="7" fill="#FFFFFF" stroke="#C9D3DB" stroke-width="1.4"/>
  <text x="180" y="256.5" text-anchor="middle" font-size="11" font-weight="800" fill="#1E2A33">4. QRH</text>
  <text x="180" y="269.5" text-anchor="middle" font-size="10" fill="#33424D">y QRH summaries, si corresponde</text>
  <line x1="180" y1="276" x2="180" y2="287" stroke="#0E5E6F" stroke-width="1.5" marker-end="url(#a0E5E6F)"/>
  <rect x="40" y="288" width="280" height="34" rx="7" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.4"/>
  <text x="180" y="302.5" text-anchor="middle" font-size="11" font-weight="800" fill="#0E5E6F">ECAM ACTIONS COMPLETE</text>
  <text x="180" y="315.5" text-anchor="middle" font-size="10" fill="#33424D">evaluar, decidir e informar</text>
  <text x="18" y="342" font-size="10" fill="#33424D">Un procedimiento a la vez, salvo que pida otro o aparezca algo nuevo.</text>
</svg>
