<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 316" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">FLEX: la temperatura asumida</title>
  <desc id="d">Empuje máximo según la temperatura: plano hasta la TREF y después decreciente hasta la TFLEX máxima. Con la OAT real del día el motor podría dar el TOGA; el empuje necesario hoy es menor, y la temperatura asumida a la que la curva da ese empuje es la TFLEX. Es la temperatura a la que el peso real sería el máximo para esa pista y ese día; mayor que la TREF y que la OAT, sin pasar la máxima, y reduce hasta un 25 % del TOGA.</desc>
  <rect x="1" y="1" width="358" height="314" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <defs><marker id="a8C99A3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8C99A3"/></marker><marker id="b8C99A3" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#8C99A3"/></marker><marker id="aC77700" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#C77700"/></marker><marker id="bC77700" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#C77700"/></marker></defs>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">FLEX: la temperatura asumida</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">El empuje máximo baja cuando la temperatura sube.</text>
  <line x1="46" y1="200" x2="342" y2="200" stroke="#8C99A3" stroke-width="1.2" marker-end="url(#a8C99A3)"/>
  <line x1="46" y1="200" x2="46" y2="52" stroke="#8C99A3" stroke-width="1.2" marker-end="url(#a8C99A3)"/>
  <text x="342" y="216" text-anchor="end" font-size="10" fill="#5B6B78">temperatura →</text>
  <text x="52" y="56" font-size="10" fill="#5B6B78">empuje máximo</text>
  <line x1="46" y1="123.9" x2="262" y2="123.9" stroke="#0E5E6F" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="262" y1="123.9" x2="262" y2="200" stroke="#0E5E6F" stroke-width="1.2" stroke-dasharray="4 3"/>
  <polyline points="46,80 168,80 318,150" fill="none" stroke="#1E2A33" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="168" y1="80" x2="168" y2="200" stroke="#C9D3DB" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="318" y1="150" x2="318" y2="200" stroke="#C9D3DB" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="108" y1="80" x2="108" y2="200" stroke="#C9D3DB" stroke-width="1" stroke-dasharray="2 3"/>
  <circle cx="262" cy="123.9" r="4" fill="#0E5E6F" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="108" y="72" text-anchor="middle" font-size="10.5" font-weight="700" fill="#33424D">TOGA (flat rated)</text>
  <text x="52" y="116.9" font-size="10.5" font-weight="800" fill="#0E5E6F">empuje necesario hoy</text>
  <line x1="108" y1="197" x2="108" y2="203" stroke="#1E2A33" stroke-width="1.2"/>
  <text x="108" y="230" text-anchor="middle" font-size="10.5" font-weight="800" fill="#33424D">OAT</text>
  <text x="108" y="243" text-anchor="middle" font-size="10" fill="#33424D">real</text>
  <line x1="168" y1="197" x2="168" y2="203" stroke="#1E2A33" stroke-width="1.2"/>
  <text x="168" y="230" text-anchor="middle" font-size="10.5" font-weight="800" fill="#33424D">TREF</text>
  <line x1="262" y1="197" x2="262" y2="203" stroke="#1E2A33" stroke-width="1.2"/>
  <text x="262" y="230" text-anchor="middle" font-size="10.5" font-weight="800" fill="#0E5E6F">TFLEX</text>
  <text x="262" y="243" text-anchor="middle" font-size="10" fill="#0E5E6F">asumida</text>
  <line x1="318" y1="197" x2="318" y2="203" stroke="#1E2A33" stroke-width="1.2"/>
  <text x="318" y="230" text-anchor="middle" font-size="10.5" font-weight="800" fill="#33424D">TFLEX</text>
  <text x="318" y="243" text-anchor="middle" font-size="10" fill="#33424D">máxima</text>
  <line x1="336" y1="82" x2="336" y2="148" stroke="#C77700" stroke-width="1.3" marker-end="url(#aC77700)" marker-start="url(#bC77700)"/>
  <text x="331" y="111" text-anchor="end" font-size="10" font-weight="700" fill="#C77700">hasta</text>
  <text x="331" y="124" text-anchor="end" font-size="10.5" font-weight="800" fill="#C77700">−25 %</text>
  <text x="18" y="266" font-size="10.5" fill="#33424D">TFLEX: la temperatura a la que el peso real sería el máximo</text>
  <text x="18" y="281" font-size="10.5" fill="#33424D">para esa pista y ese día. Mayor que la TREF y que la OAT,</text>
  <text x="18" y="296" font-size="10.5" fill="#33424D">sin pasar la máxima; reduce hasta 25 % del TOGA.</text>
</svg>
