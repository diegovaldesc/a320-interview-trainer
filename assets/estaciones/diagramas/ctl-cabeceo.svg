  <rect x="250" y="38" width="92" height="52" rx="8" fill="#DDF0F1" stroke="#0E7C86" stroke-width="1.6"/>
  <text x="296" y="56" text-anchor="middle" font-size="11" font-weight="700" fill="#1E2A33">Elevator R</text>
  <rect x="276" y="64" width="15" height="15" rx="3" fill="#FDF3DC" stroke="#D99A00" stroke-width="1.5"/>
  <text x="283.5" y="75.3" text-anchor="middle" font-size="10" font-weight="700" fill="#D99A00">Y</text>
  <rect x="301" y="64" width="15" height="15" rx="3" fill="#EAF1FC" stroke="#2F6FD6" stroke-width="1.5"/>
  <text x="308.5" y="75.3" text-anchor="middle" font-size="10" font-weight="700" fill="#2F6FD6">B</text>
  <rect x="124" y="38" width="112" height="92" rx="8" fill="#FFFFFF" stroke="#0E7C86" stroke-width="1.6"/>
  <text x="180" y="54" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0E7C86">THS</text>
  <text x="180" y="68" text-anchor="middle" font-size="9" fill="#5B6B78">motores hidráulicos</text>
  <rect x="156" y="72" width="15" height="15" rx="3" fill="#E9F5EE" stroke="#2E9D5B" stroke-width="1.5"/>
  <text x="163.5" y="83.3" text-anchor="middle" font-size="10" font-weight="700" fill="#2E9D5B">G</text>
  <rect x="189" y="72" width="15" height="15" rx="3" fill="#FDF3DC" stroke="#D99A00" stroke-width="1.5"/>
  <text x="196.5" y="83.3" text-anchor="middle" font-size="10" font-weight="700" fill="#D99A00">Y</text>
  <text x="180" y="100" text-anchor="middle" font-size="9" fill="#5B6B78">motores eléctricos 1 · 2 · 3</text>
  <text x="180" y="117" text-anchor="middle" font-size="9.5" font-weight="700" fill="#33424D">pitch trim wheel: mecánico</text>
  <text x="180" y="152" text-anchor="middle" font-size="9.5" fill="#5B6B78">Computadores, en orden de prioridad</text>
  <rect x="40" y="160" width="72" height="26" rx="6" fill="#DDF0F1" stroke="#0E7C86" stroke-width="1.4"/>
  <text x="76" y="177" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1E2A33">ELAC 2</text>
  <rect x="140" y="160" width="72" height="26" rx="6" fill="#FFFFFF" stroke="#0E7C86" stroke-width="1.4"/>
  <text x="176" y="177" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1E2A33">ELAC 1</text>
  <rect x="230" y="160" width="92" height="26" rx="6" fill="#FFFFFF" stroke="#0E7C86" stroke-width="1.4"/>
