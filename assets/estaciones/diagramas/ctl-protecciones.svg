<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 344" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Protecciones de normal law en el PFD</title>
  <desc id="d">Símbolos verdes de igual en la escala de pitch en 30° nose up (25° en CONF FULL) y 15° nose down, y en la escala de bank en 67°. En la cinta de velocidad, VMO/MMO arriba, la franja ámbar y negra de alpha prot y la roja de alpha max abajo. Load factor de +2,5 a -1 g en limpio y de +2 a 0 g con slats o flaps; a baja velocidad, el pitch máximo baja 5°. En alternate y direct law, los símbolos verdes pasan a X ámbar.</desc>
