<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 268" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Ángulo máximo de la rueda de nariz</title>
  <desc id="d">Dos gráficos del ángulo máximo de la rueda de nariz, a cada lado, según la ground speed: con el tiller, 75° hasta 20 kt, y baja hasta 0° a 80 kt; con los pedales, 6° hasta 40 kt, y baja hasta 0° a 130 kt. Es el máximo disponible: la rueda gira lo que pidan el tiller o los pedales.</desc>
  <rect x="1" y="1" width="358" height="266" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <defs><marker id="a8C99A3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8C99A3"/></marker><marker id="b8C99A3" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#8C99A3"/></marker></defs>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Ángulo máximo de la rueda de nariz</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">El tope que permite el BSCU según la ground speed.</text>
  <text x="30" y="66" font-size="11" font-weight="800" fill="#0E5E6F">Tiller (handwheel)</text>
  <line x1="30" y1="186" x2="164" y2="186" stroke="#8C99A3" stroke-width="1.2" marker-end="url(#a8C99A3)"/>
  <line x1="30" y1="186" x2="30" y2="90" stroke="#8C99A3" stroke-width="1.2" marker-end="url(#a8C99A3)"/>
  <text x="35" y="94" font-size="10" fill="#5B6B78">ángulo máx.</text>
  <polyline points="30,118.8 55.6,118.8 132.4,186" fill="none" stroke="#0E5E6F" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="35" y="111.8" font-size="11" font-weight="800" fill="#0E5E6F">±75°</text>
  <line x1="55.6" y1="186" x2="55.6" y2="190" stroke="#1E2A33" stroke-width="1.2"/>
  <text x="55.6" y="202" text-anchor="middle" font-size="10" font-weight="700" fill="#33424D">20</text>
  <line x1="132.4" y1="186" x2="132.4" y2="190" stroke="#1E2A33" stroke-width="1.2"/>
  <text x="132.4" y="202" text-anchor="middle" font-size="10" font-weight="700" fill="#33424D">80</text>
  <line x1="55.6" y1="118.8" x2="55.6" y2="186" stroke="#C9D3DB" stroke-width="1.2" stroke-dasharray="2 3"/>
  <text x="198" y="66" font-size="11" font-weight="800" fill="#C77700">Pedales</text>
  <line x1="198" y1="186" x2="332" y2="186" stroke="#8C99A3" stroke-width="1.2" marker-end="url(#a8C99A3)"/>
  <line x1="198" y1="186" x2="198" y2="90" stroke="#8C99A3" stroke-width="1.2" marker-end="url(#a8C99A3)"/>
  <text x="203" y="94" font-size="10" fill="#5B6B78">ángulo máx.</text>
  <polyline points="198,118.8 232.1,118.8 308.9,186" fill="none" stroke="#C77700" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="203" y="111.8" font-size="11" font-weight="800" fill="#C77700">±6°</text>
  <line x1="232.1" y1="186" x2="232.1" y2="190" stroke="#1E2A33" stroke-width="1.2"/>
  <text x="232.1" y="202" text-anchor="middle" font-size="10" font-weight="700" fill="#33424D">40</text>
  <line x1="308.9" y1="186" x2="308.9" y2="190" stroke="#1E2A33" stroke-width="1.2"/>
  <text x="308.9" y="202" text-anchor="middle" font-size="10" font-weight="700" fill="#33424D">130</text>
  <line x1="232.1" y1="118.8" x2="232.1" y2="186" stroke="#C9D3DB" stroke-width="1.2" stroke-dasharray="2 3"/>
  <text x="180" y="218" text-anchor="middle" font-size="10" fill="#5B6B78">ground speed (kt)</text>
  <text x="18" y="240" font-size="10.5" fill="#33424D">± = a cada lado. Es el máximo disponible:</text>
  <text x="18" y="255" font-size="10.5" fill="#33424D">la rueda gira lo que pidan el tiller o los pedales.</text>
</svg>
