<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 310" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Roll y spoilers: hidráulico y computador de cada superficie</title>
  <desc id="d">Ala derecha vista desde arriba; la izquierda es igual. Spoilers 1 a 5: 1 Green con el SEC 3, 2 Yellow con el SEC 3, 3 Blue con el SEC 1, 4 Yellow con el SEC 1 y 5 Green con el SEC 2. Por fuera, el aileron, con dos servojacks Green y Blue, mandado por el ELAC 1 y de respaldo el ELAC 2. Speed brakes: spoilers 2, 3 y 4; roll: spoilers 2 a 5 y el aileron; ground spoilers: 1 a 5. Si el SEC de un spoiler falla, ese spoiler se retrae.</desc>
  <rect x="1" y="1" width="358" height="308" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Roll y spoilers</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">Ala derecha vista desde arriba; la izquierda es igual.</text>
