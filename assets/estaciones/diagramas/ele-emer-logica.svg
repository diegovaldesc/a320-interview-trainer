<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 344" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">RAT y EMER GEN</title>
  <desc id="d">Sin AC BUS 1 ni AC BUS 2 y sobre 100 kt, o con MAN ON, se despliega el RAT. El RAT presuriza el Blue, que mueve el motor hidráulico del EMER GEN. El EMER GEN alimenta AC ESS BUS y, por el ESS TR, DC ESS BUS.</desc>
  <rect x="1" y="1" width="358" height="342" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="16" y="34" font-size="10.5" fill="#1E2A33">AC BUS 1 sin energía</text>
  <text x="16" y="52" font-size="10.5" fill="#1E2A33">AC BUS 2 sin energía</text>
  <text x="16" y="70" font-size="10.5" fill="#1E2A33">Más de 100 kt</text>
  <path d="M128 30 L148 30" fill="none" stroke="#5B6B78" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M128 48 L148 48" fill="none" stroke="#5B6B78" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M96 66 L148 66" fill="none" stroke="#5B6B78" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M148 22 H160 A26 26 0 0 1 160 74 H148 Z" fill="#FFFFFF" stroke="#33424D" stroke-width="1.6"/>
  <text x="160" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="#33424D">Y</text>
  <path d="M186 48 L206 48 L206 60 L218 60" fill="none" stroke="#5B6B78" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="16" y="98" font-size="10.5" font-weight="600" fill="#2F6FD6">Manual: RAT MAN ON</text>
  <text x="16" y="112" font-size="10.5" font-weight="600" fill="#2F6FD6">o EMER ELEC PWR MAN ON</text>
  <path d="M164 105 L206 105 L206 76 L218 76" fill="none" stroke="#5B6B78" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M214 52 Q226 68 214 84 Q240 84 254 68 Q240 52 214 52 Z" fill="#FFFFFF" stroke="#33424D" stroke-width="1.6"/>
  <text x="232" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#33424D">O</text>
  <path d="M254 68 L268 68" fill="none" stroke="#5B6B78" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M274 68 L266.8 64 L266.8 72 Z" fill="#5B6B78"/>
  <rect x="274" y="50" width="72" height="36" rx="8" fill="#EAF1FC" stroke="#2F6FD6" stroke-width="1.6"/>
  <text x="310" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#2F6FD6">RAT</text>
  <text x="310" y="80" text-anchor="middle" font-size="10" fill="#33424D">se despliega</text>
  <path d="M310 86 L310 152" fill="none" stroke="#2F6FD6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="318" y="124" font-size="10.5" font-weight="700" fill="#2F6FD6">Blue</text>
  <rect x="196" y="140" width="150" height="66" rx="10" fill="none" stroke="#5B6B78" stroke-width="1.3" stroke-dasharray="4 3"/>
  <circle cx="310" cy="172" r="20" fill="#EAF1FC" stroke="#2F6FD6" stroke-width="2"/>
  <text x="310" y="169" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2F6FD6">HYD</text>
  <text x="310" y="180" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2F6FD6">MOT</text>
  <path d="M290 172 L260 172" fill="none" stroke="#5B6B78" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="238" cy="172" r="22" fill="#E9F5EE" stroke="#2E9D5B" stroke-width="2"/>
  <text x="238" y="170.2" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1F6E41">EMER</text>
  <text x="238" y="180.6" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1F6E41">GEN</text>
  <text x="271" y="222" text-anchor="middle" font-size="10.5" fill="#5B6B78">5 KVA · lo mueve el Blue</text>
  <path d="M216 172 L76 172 L76 188" fill="none" stroke="#2E9D5B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="145.5" y="167.5" width="9" height="9" rx="2" fill="#2E9D5B" stroke="#2E9D5B" stroke-width="1.6"/>
  <text x="150" y="162" text-anchor="middle" font-size="10.5" fill="#5B6B78">GCU</text>
  <rect x="20" y="188" width="112" height="18" rx="5" fill="#E9F5EE" stroke="#2E9D5B" stroke-width="1.6"/>
  <text x="76" y="200.96" text-anchor="middle" font-size="11" font-weight="700" fill="#1F6E41">AC ESS BUS</text>
  <path d="M76 206 L76 224" fill="none" stroke="#2E9D5B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="50" y="224" width="52" height="20" rx="5" fill="#FFFFFF" stroke="#2E9D5B" stroke-width="1.6"/>
  <text x="76" y="237.6" text-anchor="middle" font-size="10" font-weight="700" fill="#1F6E41">ESS TR</text>
  <path d="M76 244 L76 262" fill="none" stroke="#2E9D5B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="20" y="262" width="112" height="18" rx="5" fill="#E9F5EE" stroke="#2E9D5B" stroke-width="1.6"/>
  <text x="76" y="274.96" text-anchor="middle" font-size="11" font-weight="700" fill="#1F6E41">DC ESS BUS</text>
  <text x="150" y="248" font-size="10.5" fill="#1E2A33">Se acopla 3 s después de</text>
  <text x="150" y="262" font-size="10.5" fill="#1E2A33">que el RAT lo alimenta.</text>
  <rect x="14" y="292" width="332" height="40" rx="8" fill="#F3F5F7" stroke="#DDE3E8"/>
  <text x="24" y="308" font-size="10.5" fill="#1E2A33">Mientras se despliega (8 s), alimentan las baterías.</text>
  <text x="24" y="323" font-size="10.5" fill="#A53A30">Luz roja FAULT: el EMER GEN aún no alimenta.</text>
</svg>
