<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 314" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Al soltar el sidestick</title>
  <desc id="d">Qué hace el avión con el bank al soltar el sidestick. Normal law: hasta 33° mantiene el bank y sobre 33° vuelve solo a 33°. Con high speed protection (normal law, sobre VMO/MMO): vuelve a 0°, alas niveladas. Alternate y direct law: roll directo, nadie mantiene ni corrige el bank. Abnormal attitude law: roll directo para recuperar, por ejemplo con bank sobre 125°. En normal y alternate law, sobre 45° de bank el autopilot se desconecta.</desc>
  <rect x="1" y="1" width="358" height="312" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Al soltar el sidestick</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">Qué hace el avión con el bank, según la ley.</text>
  <rect x="16" y="58" width="328" height="46" rx="6" fill="#E9F5EE" stroke="#2E9D5B" stroke-width="1.4"/>
  <text x="26" y="85" font-size="11" font-weight="800" fill="#2E9D5B">Normal law</text>
  <text x="146" y="77" font-size="10.5" fill="#33424D">Hasta 33°: mantiene el bank.</text>
  <text x="146" y="92" font-size="10.5" fill="#33424D">Sobre 33°: vuelve solo a 33°.</text>
  <rect x="16" y="110" width="328" height="46" rx="6" fill="#E9F5EE" stroke="#2E9D5B" stroke-width="1.4"/>
  <text x="26" y="137" font-size="11" font-weight="800" fill="#2E9D5B">High speed prot.</text>
  <text x="146" y="129" font-size="10.5" fill="#33424D">Vuelve a 0°: alas niveladas.</text>
  <text x="146" y="144" font-size="10.5" fill="#33424D">(normal law, sobre VMO/MMO)</text>
  <rect x="16" y="162" width="328" height="46" rx="6" fill="#FCEBD3" stroke="#D98A00" stroke-width="1.4"/>
  <text x="26" y="189" font-size="11" font-weight="800" fill="#8A5300">Alternate y direct</text>
  <text x="146" y="181" font-size="10.5" fill="#33424D">Roll directo: nadie mantiene</text>
  <text x="146" y="196" font-size="10.5" fill="#33424D">ni corrige el bank.</text>
  <rect x="16" y="214" width="328" height="46" rx="6" fill="#F8E1DE" stroke="#C0392B" stroke-width="1.4"/>
  <text x="26" y="241" font-size="11" font-weight="800" fill="#C0392B">Abnormal attitude</text>
  <text x="146" y="233" font-size="10.5" fill="#33424D">Roll directo para recuperar</text>
  <text x="146" y="248" font-size="10.5" fill="#33424D">(por ejemplo, bank sobre 125°).</text>
  <text x="16" y="286" font-size="10.5" font-weight="700" fill="#1E2A33">Normal y alternate law: sobre 45° de bank,</text>
  <text x="16" y="300" font-size="10.5" font-weight="700" fill="#1E2A33">el autopilot se desconecta.</text>
</svg>
