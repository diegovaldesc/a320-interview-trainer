  <title id="t">Red eléctrica del A320 en configuración normal</title>
  <desc id="d">Abajo, GEN 1, APU GEN, EXT PWR y GEN 2 con el bus tie; GEN 1 alimenta AC BUS 1 y GEN 2 alimenta AC BUS 2. AC BUS 1 alimenta AC ESS BUS por el AC ESS FEED. Por el TR 1 y el TR 2 reciben DC el DC BUS 1 y el DC BUS 2; el DC BUS 1 alimenta el DC BAT BUS (contactor cerrado) y este el DC ESS; el contactor entre DC BUS 2 y DC BAT BUS está abierto. Las baterías alimentan siempre sus HOT BUS y se conectan al DC BAT BUS para cargarse; la BAT 2 también puede alimentar el DC ESS. ESS TR, STAT INV y EMER GEN quedan en reserva.</desc>
