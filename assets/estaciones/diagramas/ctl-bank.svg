  <text x="242" y="172" font-size="10" fill="#33424D">sidestick a tope</text>
  <text x="18" y="210" font-size="9.5" fill="#5B6B78">Con protección de AOA o de pitch, el máximo baja a 45°; con high speed, a 40°.</text>
