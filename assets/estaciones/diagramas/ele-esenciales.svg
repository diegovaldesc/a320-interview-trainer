<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 310" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Las barras esenciales y sus respaldos</title>
  <desc id="d">AC ESS BUS: AC BUS 1 en normal, luego AC BUS 2 con el AC ESS FEED, luego el EMER GEN y al final la BAT 1 por el static inverter (sobre 50 kt). DC ESS BUS: el TR 1 por el DC BAT BUS en normal, luego el ESS TR y al final la BAT 2.</desc>
  <rect x="1" y="1" width="358" height="308" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <rect x="26" y="12" width="138" height="20" rx="5" fill="#E9F5EE" stroke="#2E9D5B" stroke-width="1.6"/>
  <text x="95" y="25.96" text-anchor="middle" font-size="11" font-weight="700" fill="#1F6E41">AC ESS BUS</text>
  <rect x="196" y="12" width="138" height="20" rx="5" fill="#E9F5EE" stroke="#2E9D5B" stroke-width="1.6"/>
  <text x="265" y="25.96" text-anchor="middle" font-size="11" font-weight="700" fill="#1F6E41">DC ESS BUS</text>
  <text x="95" y="46" text-anchor="middle" font-size="10.5" fill="#5B6B78">recibe energía de:</text>
  <text x="265" y="46" text-anchor="middle" font-size="10.5" fill="#5B6B78">recibe energía de:</text>
  <rect x="18" y="54" width="154" height="38" rx="8" fill="#E9F5EE" stroke="#2E9D5B" stroke-width="1.4"/>
  <text x="95" y="70" text-anchor="middle" font-size="11" font-weight="700" fill="#1F6E41">AC BUS 1</text>
  <text x="95" y="84" text-anchor="middle" font-size="10.5" fill="#5B6B78">normal</text>
  <path d="M95 92 L95 101" fill="none" stroke="#5B6B78" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M95 106 L91 98.8 L99 98.8 Z" fill="#5B6B78"/>
  <rect x="18" y="106" width="154" height="38" rx="8" fill="#F3F5F7" stroke="#A9B4BD" stroke-width="1.4"/>
  <text x="95" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#1E2A33">AC BUS 2</text>
  <text x="95" y="136" text-anchor="middle" font-size="10.5" fill="#5B6B78">con el AC ESS FEED</text>
  <path d="M95 144 L95 153" fill="none" stroke="#5B6B78" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M95 158 L91 150.8 L99 150.8 Z" fill="#5B6B78"/>
  <rect x="18" y="158" width="154" height="38" rx="8" fill="#F3F5F7" stroke="#A9B4BD" stroke-width="1.4"/>
  <text x="95" y="174" text-anchor="middle" font-size="11" font-weight="700" fill="#1E2A33">EMER GEN</text>
  <text x="95" y="188" text-anchor="middle" font-size="10.5" fill="#5B6B78">sin AC BUS 1 ni 2</text>
  <path d="M95 196 L95 205" fill="none" stroke="#5B6B78" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M95 210 L91 202.8 L99 202.8 Z" fill="#5B6B78"/>
  <rect x="18" y="210" width="154" height="50" rx="8" fill="#F3F5F7" stroke="#A9B4BD" stroke-width="1.4"/>
  <text x="95" y="226" text-anchor="middle" font-size="11" font-weight="700" fill="#1E2A33">BAT 1, por el STAT INV</text>
  <text x="95" y="240" text-anchor="middle" font-size="10.5" fill="#5B6B78">sin EMER GEN,</text>
  <text x="95" y="253" text-anchor="middle" font-size="10.5" fill="#5B6B78">sobre 50 kt</text>
  <rect x="188" y="54" width="154" height="38" rx="8" fill="#E9F5EE" stroke="#2E9D5B" stroke-width="1.4"/>
  <text x="265" y="70" text-anchor="middle" font-size="11" font-weight="700" fill="#1F6E41">TR 1, por el DC BAT BUS</text>
  <text x="265" y="84" text-anchor="middle" font-size="10.5" fill="#5B6B78">normal</text>
  <path d="M265 92 L265 101" fill="none" stroke="#5B6B78" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M265 106 L261 98.8 L269 98.8 Z" fill="#5B6B78"/>
  <rect x="188" y="106" width="154" height="90" rx="8" fill="#F3F5F7" stroke="#A9B4BD" stroke-width="1.4"/>
  <text x="265" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#1E2A33">ESS TR</text>
  <text x="265" y="136" text-anchor="middle" font-size="10.5" fill="#5B6B78">convierte la AC del</text>
  <text x="265" y="149" text-anchor="middle" font-size="10.5" fill="#5B6B78">AC ESS BUS: si falla un</text>
  <text x="265" y="162" text-anchor="middle" font-size="10.5" fill="#5B6B78">TR o el AC BUS 1, o con</text>
  <text x="265" y="175" text-anchor="middle" font-size="10.5" fill="#5B6B78">el EMER GEN</text>
  <path d="M265 196 L265 205" fill="none" stroke="#5B6B78" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M265 210 L261 202.8 L269 202.8 Z" fill="#5B6B78"/>
  <rect x="188" y="210" width="154" height="50" rx="8" fill="#F3F5F7" stroke="#A9B4BD" stroke-width="1.4"/>
  <text x="265" y="226" text-anchor="middle" font-size="11" font-weight="700" fill="#1E2A33">BAT 2</text>
  <text x="265" y="240" text-anchor="middle" font-size="10.5" fill="#5B6B78">sin EMER GEN</text>
  <rect x="14" y="272" width="332" height="28" rx="8" fill="#F3F5F7" stroke="#DDE3E8"/>
  <text x="180" y="290" text-anchor="middle" font-size="10.5" fill="#1E2A33">La última fuente de lo esencial son las baterías.</text>
</svg>
