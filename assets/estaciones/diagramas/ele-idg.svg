<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">IDG: del motor al AC BUS</title>
  <desc id="d">El motor mueve el IDG; su integrated drive gira constante para que el generador entregue 400 Hz. La GCU regula y conecta el generador al AC BUS con el GLC. FAULT: aceite sobre 180 °C o baja presión. IDG pb con guarda: máximo 3 s, motor girando, no se reconecta en vuelo.</desc>
  <rect x="1" y="1" width="358" height="298" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <rect x="16" y="14" width="170" height="34" rx="8" fill="#F3F5F7" stroke="#A9B4BD" stroke-width="1.6"/>
  <text x="101" y="36" text-anchor="middle" font-size="11" font-weight="600" fill="#33424D">Motor (accessory gearbox)</text>
  <path d="M101 48 L101 60" fill="none" stroke="#5B6B78" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M101 66 L97 58.8 L105 58.8 Z" fill="#5B6B78"/>
  <rect x="16" y="66" width="170" height="84" rx="8" fill="#E9F5EE" stroke="#2E9D5B" stroke-width="1.6"/>
  <text x="101" y="85" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F6E41">IDG</text>
  <rect x="26" y="92" width="150" height="24" rx="5" fill="#FFFFFF" stroke="#2E9D5B"/>
  <text x="101" y="108" text-anchor="middle" font-size="10" fill="#1E2A33">Integrated drive: giro constante</text>
  <rect x="26" y="120" width="150" height="24" rx="5" fill="#FFFFFF" stroke="#2E9D5B"/>
  <text x="101" y="136" text-anchor="middle" font-size="10" fill="#1E2A33">Generador: 90 KVA · 400 Hz</text>
  <path d="M101 150 L101 162" fill="none" stroke="#5B6B78" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M101 168 L97 160.8 L105 160.8 Z" fill="#5B6B78"/>
  <rect x="16" y="168" width="170" height="42" rx="8" fill="#FFFFFF" stroke="#8C99A3" stroke-width="1.6"/>
  <text x="101" y="185" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1E2A33">GCU</text>
  <text x="101" y="200" text-anchor="middle" font-size="10" fill="#5B6B78">regula voltaje y frecuencia</text>
  <path d="M101 210 L101 248" fill="none" stroke="#2E9D5B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="96.5" y="223.5" width="9" height="9" rx="2" fill="#2E9D5B" stroke="#2E9D5B" stroke-width="1.6"/>
  <text x="110" y="232" font-size="10" fill="#5B6B78">GLC 1</text>
  <rect x="41" y="248" width="120" height="18" rx="5" fill="#E9F5EE" stroke="#2E9D5B" stroke-width="1.6"/>
  <text x="101" y="260.96" text-anchor="middle" font-size="11" font-weight="700" fill="#1F6E41">AC BUS 1</text>
  <rect x="198" y="66" width="148" height="70" rx="8" fill="#FCEBD3" stroke="#D98A00" stroke-width="1.4"/>
  <text x="208" y="84" font-size="11" font-weight="700" fill="#8A5300">Luz FAULT del IDG</text>
  <text x="208" y="100" font-size="10.5" fill="#1E2A33">• aceite sobre 180 °C</text>
  <text x="208" y="114" font-size="10.5" fill="#1E2A33">• baja presión de aceite</text>
  <text x="208" y="128" font-size="10" fill="#5B6B78">Se apaga al desconectarlo</text>
  <rect x="198" y="146" width="148" height="92" rx="8" fill="#FFFFFF" stroke="#C8473B" stroke-width="1.6"/>
  <text x="208" y="164" font-size="11" font-weight="700" fill="#A53A30">IDG pb (con guarda)</text>
  <text x="208" y="180" font-size="10.5" fill="#1E2A33">• máximo 3 s apretado</text>
  <text x="208" y="194" font-size="10.5" fill="#1E2A33">• solo con el motor girando</text>
  <text x="216" y="208" font-size="10.5" fill="#1E2A33">o en windmilling</text>
  <text x="208" y="222" font-size="10.5" fill="#1E2A33">• en vuelo no se reconecta</text>
  <path d="M186 108 L198 101" fill="none" stroke="#5B6B78" stroke-width="1.2" stroke-dasharray="2 3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M186 128 L198 160" fill="none" stroke="#5B6B78" stroke-width="1.2" stroke-dasharray="2 3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="180" y="288" text-anchor="middle" font-size="10.5" fill="#5B6B78">A 200 °C el IDG se desconecta solo.</text>
</svg>
