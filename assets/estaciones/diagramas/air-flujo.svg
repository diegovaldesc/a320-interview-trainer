<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 256" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Selector PACK FLOW</title>
  <desc id="d">Tabla del selector PACK FLOW: LO, 80 % del caudal normal, con pocos pasajeros, y si no alcanza a enfriar sube solo a 100 %; NORM, 100 %; HI, 120 %, para humo, calor o humedad. Con un solo pack o con APU bleed, el sistema da HI aunque el selector diga otra cosa.</desc>
  <rect x="1" y="1" width="358" height="254" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Selector PACK FLOW</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">Caudal respecto del normal.</text>
  <rect x="18" y="60" width="324" height="36" rx="5" fill="#FFFFFF" stroke="#C9D3DB" stroke-width="1.4"/>
  <text x="34" y="83" font-size="12" font-weight="800" fill="#0E5E6F">LO</text>
  <text x="110" y="83" font-size="12" font-weight="800" fill="#1E2A33">80 %</text>
  <text x="160" y="76" font-size="10" fill="#33424D">Pocos pasajeros;</text>
  <text x="160" y="89" font-size="10" fill="#33424D">si no alcanza a enfriar, sube solo a 100 %</text>
  <rect x="18" y="104" width="324" height="36" rx="5" fill="#DCEEF1" stroke="#C9D3DB" stroke-width="1.4"/>
  <text x="34" y="127" font-size="12" font-weight="800" fill="#0E5E6F">NORM</text>
  <text x="110" y="127" font-size="12" font-weight="800" fill="#1E2A33">100 %</text>
  <text x="160" y="120" font-size="10" fill="#33424D">Lo normal</text>
  <rect x="18" y="148" width="324" height="36" rx="5" fill="#FFFFFF" stroke="#C9D3DB" stroke-width="1.4"/>
  <text x="34" y="171" font-size="12" font-weight="800" fill="#0E5E6F">HI</text>
  <text x="110" y="171" font-size="12" font-weight="800" fill="#1E2A33">120 %</text>
  <text x="160" y="164" font-size="10" fill="#33424D">Humo, calor o humedad</text>
  <rect x="18" y="200" width="324" height="44" rx="5" fill="#FCEBD3" stroke="#C77700" stroke-width="1.4"/>
  <text x="30" y="218" font-size="10.5" font-weight="700" fill="#C77700">HI automático, elija lo que elija la tripulación:</text>
  <text x="30" y="234" font-size="10.5" fill="#1E2A33">con un solo pack o con APU bleed.</text>
</svg>
