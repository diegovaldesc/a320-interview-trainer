<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Solo baterías</title>
  <desc id="d">BAT 1 alimenta el STAT INV, que alimenta AC STAT INV BUS y, sobre 50 kt, AC ESS BUS. BAT 2 alimenta DC ESS BUS. Las barras SHED se cortan. En tierra bajo 100 kt el DC BAT BUS se conecta a las baterías; bajo 50 kt se corta AC ESS y no quedan pantallas.</desc>
