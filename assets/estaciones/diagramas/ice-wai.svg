  <line x1="284" y1="170" x2="284" y2="100" stroke="#C77700" stroke-width="3" marker-end="url(#aC77700)"/>
  <circle cx="76" cy="132" r="7" fill="#FFFFFF" stroke="#33424D" stroke-width="1.5"/>
