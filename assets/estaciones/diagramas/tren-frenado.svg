  <line x1="260" y1="152" x2="252" y2="162" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <text x="260" y="182" text-anchor="middle" font-size="8" fill="#C9D3DB">L</text>
  <circle cx="308" cy="152" r="18" fill="#11181D" stroke="#55636E"/>
  <line x1="308" y1="152" x2="300" y2="162" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <text x="308" y="182" text-anchor="middle" font-size="8" fill="#C9D3DB">R</text>
