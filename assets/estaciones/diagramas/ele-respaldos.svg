<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 356" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">La escalera de respaldo</title>
  <desc id="d">Engine generators, external power en ON y APU GEN pueden con toda la red, en ese orden. Si se pierden todos, el EMER GEN movido por el RAT alimenta lo esencial. Las baterías son la última fuente: la BAT 1 por el static inverter alimenta el AC ESS BUS y la BAT 2 el DC ESS BUS, mientras sale el RAT o si el RAT se detiene.</desc>
  <rect x="1" y="1" width="358" height="354" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="18" y="24" font-size="11.5" font-weight="700" fill="#33424D">Si falta una fuente, entra la siguiente:</text>
  <rect x="14" y="34" width="332" height="44" rx="10" fill="#E9F5EE" stroke="#2E9D5B" stroke-width="1.4"/>
  <circle cx="34" cy="54" r="11" fill="#2E9D5B"/>
  <text x="34" y="58.5" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">1</text>
  <text x="54" y="53" font-size="11.5" font-weight="700" fill="#1E2A33">Engine generators (GEN 1 y GEN 2)</text>
  <text x="54" y="69" font-size="10.5" font-weight="400" fill="#33424D">cada uno puede con toda la red</text>
  <path d="M34 88 L30 80.8 L38 80.8 Z" fill="#8C99A3"/>
  <rect x="14" y="90" width="332" height="44" rx="10" fill="#E9F5EE" stroke="#2E9D5B" stroke-width="1.4"/>
  <circle cx="34" cy="110" r="11" fill="#2E9D5B"/>
  <text x="34" y="114.5" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">2</text>
  <text x="54" y="109" font-size="11.5" font-weight="700" fill="#1E2A33">External power, con su pb en ON</text>
  <text x="54" y="125" font-size="10.5" font-weight="400" fill="#33424D">en tierra; puede con toda la red</text>
  <path d="M34 144 L30 136.8 L38 136.8 Z" fill="#8C99A3"/>
  <rect x="14" y="146" width="332" height="44" rx="10" fill="#E9F5EE" stroke="#2E9D5B" stroke-width="1.4"/>
  <circle cx="34" cy="166" r="11" fill="#2E9D5B"/>
  <text x="34" y="170.5" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">3</text>
  <text x="54" y="165" font-size="11.5" font-weight="700" fill="#1E2A33">APU GEN</text>
  <text x="54" y="181" font-size="10.5" font-weight="400" fill="#33424D">puede con toda la red</text>
  <path d="M34 200 L30 192.8 L38 192.8 Z" fill="#8C99A3"/>
  <rect x="14" y="202" width="332" height="58" rx="10" fill="#EAF1FC" stroke="#2F6FD6" stroke-width="1.4"/>
  <circle cx="34" cy="222" r="11" fill="#2F6FD6"/>
  <text x="34" y="226.5" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">4</text>
  <text x="54" y="221" font-size="11.5" font-weight="700" fill="#1E2A33">EMER GEN, movido por el RAT</text>
  <text x="54" y="237" font-size="10.5" font-weight="400" fill="#33424D">el RAT sale solo sin AC BUS 1 ni 2, sobre 100 kt,</text>
  <text x="54" y="251" font-size="10.5" font-weight="400" fill="#33424D">y mueve el EMER GEN por el Blue: solo lo esencial</text>
  <path d="M34 270 L30 262.8 L38 262.8 Z" fill="#8C99A3"/>
  <rect x="14" y="272" width="332" height="74" rx="10" fill="#F3F5F7" stroke="#A9B4BD" stroke-width="1.4"/>
  <circle cx="34" cy="292" r="11" fill="#A9B4BD"/>
  <text x="34" y="296.5" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">5</text>
  <text x="54" y="291" font-size="11.5" font-weight="700" fill="#1E2A33">Baterías: la última fuente</text>
  <text x="54" y="307" font-size="10.5" font-weight="600" fill="#1E2A33">BAT 1 → static inverter → AC ESS BUS</text>
  <text x="54" y="321" font-size="10.5" font-weight="600" fill="#1E2A33">BAT 2 → DC ESS BUS</text>
  <text x="54" y="335" font-size="10.5" font-weight="400" fill="#33424D">mientras sale el RAT (unos 8 s) o si se detiene</text>
</svg>
