<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 272" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Rechazar o continuar</title>
  <desc id="d">Cinta de velocidad en tres tramos: bajo 100 kt, STOP, considerar seriamente rechazar ante cualquier alerta ECAM; de 100 kt a V1, go-minded, rechazar solo por fuego o daño severo, pérdida súbita de empuje, indicación inequívoca de que no volará o alerta ECAM; sobre V1, GO, continuar. Bajo 72 kt no hay ground spoilers ni autobrake.</desc>
  <rect x="1" y="1" width="358" height="270" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="18" y="26" font-size="12.5" font-weight="800" fill="#0E5E6F">Rechazar o continuar</text>
  <text x="18" y="42" font-size="10" fill="#5B6B78">La decisión es del comandante y se toma antes de V1.</text>
  <rect x="18" y="56" width="132" height="24" rx="4" fill="#F8E1DE" stroke="#C0392B" stroke-width="1.3"/>
  <text x="84" y="72" text-anchor="middle" font-size="11" font-weight="800" fill="#C0392B">STOP</text>
  <rect x="150" y="56" width="118" height="24" rx="4" fill="#FCEBD3" stroke="#C77700" stroke-width="1.3"/>
  <text x="209" y="72" text-anchor="middle" font-size="11" font-weight="800" fill="#C77700">go-minded</text>
  <rect x="268" y="56" width="74" height="24" rx="4" fill="#E5F4EA" stroke="#2E9D5B" stroke-width="1.3"/>
  <text x="305" y="72" text-anchor="middle" font-size="11" font-weight="800" fill="#2E9D5B">GO</text>
  <text x="150" y="94" text-anchor="middle" font-size="10" font-weight="800" fill="#1E2A33">100 kt</text>
  <text x="268" y="94" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1E2A33">V1</text>
  <line x1="150" y1="52" x2="150" y2="84" stroke="#1E2A33" stroke-width="1.4"/>
  <line x1="268" y1="52" x2="268" y2="84" stroke="#1E2A33" stroke-width="1.4"/>
  <rect x="18" y="116" width="84" height="22" rx="5" fill="#F8E1DE" stroke="#C0392B" stroke-width="1.3"/>
  <text x="60" y="131" text-anchor="middle" font-size="10" font-weight="800" fill="#C0392B">Bajo 100 kt</text>
  <text x="112" y="128" font-size="9.6" fill="#33424D">El comandante decide según el caso;</text>
  <text x="112" y="141" font-size="9.6" fill="#33424D">ante cualquier alerta ECAM, considerar</text>
  <text x="112" y="154" font-size="9.6" fill="#33424D">seriamente rechazar.</text>
  <rect x="18" y="166" width="84" height="22" rx="5" fill="#FCEBD3" stroke="#C77700" stroke-width="1.3"/>
  <text x="60" y="181" text-anchor="middle" font-size="10" font-weight="800" fill="#C77700">100 kt a V1</text>
  <text x="112" y="178" font-size="9.6" fill="#33424D">Rechazar solo por fuego o daño severo,</text>
  <text x="112" y="191" font-size="9.6" fill="#33424D">pérdida súbita de empuje, indicación</text>
  <text x="112" y="204" font-size="9.6" fill="#33424D">inequívoca de que no volará, o alerta ECAM.</text>
  <rect x="18" y="216" width="84" height="22" rx="5" fill="#E5F4EA" stroke="#2E9D5B" stroke-width="1.3"/>
  <text x="60" y="231" text-anchor="middle" font-size="10" font-weight="800" fill="#2E9D5B">Sobre V1</text>
  <text x="112" y="228" font-size="9.6" fill="#33424D">Continuar: puede no alcanzar la pista</text>
  <text x="112" y="241" font-size="9.6" fill="#33424D">que queda para detenerse.</text>
  <text x="18" y="262" font-size="9.3" fill="#5B6B78">Bajo 72 kt no hay ground spoilers ni autobrake: frenado manual.</text>
</svg>
