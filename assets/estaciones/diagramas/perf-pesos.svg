<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Cómo se construye el peso</title>
  <desc id="d">Pila de pesos de abajo hacia arriba: MEW; más los ítems del operador da el OEW; más el catering y los equipos del vuelo da el DOW; más la carga paga da el ZFW, que no puede pasar el MZFW; más el combustible al soltar frenos da el TOW, que no puede pasar el MTOW. Restando el trip fuel queda el LW, que no puede pasar el MLW. En rampa se suma el taxi fuel, y ese peso no pasa el MTW. Los ítems exactos de OEW y DOW los fija cada operador.</desc>
  <rect x="1" y="1" width="358" height="328" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Cómo se construye el peso</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">Cada peso se apoya en el anterior.</text>
  <rect x="24" y="216" width="168" height="62" rx="3" fill="#E4EAEF" stroke="#7F8D99" stroke-width="1.3"/>
  <text x="108" y="245" text-anchor="middle" font-size="11" font-weight="800" fill="#33424D">MEW</text>
  <text x="108" y="259" text-anchor="middle" font-size="10" fill="#33424D">estructura, motores, sistemas</text>
  <rect x="24" y="194" width="168" height="22" rx="3" fill="#DCE6EC" stroke="#7F8D99" stroke-width="1.3"/>
  <text x="108" y="209" text-anchor="middle" font-size="10.5" font-weight="700" fill="#33424D">Ítems del operador</text>
  <rect x="24" y="174" width="168" height="20" rx="3" fill="#D3E1E8" stroke="#7F8D99" stroke-width="1.3"/>
  <text x="108" y="188" text-anchor="middle" font-size="10.5" font-weight="700" fill="#33424D">Catering y equipos</text>
  <rect x="24" y="136" width="168" height="38" rx="3" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.3"/>
  <text x="108" y="159" text-anchor="middle" font-size="10.5" font-weight="700" fill="#33424D">Carga paga</text>
  <rect x="24" y="76" width="168" height="60" rx="3" fill="#FCEBD3" stroke="#C77700" stroke-width="1.3"/>
  <line x1="28" y1="110" x2="188" y2="110" stroke="#C77700" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="108" y="97" text-anchor="middle" font-size="10.5" font-weight="700" fill="#C77700">trip fuel</text>
  <text x="108" y="127" text-anchor="middle" font-size="10" fill="#C77700">queda al aterrizar</text>
  <line x1="192" y1="194" x2="206" y2="194" stroke="#1E2A33" stroke-width="1.1"/>
  <text x="210" y="198" font-size="11" font-weight="800" fill="#1E2A33">OEW</text>
  <line x1="192" y1="174" x2="206" y2="174" stroke="#1E2A33" stroke-width="1.1"/>
  <text x="210" y="178" font-size="11" font-weight="800" fill="#1E2A33">DOW</text>
  <text x="246" y="178" font-size="10.5" font-weight="700" fill="#5B6B78">listo para el vuelo</text>
  <line x1="192" y1="136" x2="206" y2="136" stroke="#1E2A33" stroke-width="1.1"/>
  <text x="210" y="140" font-size="11" font-weight="800" fill="#1E2A33">ZFW</text>
  <text x="246" y="140" font-size="10.5" font-weight="700" fill="#C77700">≤ MZFW</text>
  <line x1="192" y1="110" x2="206" y2="110" stroke="#1E2A33" stroke-width="1.1"/>
  <text x="210" y="114" font-size="11" font-weight="800" fill="#1E2A33">LW</text>
  <text x="246" y="114" font-size="10.5" font-weight="700" fill="#C77700">≤ MLW</text>
  <line x1="192" y1="76" x2="206" y2="76" stroke="#1E2A33" stroke-width="1.1"/>
  <text x="210" y="80" font-size="11" font-weight="800" fill="#1E2A33">TOW</text>
  <text x="246" y="80" font-size="10.5" font-weight="700" fill="#C77700">≤ MTOW</text>
  <text x="108" y="68" text-anchor="middle" font-size="10" font-weight="700" fill="#C77700">combustible al soltar frenos</text>
  <text x="18" y="302" font-size="10.5" fill="#33424D">En rampa se suma el taxi fuel: ese peso no pasa el MTW.</text>
  <text x="18" y="317" font-size="10.5" fill="#33424D">Los ítems exactos de OEW y DOW los fija cada operador.</text>
</svg>
