<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 256" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Antiskid</title>
  <desc id="d">Gráfico de velocidad en el tiempo durante la frenada: la velocidad de referencia del avión baja en línea recta, y la de una rueda va un poco debajo. Cuando la rueda se acerca a aproximadamente 0,87 veces la referencia, el antiskid le baja la presión y la rueda recupera velocidad. La referencia sale de los ADIRU o, sin ellos, de la rueda más rápida; bajo 20 kt de ground speed, el antiskid se desactiva.</desc>
  <rect x="1" y="1" width="358" height="254" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <defs><marker id="a8C99A3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8C99A3"/></marker><marker id="b8C99A3" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#8C99A3"/></marker></defs>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Antiskid</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">Cada rueda frena justo antes de patinar.</text>
  <line x1="44" y1="200" x2="340" y2="200" stroke="#8C99A3" stroke-width="1.2" marker-end="url(#a8C99A3)"/>
  <line x1="44" y1="200" x2="44" y2="62" stroke="#8C99A3" stroke-width="1.2" marker-end="url(#a8C99A3)"/>
  <text x="340" y="216" text-anchor="end" font-size="10" fill="#5B6B78">tiempo →</text>
  <text x="50" y="66" font-size="10" fill="#5B6B78">velocidad (kt)</text>
  <polyline points="44,74 336,140" fill="none" stroke="#0E5E6F" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="44,90.4 52,92 60,93.5 68,95.1 76,96.7 84,98.2 92,99.8 100,101.4 108,103 116,104.5 124,106.1 132,107.7 140,109.3 148,110.8 156,112.4 164,114 172,115.6 180,117.1 188,118.7 196,120.3 204,121.8 212,123.4 220,125 228,126.6 236,128.1 244,129.7 252,131.3 260,132.9 268,134.4 276,136 284,137.6 292,139.1 300,140.7 308,142.3 316,143.9 324,145.4 332,147" fill="none" stroke="#C0392B" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 3"/>
  <polyline points="44,75.9 48,78.4 52,80.8 56,83.2 60,85.6 64,88 68,90.4 72,92.7 76,95 80,97.3 84,95.1 88,92.5 92,90 96,87.5 100,89.8 104,92.1 108,94.4 112,96.6 116,98.9 120,101.1 124,103.2 128,105.4 132,107.6 136,105.7 140,103.4 144,101.2 148,99 152,101.2 156,103.4 160,105.5 164,107.6 168,109.7 172,111.7 176,113.8 180,115.8 184,117.8 188,116.2 192,114.3 196,112.4 200,110.6 204,112.6 208,114.7 212,116.6 216,118.6 220,120.5 224,122.4 228,124.3 232,126.2 236,128 240,126.8 244,125.2 248,123.7 252,122.2 256,124.1 260,125.9 264,127.8 268,129.6 272,131.4 276,133.1 280,134.9 284,136.6 288,138.3 292,137.3 296,136.1 300,134.9 304,133.8 308,135.5 312,137.2 316,138.9 320,140.6 324,142.2 328,143.8 332,145.4 336,147" fill="none" stroke="#1E2A33" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="262" y="113.3" text-anchor="middle" font-size="10.5" font-weight="800" fill="#0E5E6F" stroke="#FFFFFF" stroke-width="3" paint-order="stroke">avión (referencia)</text>
  <text x="262" y="151.2" text-anchor="middle" font-size="10.5" font-weight="800" fill="#C0392B" stroke="#FFFFFF" stroke-width="3" paint-order="stroke">≈ 0,87 × referencia</text>
  <text x="74" y="120" font-size="10.5" font-weight="800" fill="#1E2A33" stroke="#FFFFFF" stroke-width="3" paint-order="stroke">rueda</text>
  <text x="190" y="176" text-anchor="middle" font-size="10.5" fill="#33424D" stroke="#FFFFFF" stroke-width="3" paint-order="stroke">Al acercarse a ≈ 0,87: menos presión</text>
  <text x="190" y="190" text-anchor="middle" font-size="10.5" fill="#33424D" stroke="#FFFFFF" stroke-width="3" paint-order="stroke">y la rueda recupera velocidad.</text>
  <text x="18" y="226" font-size="10.5" fill="#33424D">Referencia: los ADIRU; sin ellos, la rueda más rápida.</text>
  <text x="18" y="242" font-size="10.5" fill="#33424D">Bajo 20 kt de ground speed, el antiskid se desactiva.</text>
</svg>
