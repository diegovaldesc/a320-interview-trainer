<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 296" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Desbalance máximo entre inner tanks</title>
  <desc id="d">Gráfico del desbalance máximo entre los inner tanks, con los outer balanceados, según el combustible del tanque más pesado. Despegue: 1 450 kg con 1 450 kg, 1 050 kg con 3 000 kg y 500 kg con el tanque lleno. En vuelo y aterrizaje: 2 250 kg con 2 250 kg, 1 600 kg con 4 300 kg y 1 500 kg con el tanque lleno; bajo 2 250 kg no hay límite. Entre los puntos, la variación es lineal.</desc>
