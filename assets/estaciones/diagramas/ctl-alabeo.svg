  <text x="157" y="196" text-anchor="middle" font-size="10.5" fill="#33424D">SEC 1</text>
  <rect x="184" y="140" width="42" height="40" rx="5" fill="#FDF3DC" stroke="#D99A00" stroke-width="1.6"/>
  <text x="205" y="157" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1E2A33">4</text>
