<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Distancia de aterrizaje requerida</title>
  <desc id="d">Pista con su LDA. En el despacho, en pista seca el avión debe detenerse dentro del 60 % de la LDA, con frenado manual máximo y sin reversores; en mojada, la distancia requerida es la seca multiplicada por 1,15. En vuelo, la in-flight landing distance multiplicada por 1,15 debe caber en la LDA.</desc>
  <rect x="1" y="1" width="358" height="228" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <defs><marker id="a33424D" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#33424D"/></marker><marker id="b33424D" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#33424D"/></marker></defs>
  <text x="18" y="26" font-size="12.5" font-weight="800" fill="#0E5E6F">Distancia de aterrizaje requerida</text>
  <text x="18" y="42" font-size="10" fill="#5B6B78">En el despacho, con frenado manual máximo y sin reversores.</text>
  <line x1="20" y1="64" x2="340" y2="64" stroke="#33424D" stroke-width="1.2" marker-end="url(#a33424D)" marker-start="url(#b33424D)"/>
  <text x="180" y="59" text-anchor="middle" font-size="10.5" font-weight="800" fill="#33424D" stroke="#FFFFFF" stroke-width="3" paint-order="stroke">LDA</text>
  <rect x="18" y="72" width="324" height="26" rx="2" fill="#4A5560" stroke="#4A5560" stroke-width="1"/>
  <line x1="30" y1="85" x2="332" y2="85" stroke="#FFFFFF" stroke-width="1.4" stroke-dasharray="10 8"/>
  <rect x="22" y="75" width="8" height="3" rx="0.5" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.5"/>
  <rect x="22" y="80.5" width="8" height="3" rx="0.5" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.5"/>
  <rect x="22" y="86" width="8" height="3" rx="0.5" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.5"/>
  <rect x="22" y="91.5" width="8" height="3" rx="0.5" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.5"/>
  <line x1="212.4" y1="98" x2="212.4" y2="170" stroke="#0E5E6F" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="212.4" y="182" text-anchor="middle" font-size="10" font-weight="800" fill="#0E5E6F">60 %</text>
  <rect x="18" y="112" width="194.4" height="18" rx="4" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.3"/>
  <text x="26" y="125" font-size="9.8" font-weight="700" fill="#0E5E6F">Seca: detenerse en el 60 % de la LDA</text>
  <rect x="18" y="140" width="223.6" height="18" rx="4" fill="#E6EFFA" stroke="#2F6FB5" stroke-width="1.3"/>
  <text x="26" y="153" font-size="9.8" font-weight="700" fill="#2F6FB5">Mojada: la seca × 1,15</text>
  <text x="18" y="204" font-size="9.3" fill="#33424D">Desde 50 ft sobre el umbral hasta detenerse. En vuelo:</text>
  <text x="18" y="218" font-size="9.3" fill="#33424D">la in-flight landing distance × 1,15 debe caber en la LDA.</text>
</svg>
