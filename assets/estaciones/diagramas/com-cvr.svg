<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 242" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Cuándo graba el CVR</title>
  <desc id="d">Línea de tiempo: el CVR graba solo los primeros 5 minutos después de energizar el avión, desde el primer motor en marcha, en vuelo y hasta 5 minutos después de apagar el último motor. En tierra, GND CTL lo hace grabar a mano. Guarda 2 horas (hasta el MSN 09324) o 25 horas (desde el 10949). Para borrar: CVR ERASE 2 segundos, en tierra y con parking brake.</desc>
  <rect x="1" y="1" width="358" height="240" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Cuándo graba el CVR</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">Sin hacer nada.</text>
  <line x1="16" y1="120" x2="344" y2="120" stroke="#C9D3DB" stroke-width="6" stroke-linecap="round"/>
  <line x1="20" y1="120" x2="80" y2="120" stroke="#2E9D5B" stroke-width="6"/>
  <line x1="110" y1="120" x2="300" y2="120" stroke="#2E9D5B" stroke-width="6"/>
  <line x1="300" y1="120" x2="336" y2="120" stroke="#2E9D5B" stroke-width="6"/>
  <line x1="20" y1="110" x2="20" y2="130" stroke="#1E2A33" stroke-width="1.2"/>
  <text x="20" y="102" text-anchor="start" font-size="10" fill="#33424D">Energizar</text>
  <line x1="80" y1="110" x2="80" y2="130" stroke="#1E2A33" stroke-width="1.2"/>
  <text x="80" y="148" text-anchor="middle" font-size="10" fill="#33424D">+5 min</text>
  <line x1="110" y1="110" x2="110" y2="130" stroke="#1E2A33" stroke-width="1.2"/>
  <text x="110" y="102" text-anchor="middle" font-size="10" fill="#33424D">1er motor</text>
  <line x1="175" y1="110" x2="175" y2="130" stroke="#1E2A33" stroke-width="1.2"/>
  <text x="175" y="148" text-anchor="middle" font-size="10" fill="#33424D">Despegue</text>
  <line x1="240" y1="110" x2="240" y2="130" stroke="#1E2A33" stroke-width="1.2"/>
  <text x="240" y="102" text-anchor="middle" font-size="10" fill="#33424D">Aterrizaje</text>
  <line x1="300" y1="110" x2="300" y2="130" stroke="#1E2A33" stroke-width="1.2"/>
  <text x="300" y="148" text-anchor="middle" font-size="10" fill="#33424D">Último motor</text>
  <line x1="336" y1="110" x2="336" y2="130" stroke="#1E2A33" stroke-width="1.2"/>
  <text x="336" y="102" text-anchor="end" font-size="10" fill="#33424D">+5 min</text>
  <text x="16" y="78" font-size="10.5" font-weight="700" fill="#2E9D5B">Verde: graba solo.</text>
  <text x="16" y="186" font-size="10.5" fill="#33424D">En tierra, GND CTL lo hace grabar a mano.</text>
  <text x="16" y="204" font-size="10.5" fill="#33424D">Guarda 2 h (hasta el MSN 09324) o 25 h (desde el 10949).</text>
  <text x="16" y="228" font-size="10.5" font-weight="700" fill="#C0392B">Borrar: CVR ERASE 2 s, en tierra y con parking brake.</text>
</svg>
