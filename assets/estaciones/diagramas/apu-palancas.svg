<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Thrust levers</title>
  <desc id="d">Las seis posiciones de las thrust levers, de adelante hacia atrás: TO/GA, despegue y go-around; FLX/MCT, FLEX o máximo continuo; CL, climb; IDLE (0); REV IDLE, reversa en idle; y MAX REV, reversa máxima. Entre IDLE y CL está el rango del A/THR. Las palancas solo se mueven a mano.</desc>
  <rect x="1" y="1" width="358" height="318" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Thrust levers</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">Seis posiciones, de adelante hacia atrás.</text>
  <rect x="40" y="56" width="26" height="236" rx="6" fill="#F3F5F7" stroke="#8C99A3" stroke-width="1.4"/>
  <line x1="36" y1="72" x2="70" y2="72" stroke="#33424D" stroke-width="2"/>
  <text x="84" y="76" font-size="11.5" font-weight="800" fill="#0E5E6F">TO/GA</text>
  <text x="170" y="76" font-size="10.5" fill="#33424D">despegue y go-around</text>
  <line x1="36" y1="114" x2="70" y2="114" stroke="#33424D" stroke-width="2"/>
  <text x="84" y="118" font-size="11.5" font-weight="800" fill="#0E5E6F">FLX/MCT</text>
  <text x="170" y="118" font-size="10.5" fill="#33424D">FLEX o máximo continuo</text>
  <line x1="36" y1="156" x2="70" y2="156" stroke="#33424D" stroke-width="2"/>
  <text x="84" y="160" font-size="11.5" font-weight="800" fill="#0E5E6F">CL</text>
  <text x="170" y="160" font-size="10.5" fill="#33424D">climb</text>
  <line x1="36" y1="198" x2="70" y2="198" stroke="#33424D" stroke-width="2"/>
  <text x="84" y="202" font-size="11.5" font-weight="800" fill="#0E5E6F">IDLE (0)</text>
  <line x1="36" y1="240" x2="70" y2="240" stroke="#C0392B" stroke-width="2"/>
  <text x="84" y="244" font-size="11.5" font-weight="800" fill="#C0392B">REV IDLE</text>
  <text x="170" y="244" font-size="10.5" fill="#33424D">reversa en idle</text>
  <line x1="36" y1="282" x2="70" y2="282" stroke="#C0392B" stroke-width="2"/>
  <text x="84" y="286" font-size="11.5" font-weight="800" fill="#C0392B">MAX REV</text>
  <text x="170" y="286" font-size="10.5" fill="#33424D">reversa máxima</text>
  <rect x="74" y="164" width="270" height="22" rx="4" fill="#DCEEF1" stroke="none" stroke-width="0"/>
  <text x="84" y="179" font-size="10" font-weight="700" fill="#0E5E6F">Entre IDLE y CL: rango del A/THR</text>
  <text x="84" y="306" font-size="10.5" font-weight="700" fill="#1E2A33">Solo se mueven a mano.</text>
</svg>
