<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 276" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">El APU por dentro</title>
  <desc id="d">Esquema del APU: el aire entra por la air intake flap a una turbina de gas de un solo eje, que produce el bleed y, por un eje, mueve la caja de accesorios con el generador y el starter. El ECB controla el arranque, la vigilancia y el apagado. El combustible viene de la línea izquierda y el aceite es propio.</desc>
  <rect x="1" y="1" width="358" height="274" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <defs><marker id="aC77700" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#C77700"/></marker><marker id="a0E5E6F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0E5E6F"/></marker><marker id="a2E9D5B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2E9D5B"/></marker></defs>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">El APU por dentro</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">Esquema simplificado.</text>
  <rect x="20" y="62" width="92" height="34" rx="7" fill="#F3F5F7" stroke="#8C99A3" stroke-width="1.4"/>
  <text x="66" y="76.5" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1E2A33">Air intake</text>
  <text x="66" y="89.5" text-anchor="middle" font-size="10" fill="#33424D">flap eléctrica</text>
  <line x1="112" y1="79" x2="140" y2="79" stroke="#C77700" stroke-width="2" marker-end="url(#aC77700)"/>
  <rect x="142" y="58" width="120" height="42" rx="7" fill="#FCEBD3" stroke="#C77700" stroke-width="1.4"/>
  <text x="202" y="76.5" text-anchor="middle" font-size="11" font-weight="800" fill="#C77700">Turbina de gas</text>
  <text x="202" y="89.5" text-anchor="middle" font-size="10" fill="#33424D">un solo eje</text>
  <line x1="262" y1="79" x2="300" y2="79" stroke="#C77700" stroke-width="2.2" marker-end="url(#aC77700)"/>
  <text x="304" y="76" font-size="10.5" font-weight="700" fill="#C77700">Bleed</text>
  <text x="304" y="89" font-size="10" fill="#33424D">neumático</text>
  <line x1="202" y1="100" x2="202" y2="128" stroke="#33424D" stroke-width="2" stroke-dasharray="1.5 3"/>
  <rect x="132" y="130" width="140" height="40" rx="7" fill="#F3F5F7" stroke="#8C99A3" stroke-width="1.4"/>
  <text x="202" y="147.5" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1E2A33">Caja de accesorios</text>
  <text x="202" y="160.5" text-anchor="middle" font-size="10" fill="#33424D">generador · starter</text>
  <rect x="16" y="196" width="126" height="40" rx="7" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.4"/>
  <text x="79" y="213.5" text-anchor="middle" font-size="11" font-weight="800" fill="#0E5E6F">ECB</text>
  <text x="79" y="226.5" text-anchor="middle" font-size="10" fill="#33424D">arranca, vigila, apaga</text>
  <polyline points="142,188 202,188 202,172" fill="none" stroke="#0E5E6F" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 3" marker-end="url(#a0E5E6F)"/>
  <rect x="150" y="196" width="96" height="40" rx="7" fill="#E5F4EA" stroke="#2E9D5B" stroke-width="1.4"/>
  <text x="198" y="213.5" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1E2A33">Combustible</text>
  <text x="198" y="226.5" text-anchor="middle" font-size="10" fill="#33424D">línea izquierda</text>
  <rect x="256" y="196" width="88" height="40" rx="7" fill="#F3F5F7" stroke="#8C99A3" stroke-width="1.4"/>
  <text x="300" y="213.5" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1E2A33">Aceite</text>
  <text x="300" y="226.5" text-anchor="middle" font-size="10" fill="#33424D">propio</text>
  <line x1="20" y1="258.5" x2="40" y2="258.5" stroke="#C77700" stroke-width="2"/>
  <text x="45" y="262" font-size="10" fill="#33424D">Aire</text>
  <line x1="75" y1="258.5" x2="95" y2="258.5" stroke="#0E5E6F" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="100" y="262" font-size="10" fill="#33424D">Control</text>
  <line x1="145" y1="258.5" x2="165" y2="258.5" stroke="#33424D" stroke-width="2" stroke-dasharray="1.5 3"/>
  <text x="170" y="262" font-size="10" fill="#33424D">Eje mecánico</text>
</svg>
