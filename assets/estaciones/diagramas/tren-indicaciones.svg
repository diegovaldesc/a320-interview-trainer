<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 318" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Indicaciones del tren</title>
  <desc id="d">A la izquierda, el panel LDG GEAR, que depende solo del LGCIU 1, con un triángulo verde y un UNLK rojo para la pata izquierda, la de nariz y la derecha. A la derecha, la página WHEEL, con dos triángulos por pata: el 1 del LGCIU 1 y el 2 del LGCIU 2. Cada triángulo: verde, trabada abajo; rojo, en tránsito; nada, arriba y trabada si ese LGCIU funciona; cruces ámbar, ese LGCIU falló.</desc>
