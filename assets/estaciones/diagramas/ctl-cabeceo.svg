<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 348" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Quién mueve el pitch</title>
  <desc id="d">Elevator izquierdo con dos actuadores, Blue y Green; elevator derecho con Yellow y Blue. El THS lo mueven dos motores hidráulicos, Green y Yellow, mandados por tres motores eléctricos o por el trim wheel. Manda un computador a la vez: en normal el ELAC 2, con los jacks Green a la izquierda y Yellow a la derecha y el motor 1 del THS; si falla, el ELAC 1, con los jacks Blue y el motor 2; sin ELAC, el SEC 1 o el SEC 2, con el motor 2 o el 3. El otro jack de cada elevator acompaña en damping.</desc>
  <rect x="1" y="1" width="358" height="346" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Quién mueve el pitch</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">Dos elevators y el THS; manda un computador a la vez.</text>
  <rect x="18" y="56" width="100" height="86" rx="8" fill="#DDF0F1" stroke="#0E7C86" stroke-width="1.6"/>
  <text x="68" y="76" text-anchor="middle" font-size="11" font-weight="800" fill="#1E2A33">Elevator izq.</text>
  <rect x="48" y="86" width="16" height="16" rx="3" fill="#EAF1FC" stroke="#2F6FD6" stroke-width="1.5"/>
  <text x="56" y="98" text-anchor="middle" font-size="10.5" font-weight="800" fill="#2F6FD6">B</text>
  <rect x="72" y="86" width="16" height="16" rx="3" fill="#E9F5EE" stroke="#2E9D5B" stroke-width="1.5"/>
  <text x="80" y="98" text-anchor="middle" font-size="10.5" font-weight="800" fill="#2E9D5B">G</text>
  <text x="68" y="124" text-anchor="middle" font-size="10" fill="#5B6B78">2 actuadores</text>
  <rect x="242" y="56" width="100" height="86" rx="8" fill="#DDF0F1" stroke="#0E7C86" stroke-width="1.6"/>
  <text x="292" y="76" text-anchor="middle" font-size="11" font-weight="800" fill="#1E2A33">Elevator der.</text>
  <rect x="272" y="86" width="16" height="16" rx="3" fill="#FDF3DC" stroke="#D99A00" stroke-width="1.5"/>
  <text x="280" y="98" text-anchor="middle" font-size="10.5" font-weight="800" fill="#D99A00">Y</text>
  <rect x="296" y="86" width="16" height="16" rx="3" fill="#EAF1FC" stroke="#2F6FD6" stroke-width="1.5"/>
  <text x="304" y="98" text-anchor="middle" font-size="10.5" font-weight="800" fill="#2F6FD6">B</text>
  <text x="292" y="124" text-anchor="middle" font-size="10" fill="#5B6B78">2 actuadores</text>
  <rect x="128" y="56" width="104" height="86" rx="8" fill="#FFFFFF" stroke="#0E7C86" stroke-width="1.6"/>
  <text x="180" y="74" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0E7C86">THS</text>
  <rect x="154" y="80" width="16" height="16" rx="3" fill="#E9F5EE" stroke="#2E9D5B" stroke-width="1.5"/>
  <text x="162" y="92" text-anchor="middle" font-size="10.5" font-weight="800" fill="#2E9D5B">G</text>
  <rect x="190" y="80" width="16" height="16" rx="3" fill="#FDF3DC" stroke="#D99A00" stroke-width="1.5"/>
  <text x="198" y="92" text-anchor="middle" font-size="10.5" font-weight="800" fill="#D99A00">Y</text>
  <text x="180" y="110" text-anchor="middle" font-size="10" fill="#5B6B78">3 motores eléctricos</text>
  <text x="180" y="126" text-anchor="middle" font-size="10" fill="#5B6B78">y trim wheel</text>
  <text x="18" y="172" font-size="10" font-weight="800" fill="#5B6B78">Manda</text>
  <text x="140" y="172" font-size="10" font-weight="800" fill="#5B6B78">Jacks de elevators</text>
  <text x="266" y="172" font-size="10" font-weight="800" fill="#5B6B78">Motor del THS</text>
  <line x1="18" y1="180" x2="342" y2="180" stroke="#C9D3DB" stroke-width="1"/>
  <text x="18" y="197" font-size="11" font-weight="800" fill="#0E7C86">1 · ELAC 2</text>
  <text x="32" y="211" font-size="10" fill="#5B6B78">normal</text>
  <rect x="140" y="191" width="16" height="16" rx="3" fill="#E9F5EE" stroke="#2E9D5B" stroke-width="1.5"/>
  <text x="148" y="203" text-anchor="middle" font-size="10.5" font-weight="800" fill="#2E9D5B">G</text>
  <text x="160" y="203" font-size="10.5" fill="#33424D">izq.</text>
  <rect x="192" y="191" width="16" height="16" rx="3" fill="#FDF3DC" stroke="#D99A00" stroke-width="1.5"/>
  <text x="200" y="203" text-anchor="middle" font-size="10.5" font-weight="800" fill="#D99A00">Y</text>
  <text x="212" y="203" font-size="10.5" fill="#33424D">der.</text>
  <text x="266" y="203" font-size="10.5" font-weight="700" fill="#1E2A33">motor 1</text>
  <line x1="18" y1="218" x2="342" y2="218" stroke="#C9D3DB" stroke-width="1"/>
  <text x="18" y="235" font-size="11" font-weight="800" fill="#1E2A33">2 · ELAC 1</text>
  <text x="32" y="249" font-size="10" fill="#5B6B78">si falla ELAC 2</text>
  <rect x="140" y="229" width="16" height="16" rx="3" fill="#EAF1FC" stroke="#2F6FD6" stroke-width="1.5"/>
  <text x="148" y="241" text-anchor="middle" font-size="10.5" font-weight="800" fill="#2F6FD6">B</text>
  <text x="160" y="241" font-size="10.5" fill="#33424D">los dos</text>
  <text x="266" y="241" font-size="10.5" font-weight="700" fill="#1E2A33">motor 2</text>
  <line x1="18" y1="256" x2="342" y2="256" stroke="#C9D3DB" stroke-width="1"/>
  <text x="18" y="273" font-size="11" font-weight="800" fill="#1E2A33">3 · SEC 1 o 2</text>
  <text x="32" y="287" font-size="10" fill="#5B6B78">sin ELAC</text>
  <text x="140" y="279" font-size="10.5" fill="#33424D">según la falla</text>
  <text x="266" y="279" font-size="10.5" font-weight="700" fill="#1E2A33">motor 2 o 3</text>
  <line x1="18" y1="294" x2="342" y2="294" stroke="#C9D3DB" stroke-width="1"/>
  <text x="18" y="312" font-size="10.5" fill="#33424D">El otro jack de cada elevator acompaña en damping.</text>
  <rect x="18" y="322" width="14" height="14" rx="3" fill="#E9F5EE" stroke="#2E9D5B" stroke-width="1.5"/>
  <text x="25" y="333" text-anchor="middle" font-size="10.5" font-weight="800" fill="#2E9D5B">G</text>
  <text x="37" y="334" font-size="10.5" fill="#1E2A33">Green</text>
  <rect x="84" y="322" width="14" height="14" rx="3" fill="#EAF1FC" stroke="#2F6FD6" stroke-width="1.5"/>
  <text x="91" y="333" text-anchor="middle" font-size="10.5" font-weight="800" fill="#2F6FD6">B</text>
  <text x="103" y="334" font-size="10.5" fill="#1E2A33">Blue</text>
  <rect x="144" y="322" width="14" height="14" rx="3" fill="#FDF3DC" stroke="#D99A00" stroke-width="1.5"/>
  <text x="151" y="333" text-anchor="middle" font-size="10.5" font-weight="800" fill="#D99A00">Y</text>
  <text x="163" y="334" font-size="10.5" fill="#1E2A33">Yellow</text>
</svg>
