<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 318" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">LOSS OF BRAKING</title>
  <desc id="d">Las líneas del procedimiento de memoria, tal como se leen. If no braking: REV, MAX; BRAKE PEDALS, RELEASE; A/SKID OFF, ORDER; A/SKID &amp; N/W STRG, OFF; BRAKE PEDALS, PRESS; MAX BRK PR, 1000 PSI. If still no braking: PARK BRAKE, USE, con aplicaciones cortas y sucesivas. El PF suelta los pedales antes del cambio a alternate. No hay que confundirlo con desacelerar menos en una pista mojada o contaminada.</desc>
  <rect x="1" y="1" width="358" height="316" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">LOSS OF BRAKING</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">Memory items: solo si los pedales no frenan nada.</text>
  <rect x="18" y="52" width="324" height="216" rx="8" fill="#F3F5F7" stroke="#C9D3DB" stroke-width="1"/>
  <text x="30" y="68" font-size="10.5" font-weight="800" fill="#C77700">If no braking:</text>
  <text x="30" y="88" font-size="11" font-weight="800" fill="#1E2A33">REV</text>
  <line x1="62" y1="85" x2="298" y2="85" stroke="#8C99A3" stroke-width="1" stroke-dasharray="1 3"/>
  <text x="330" y="88" text-anchor="end" font-size="11" font-weight="800" fill="#0E5E6F">MAX</text>
  <text x="30" y="108" font-size="11" font-weight="800" fill="#1E2A33">BRAKE PEDALS</text>
  <line x1="129.2" y1="105" x2="266" y2="105" stroke="#8C99A3" stroke-width="1" stroke-dasharray="1 3"/>
  <text x="330" y="108" text-anchor="end" font-size="11" font-weight="800" fill="#0E5E6F">RELEASE</text>
  <text x="30" y="128" font-size="11" font-weight="800" fill="#1E2A33">A/SKID OFF</text>
  <line x1="110.8" y1="125" x2="282" y2="125" stroke="#8C99A3" stroke-width="1" stroke-dasharray="1 3"/>
  <text x="330" y="128" text-anchor="end" font-size="11" font-weight="800" fill="#0E5E6F">ORDER</text>
  <text x="30" y="148" font-size="11" font-weight="800" fill="#1E2A33">A/SKID &amp; N/W STRG</text>
  <line x1="152.4" y1="145" x2="298" y2="145" stroke="#8C99A3" stroke-width="1" stroke-dasharray="1 3"/>
  <text x="330" y="148" text-anchor="end" font-size="11" font-weight="800" fill="#0E5E6F">OFF</text>
  <text x="30" y="168" font-size="11" font-weight="800" fill="#1E2A33">BRAKE PEDALS</text>
  <line x1="129.2" y1="165" x2="282" y2="165" stroke="#8C99A3" stroke-width="1" stroke-dasharray="1 3"/>
  <text x="330" y="168" text-anchor="end" font-size="11" font-weight="800" fill="#0E5E6F">PRESS</text>
  <text x="30" y="188" font-size="11" font-weight="800" fill="#1E2A33">MAX BRK PR</text>
  <line x1="108.4" y1="185" x2="267.6" y2="185" stroke="#8C99A3" stroke-width="1" stroke-dasharray="1 3"/>
  <text x="330" y="188" text-anchor="end" font-size="11" font-weight="800" fill="#0E5E6F">1000 PSI</text>
  <text x="30" y="210" font-size="10.5" font-weight="800" fill="#C77700">If still no braking:</text>
  <text x="30" y="230" font-size="11" font-weight="800" fill="#1E2A33">PARK BRAKE</text>
  <line x1="113.2" y1="227" x2="298" y2="227" stroke="#8C99A3" stroke-width="1" stroke-dasharray="1 3"/>
  <text x="330" y="230" text-anchor="end" font-size="11" font-weight="800" fill="#0E5E6F">USE</text>
  <text x="30" y="252" font-size="10" fill="#33424D">aplicaciones cortas y sucesivas</text>
  <text x="18" y="290" font-size="10" fill="#33424D">El PF suelta los pedales antes de que el PM pase el switch a OFF.</text>
  <text x="18" y="306" font-size="10.5" font-weight="800" fill="#C0392B">Desacelerar menos en pista mojada no es LOSS OF BRAKING.</text>
</svg>
