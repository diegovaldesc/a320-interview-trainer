<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Cómo funciona la PTU</title>
  <desc id="d">La PTU tiene dos unidades hidráulicas unidas por un eje. El sistema con presión hace girar su unidad como motor; el eje mueve la otra unidad, que funciona como bomba. Pasa potencia, no fluido, y funciona en ambos sentidos.</desc>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5B6B78"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="358" height="268" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>

  <!-- tuberías -->
  <line x1="90" y1="46" x2="90" y2="96" stroke="#D99A00" stroke-width="6" stroke-linecap="round"/>
  <line x1="270" y1="46" x2="270" y2="96" stroke="#2E9D5B" stroke-width="6" stroke-linecap="round"/>
  <text x="90" y="34" text-anchor="middle" font-size="12" font-weight="700" fill="#A87700">YELLOW con presión</text>
  <text x="270" y="34" text-anchor="middle" font-size="12" font-weight="700" fill="#24804A">GREEN sin presión</text>

  <!-- unidades -->
  <rect x="34" y="96" width="112" height="66" rx="12" fill="#FCF4DE" stroke="#D99A00" stroke-width="2.5"/>
  <text x="90" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#1E2A33">Unidad Yellow</text>
  <text x="90" y="143" text-anchor="middle" font-size="11.5" fill="#33424D">gira como motor</text>
  <rect x="214" y="96" width="112" height="66" rx="12" fill="#E9F5EE" stroke="#2E9D5B" stroke-width="2.5"/>
  <text x="270" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#1E2A33">Unidad Green</text>
  <text x="270" y="143" text-anchor="middle" font-size="11.5" fill="#33424D">gira como bomba</text>

  <!-- eje -->
  <rect x="146" y="121" width="68" height="16" rx="4" fill="#8A99A6"/>
  <path d="M166 112 a14 14 0 0 1 28 0" fill="none" stroke="#5B6B78" stroke-width="2" marker-end="url(#fl)"/>
  <text x="180" y="156" text-anchor="middle" font-size="11" fill="#5B6B78">eje</text>

  <!-- flecha de potencia -->
  <line x1="70" y1="186" x2="290" y2="186" stroke="#5B6B78" stroke-width="2" marker-end="url(#fl)" marker-start="url(#fl)"/>
  <rect x="84" y="175" width="192" height="22" rx="11" fill="#FFFFFF"/>
  <text x="180" y="190" text-anchor="middle" font-size="12" font-weight="600" fill="#33424D">potencia en ambos sentidos</text>

  <!-- notas -->
  <text x="180" y="220" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1E2A33">Pasa potencia, no fluido</text>
  <text x="180" y="240" text-anchor="middle" font-size="11.5" fill="#33424D">Actúa solo si la diferencia entre Green y Yellow</text>
  <text x="180" y="256" text-anchor="middle" font-size="11.5" fill="#33424D">supera 500 PSI (PTU pb en AUTO)</text>
</svg>
