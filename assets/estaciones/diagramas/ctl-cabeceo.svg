  <rect x="18" y="250" width="92" height="58" rx="8" fill="#FFFFFF" stroke="#C9D3DB" stroke-width="1.4"/>
  <text x="64" y="268" text-anchor="middle" font-size="11" font-weight="700" fill="#1E2A33">Pedales</text>
  <text x="64" y="283" text-anchor="middle" font-size="9.5" fill="#5B6B78">mando mecánico</text>
