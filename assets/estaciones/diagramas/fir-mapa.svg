<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 312" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Dónde hay protección contra fuego</title>
  <desc id="d">Tabla de la protección contra fuego. Motores: detección de fuego con dos loops y dos botellas por motor, descarga manual. APU: detección con dos loops y una botella, descarga automática en tierra. Bodegas: detectores de humo y descarga manual con el DISCH pb. Lavatorios: un detector de humo y extinción automática en el wastebin. Aviónica: un detector de humo y sin extinción. Además, extintores portátiles.</desc>
  <rect x="1" y="1" width="358" height="310" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Dónde hay protección contra fuego</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">Detección y extinción.</text>
  <rect x="16" y="58" width="328" height="40" rx="6" fill="#F8E1DE" stroke="#C0392B" stroke-width="1.4"/>
  <text x="28" y="78" font-size="11" font-weight="800" fill="#C0392B">Motores</text>
  <text x="120" y="76" font-size="10.5" fill="#33424D">Fuego: 2 loops</text>
  <text x="120" y="91" font-size="10.5" fill="#33424D">Dos botellas · manual</text>
  <rect x="16" y="104" width="328" height="40" rx="6" fill="#F8E1DE" stroke="#C0392B" stroke-width="1.4"/>
  <text x="28" y="124" font-size="11" font-weight="800" fill="#C0392B">APU</text>
  <text x="120" y="122" font-size="10.5" fill="#33424D">Fuego: 2 loops</text>
  <text x="120" y="137" font-size="10.5" fill="#33424D">Una botella · automática en tierra</text>
  <rect x="16" y="150" width="328" height="40" rx="6" fill="#FFFFFF" stroke="#C9D3DB" stroke-width="1.4"/>
  <text x="28" y="170" font-size="11" font-weight="800" fill="#1E2A33">Bodegas</text>
  <text x="120" y="168" font-size="10.5" fill="#33424D">Humo: detectores</text>
  <text x="120" y="183" font-size="10.5" fill="#33424D">Descarga manual (DISCH pb)</text>
  <rect x="16" y="196" width="328" height="40" rx="6" fill="#FFFFFF" stroke="#C9D3DB" stroke-width="1.4"/>
  <text x="28" y="216" font-size="11" font-weight="800" fill="#1E2A33">Lavatorios</text>
  <text x="120" y="214" font-size="10.5" fill="#33424D">Humo: un detector</text>
  <text x="120" y="229" font-size="10.5" fill="#33424D">Wastebin: extinción automática</text>
  <rect x="16" y="242" width="328" height="40" rx="6" fill="#F3F5F7" stroke="#8C99A3" stroke-width="1.4"/>
  <text x="28" y="262" font-size="11" font-weight="800" fill="#1E2A33">Aviónica</text>
  <text x="120" y="260" font-size="10.5" fill="#33424D">Humo: un detector</text>
  <text x="120" y="275" font-size="10.5" fill="#33424D">Sin extinción</text>
  <text x="16" y="298" font-size="10.5" fill="#5B6B78">Además: extintores portátiles en cabina y cockpit.</text>
</svg>
