<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 302" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Planificar la ruta con un motor</title>
  <desc id="d">Perfil de la ruta sobre el terreno: la trayectoria que vuela el avión con un motor (gross) y, debajo, la net flight path, un cálculo 1,1 % peor que no se vuela. En el dibujo, la net pasa al menos 2 000 ft sobre el punto más alto. Se cumple una de dos condiciones, a 5 NM de cada lado de la ruta: gradiente positivo a 1 000 ft sobre el terreno, o bajar hasta un aeródromo librando 2 000 ft. Si no se cumple: menos peso, otra ruta o puntos de retorno.</desc>
  <rect x="1" y="1" width="358" height="300" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <defs><marker id="a33424D" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#33424D"/></marker><marker id="b33424D" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#33424D"/></marker></defs>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Planificar la ruta con un motor</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">La net flight path es un cálculo con margen.</text>
  <polygon points="14,214 14,200 70,190 130,170 170,140 196,132 222,150 262,176 346,192 346,214" fill="#EFE5DA" stroke="#A07C55" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="30" y="207" font-size="10" font-weight="700" fill="#A07C55">terreno</text>
  <polyline points="30,62 340,92" fill="none" stroke="#0E5E6F" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="30,62 340,108" fill="none" stroke="#5B6B78" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/>
  <text x="338" y="75" text-anchor="end" font-size="10.5" font-weight="800" fill="#0E5E6F" stroke="#FFFFFF" stroke-width="3" paint-order="stroke">lo que vuela el avión (gross)</text>
  <text x="340" y="125" text-anchor="end" font-size="10.5" font-weight="700" fill="#5B6B78" stroke="#FFFFFF" stroke-width="3" paint-order="stroke">net: 1,1 % peor; no se vuela</text>
  <line x1="196" y1="89.6" x2="196" y2="129" stroke="#33424D" stroke-width="1.2" marker-end="url(#a33424D)" marker-start="url(#b33424D)"/>
  <text x="190" y="112" text-anchor="end" font-size="10.5" font-weight="800" fill="#33424D" stroke="#FFFFFF" stroke-width="3" paint-order="stroke">≥ 2 000 ft</text>
  <text x="18" y="240" font-size="10.5" fill="#33424D">Se cumple una de dos condiciones, a 5 NM de cada lado:</text>
  <text x="18" y="255" font-size="10.5" fill="#33424D">• gradiente positivo a 1 000 ft sobre el terreno, o</text>
  <text x="18" y="270" font-size="10.5" fill="#33424D">• bajar hasta un aeródromo librando 2 000 ft (el dibujo).</text>
  <text x="18" y="290" font-size="10" fill="#5B6B78">Si no se cumple: menos peso, otra ruta o puntos de retorno.</text>
</svg>
