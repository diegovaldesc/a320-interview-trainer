<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 294" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Calefacción de ventanas</title>
  <desc id="d">Las ventanas del cockpit vistas de frente. Los dos parabrisas tienen antihielo, con potencia baja en tierra y normal en vuelo. Las ventanas laterales tienen desempañado, con un solo nivel. El WHC 1 regula el lado izquierdo y el WHC 2 el derecho. Se encienden con un motor en marcha o en vuelo, o antes con PROBE/WINDOW HEAT en ON.</desc>
  <rect x="1" y="1" width="358" height="292" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Calefacción de ventanas</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">Cockpit visto de frente.</text>
  <polygon points="18,82 70,72 70,126 18,120" fill="#FFFFFF" stroke="#0E5E6F" stroke-width="1.6" stroke-linejoin="round"/>
  <polygon points="342,82 290,72 290,126 342,120" fill="#FFFFFF" stroke="#0E5E6F" stroke-width="1.6" stroke-linejoin="round"/>
  <polygon points="76,70 176,64 176,126 76,126" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.8" stroke-linejoin="round"/>
  <polygon points="284,70 184,64 184,126 284,126" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.8" stroke-linejoin="round"/>
  <text x="126" y="94" text-anchor="middle" font-size="10.5" font-weight="800" fill="#0E5E6F">Parabrisas</text>
  <text x="126" y="108" text-anchor="middle" font-size="10.5" fill="#33424D">antihielo</text>
  <text x="234" y="94" text-anchor="middle" font-size="10.5" font-weight="800" fill="#0E5E6F">Parabrisas</text>
  <text x="234" y="108" text-anchor="middle" font-size="10.5" fill="#33424D">antihielo</text>
  <text x="44" y="142" text-anchor="middle" font-size="10" fill="#33424D">Lateral</text>
  <text x="316" y="142" text-anchor="middle" font-size="10" fill="#33424D">Lateral</text>
  <rect x="70" y="160" width="96" height="32" rx="7" fill="#FFFFFF" stroke="#0E5E6F" stroke-width="1.4"/>
  <text x="118" y="173.5" text-anchor="middle" font-size="11" font-weight="800" fill="#0E5E6F">WHC 1</text>
  <text x="118" y="186.5" text-anchor="middle" font-size="10" fill="#33424D">lado izquierdo</text>
  <rect x="194" y="160" width="96" height="32" rx="7" fill="#FFFFFF" stroke="#0E5E6F" stroke-width="1.4"/>
  <text x="242" y="173.5" text-anchor="middle" font-size="11" font-weight="800" fill="#0E5E6F">WHC 2</text>
  <text x="242" y="186.5" text-anchor="middle" font-size="10" fill="#33424D">lado derecho</text>
  <line x1="118" y1="160" x2="118" y2="128" stroke="#0E5E6F" stroke-width="1.2" stroke-dasharray="5 3"/>
  <line x1="242" y1="160" x2="242" y2="128" stroke="#0E5E6F" stroke-width="1.2" stroke-dasharray="5 3"/>
  <polyline points="70,176 44,176 44,148" fill="none" stroke="#0E5E6F" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 3"/>
  <polyline points="290,176 316,176 316,148" fill="none" stroke="#0E5E6F" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 3"/>
  <text x="16" y="214" font-size="10.5" fill="#1E2A33">Parabrisas: antihielo; baja potencia en tierra,</text>
  <text x="16" y="228" font-size="10.5" fill="#1E2A33">normal en vuelo (cambia sola).</text>
  <text x="16" y="246" font-size="10.5" fill="#1E2A33">Laterales: desempañado; un solo nivel.</text>
  <text x="16" y="266" font-size="10.5" font-weight="700" fill="#0E5E6F">Se encienden con un motor en marcha o en vuelo,</text>
  <text x="16" y="280" font-size="10.5" font-weight="700" fill="#0E5E6F">o antes, con PROBE/WINDOW HEAT en ON.</text>
</svg>
