  <text x="242" y="73" font-size="11" font-weight="800" fill="#2E9D5B">Hasta 33°</text>
  <text x="242" y="88" font-size="10.5" fill="#33424D">con el sidestick suelto,</text>
  <text x="242" y="102" font-size="10.5" fill="#33424D">el bank se queda</text>
  <rect x="226" y="118" width="10" height="10" rx="2" fill="#D98A00" stroke="#D98A00" stroke-width="1.4"/>
  <text x="242" y="127" font-size="11" font-weight="800" fill="#8A5300">De 33° a 67°</text>
  <text x="242" y="142" font-size="10.5" fill="#33424D">al soltar el sidestick,</text>
  <text x="242" y="156" font-size="10.5" fill="#33424D">vuelve a 33°</text>
  <rect x="226" y="172" width="10" height="10" rx="2" fill="#1E2A33" stroke="#1E2A33" stroke-width="1.4"/>
  <text x="242" y="181" font-size="11" font-weight="800" fill="#1E2A33">67°</text>
  <text x="242" y="196" font-size="10.5" fill="#33424D">el máximo, con el</text>
  <text x="242" y="210" font-size="10.5" fill="#33424D">sidestick a tope</text>
  <text x="18" y="254" font-size="10.5" fill="#33424D">Con la protección de AOA o de pitch attitude activa, el</text>
  <text x="18" y="269" font-size="10.5" fill="#33424D">máximo baja a 45°; con la de high speed, a 40°.</text>
