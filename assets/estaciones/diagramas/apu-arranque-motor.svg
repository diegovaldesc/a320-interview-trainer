<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 312" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Arranque automático</title>
  <desc id="d">Arranque automático de un motor en tres pasos. Uno: ENG MODE en IGN/START, aparece la página ENG y se cierran las pack valves. Dos: ENG MASTER en ON, se abren la LP fuel valve y la start valve, después la ignición y la HP fuel valve; con N2 de 43, 50 o 55 % según el motor, se cierra la start valve y se apaga la ignición. Tres: ENG MODE en NORM. Si falla en tierra, el FADEC aborta y hace un dry crank.</desc>
  <rect x="1" y="1" width="358" height="310" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Arranque automático</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">El FADEC controla la secuencia.</text>
  <rect x="16" y="58" width="328" height="62" rx="6" fill="#FFFFFF" stroke="#C9D3DB" stroke-width="1.4"/>
  <circle cx="32" cy="76" r="8.5" fill="#0E5E6F" stroke="none" stroke-width="1"/>
  <text x="32" y="79.8" text-anchor="middle" font-size="10.5" font-weight="800" fill="#FFFFFF">1</text>
  <text x="48" y="80" font-size="11" font-weight="800" fill="#0E5E6F">ENG MODE en IGN/START</text>
  <text x="48" y="98" font-size="10.5" fill="#1E2A33">Página ENG en el ECAM</text>
  <text x="48" y="114" font-size="10.5" fill="#1E2A33">Se cierran las pack valves</text>
  <rect x="16" y="128" width="328" height="94" rx="6" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.4"/>
  <circle cx="32" cy="146" r="8.5" fill="#0E5E6F" stroke="none" stroke-width="1"/>
  <text x="32" y="149.8" text-anchor="middle" font-size="10.5" font-weight="800" fill="#FFFFFF">2</text>
  <text x="48" y="150" font-size="11" font-weight="800" fill="#0E5E6F">ENG MASTER en ON</text>
  <text x="48" y="168" font-size="10.5" fill="#1E2A33">LP fuel valve y start valve abiertas</text>
  <text x="48" y="184" font-size="10.5" fill="#1E2A33">Ignición y HP fuel valve</text>
  <text x="48" y="200" font-size="10.5" fill="#1E2A33">N2 de 43, 50 o 55 %: start valve</text>
  <text x="48" y="216" font-size="10.5" fill="#1E2A33">cerrada e ignición apagada</text>
  <rect x="16" y="230" width="328" height="46" rx="6" fill="#FFFFFF" stroke="#C9D3DB" stroke-width="1.4"/>
  <circle cx="32" cy="248" r="8.5" fill="#0E5E6F" stroke="none" stroke-width="1"/>
  <text x="32" y="251.8" text-anchor="middle" font-size="10.5" font-weight="800" fill="#FFFFFF">3</text>
  <text x="48" y="252" font-size="11" font-weight="800" fill="#0E5E6F">ENG MODE en NORM</text>
  <text x="48" y="270" font-size="10.5" fill="#1E2A33">Fin del arranque</text>
  <text x="16" y="298" font-size="10.5" font-weight="700" fill="#C0392B">Si falla en tierra: el FADEC aborta y hace un dry crank.</text>
</svg>
