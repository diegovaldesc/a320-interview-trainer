<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 306" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Luces de prioridad del sidestick</title>
  <desc id="d">Tres casos de las luces SIDE STICK PRIORITY del capitán y del primer oficial: dual input, con las dos luces verdes parpadeando y el aviso DUAL INPUT; el capitán con prioridad, con la flecha roja frente al primer oficial y el aviso PRIORITY LEFT; y después de 40 segundos, la prioridad queda fija y el primer oficial sigue sin mando. La luz verde se enciende frente al que tiene el mando si el otro mueve su sidestick; la flecha roja, frente al que perdió el mando.</desc>
  <rect x="1" y="1" width="358" height="304" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Luces de prioridad del sidestick</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">SIDE STICK PRIORITY, en el glareshield.</text>
  <text x="244" y="62" text-anchor="middle" font-size="10.5" font-weight="800" fill="#33424D">CAPT</text>
  <text x="312" y="62" text-anchor="middle" font-size="10.5" font-weight="800" fill="#33424D">F/O</text>
  <text x="18" y="86" font-size="11" font-weight="800" fill="#1E2A33">Dual input</text>
  <text x="18" y="102" font-size="10.5" fill="#33424D">Las dos verdes parpadean</text>
  <text x="18" y="116" font-size="10.5" fill="#33424D">y suena «DUAL INPUT».</text>
  <rect x="214" y="78" width="60" height="34" rx="6" fill="#1E2A33" stroke="#1E2A33" stroke-width="1.4"/>
  <rect x="219" y="84" width="22" height="22" rx="4" fill="#2E9D5B" stroke="#7FD3A2" stroke-width="1"/>
  <path d="M248 95 l10 -9 v6 h10 v6 h-10 v6 z" fill="#46555F"/>
  <rect x="282" y="78" width="60" height="34" rx="6" fill="#1E2A33" stroke="#1E2A33" stroke-width="1.4"/>
  <rect x="287" y="84" width="22" height="22" rx="4" fill="#2E9D5B" stroke="#7FD3A2" stroke-width="1"/>
  <path d="M316 95 l10 -9 v6 h10 v6 h-10 v6 z" fill="#46555F"/>
  <line x1="18" y1="128" x2="342" y2="128" stroke="#E4EAEF" stroke-width="1"/>
  <text x="18" y="148" font-size="11" font-weight="800" fill="#1E2A33">Capitán con prioridad</text>
  <text x="18" y="164" font-size="10.5" fill="#33424D">Flecha roja frente al F/O</text>
  <text x="18" y="178" font-size="10.5" fill="#33424D">y suena «PRIORITY LEFT».</text>
  <rect x="214" y="140" width="60" height="34" rx="6" fill="#1E2A33" stroke="#1E2A33" stroke-width="1.4"/>
  <rect x="219" y="146" width="22" height="22" rx="4" fill="#2E9D5B" stroke="#7FD3A2" stroke-width="1"/>
  <path d="M248 157 l10 -9 v6 h10 v6 h-10 v6 z" fill="#46555F"/>
  <rect x="282" y="140" width="60" height="34" rx="6" fill="#1E2A33" stroke="#1E2A33" stroke-width="1.4"/>
  <rect x="287" y="146" width="22" height="22" rx="4" fill="#33424D" stroke="#46555F" stroke-width="1"/>
  <path d="M316 157 l10 -9 v6 h10 v6 h-10 v6 z" fill="#E5483B"/>
  <line x1="18" y1="190" x2="342" y2="190" stroke="#E4EAEF" stroke-width="1"/>
  <text x="18" y="210" font-size="11" font-weight="800" fill="#1E2A33">Después de 40 s</text>
  <text x="18" y="226" font-size="10.5" fill="#33424D">La prioridad queda fija:</text>
  <text x="18" y="240" font-size="10.5" fill="#33424D">el F/O sigue sin mando.</text>
  <rect x="214" y="202" width="60" height="34" rx="6" fill="#1E2A33" stroke="#1E2A33" stroke-width="1.4"/>
  <rect x="219" y="208" width="22" height="22" rx="4" fill="#33424D" stroke="#46555F" stroke-width="1"/>
  <path d="M248 219 l10 -9 v6 h10 v6 h-10 v6 z" fill="#46555F"/>
  <rect x="282" y="202" width="60" height="34" rx="6" fill="#1E2A33" stroke="#1E2A33" stroke-width="1.4"/>
  <rect x="287" y="208" width="22" height="22" rx="4" fill="#33424D" stroke="#46555F" stroke-width="1"/>
  <path d="M316 219 l10 -9 v6 h10 v6 h-10 v6 z" fill="#E5483B"/>
  <line x1="18" y1="260" x2="342" y2="260" stroke="#E4EAEF" stroke-width="1"/>
  <text x="18" y="278" font-size="10.5" fill="#33424D">Verde: frente al que tiene el mando, si el otro mueve.</text>
  <text x="18" y="294" font-size="10.5" fill="#33424D">Flecha roja: frente al que perdió el mando.</text>
</svg>
