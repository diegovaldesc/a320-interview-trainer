<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 282" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Autobrake</title>
  <desc id="d">Panel AUTO/BRK con los botones LO, MED y MAX; en el ejemplo, MED está armado con su luz ON azul. LO, para el aterrizaje: 2 m/s², 2 segundos después de los ground spoilers. MED, para el aterrizaje: 3 m/s², 2 segundos después de los ground spoilers. MAX, para el despegue abortado: presión máxima con la orden de los ground spoilers. La luz DECEL verde indica que se llegó al 80 % de la desaceleración elegida, y apagada no es una falla. En algunos aviones, LO es 1,7 m/s² a los 4 segundos.</desc>
  <rect x="1" y="1" width="358" height="280" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Autobrake</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">LO y MED buscan una desaceleración; MAX frena a fondo.</text>
  <rect x="18" y="54" width="324" height="76" rx="10" fill="#2A343C" stroke="#2A343C" stroke-width="1.4"/>
  <text x="180" y="68" text-anchor="middle" font-size="10" font-weight="800" fill="#FFFFFF">AUTO/BRK</text>
  <rect x="40" y="76" width="72" height="46" rx="4" fill="#11181D" stroke="#55636E" stroke-width="1"/>
  <line x1="44" y1="99" x2="108" y2="99" stroke="#55636E" stroke-width="1"/>
  <text x="76" y="92" text-anchor="middle" font-size="10" font-weight="800" fill="#3F4B54">DECEL</text>
  <text x="76" y="115" text-anchor="middle" font-size="10" font-weight="800" fill="#3F4B54">ON</text>
  <rect x="144" y="76" width="72" height="46" rx="4" fill="#11181D" stroke="#55636E" stroke-width="1"/>
  <line x1="148" y1="99" x2="212" y2="99" stroke="#55636E" stroke-width="1"/>
  <text x="180" y="92" text-anchor="middle" font-size="10" font-weight="800" fill="#3F4B54">DECEL</text>
  <text x="180" y="115" text-anchor="middle" font-size="10" font-weight="800" fill="#5AA9E6">ON</text>
  <rect x="146" y="101" width="68" height="19" rx="3" fill="none" stroke="#5AA9E6" stroke-width="1.2"/>
  <rect x="248" y="76" width="72" height="46" rx="4" fill="#11181D" stroke="#55636E" stroke-width="1"/>
  <line x1="252" y1="99" x2="316" y2="99" stroke="#55636E" stroke-width="1"/>
  <text x="284" y="92" text-anchor="middle" font-size="10" font-weight="800" fill="#3F4B54">DECEL</text>
  <text x="284" y="115" text-anchor="middle" font-size="10" font-weight="800" fill="#3F4B54">ON</text>
  <text x="180" y="146" text-anchor="middle" font-size="10" fill="#5B6B78">Ejemplo: MED armado, con su luz ON azul.</text>
  <text x="76" y="170" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0E5E6F">LO</text>
  <text x="76" y="185" text-anchor="middle" font-size="10.5" font-weight="700" fill="#33424D">aterrizaje</text>
  <text x="76" y="201" text-anchor="middle" font-size="11" font-weight="800" fill="#1E2A33">2 m/s²</text>
  <text x="76" y="216" text-anchor="middle" font-size="10" fill="#33424D">2 s después de los</text>
  <text x="76" y="229" text-anchor="middle" font-size="10" fill="#33424D">ground spoilers</text>
  <text x="180" y="170" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0E5E6F">MED</text>
  <text x="180" y="185" text-anchor="middle" font-size="10.5" font-weight="700" fill="#33424D">aterrizaje</text>
  <text x="180" y="201" text-anchor="middle" font-size="11" font-weight="800" fill="#1E2A33">3 m/s²</text>
  <text x="180" y="216" text-anchor="middle" font-size="10" fill="#33424D">2 s después de los</text>
  <text x="180" y="229" text-anchor="middle" font-size="10" fill="#33424D">ground spoilers</text>
  <text x="284" y="170" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0E5E6F">MAX</text>
  <text x="284" y="185" text-anchor="middle" font-size="10.5" font-weight="700" fill="#33424D">despegue (RTO)</text>
  <text x="284" y="201" text-anchor="middle" font-size="11" font-weight="800" fill="#1E2A33">presión máxima</text>
  <text x="284" y="216" text-anchor="middle" font-size="10" fill="#33424D">con la orden de los</text>
  <text x="284" y="229" text-anchor="middle" font-size="10" fill="#33424D">ground spoilers</text>
  <text x="18" y="254" font-size="10.5" fill="#33424D">DECEL verde: llegó al 80 % de lo elegido; apagada no es falla.</text>
  <text x="18" y="270" font-size="10" fill="#5B6B78">En algunos aviones, LO: 1,7 m/s² a los 4 s.</text>
</svg>
