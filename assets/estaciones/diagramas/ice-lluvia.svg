<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Remoción de lluvia</title>
  <desc id="d">Panel de lluvia de un lado: el selector WIPER con OFF, intermitente (en algunos aviones), baja y alta, y el pushbutton RAIN RPLNT. Los wipers se usan hasta 230 kt y al apagarse quedan fuera de la vista. Cada pulsación del RAIN RPLNT aplica una dosis medida, solo con lluvia moderada a fuerte; está inhibido en tierra con los motores detenidos. El indicador de la botella: con la aguja en el sector amarillo, hay que cambiarla.</desc>
  <rect x="1" y="1" width="358" height="328" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Remoción de lluvia</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">Panel de un lado (cada piloto tiene el suyo).</text>
  <text x="130" y="66" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1E2A33">WIPER</text>
  <circle cx="130" cy="112" r="24" fill="#F3F5F7" stroke="#33424D" stroke-width="1.5"/>
  <line x1="130" y1="112" x2="130" y2="92" stroke="#1E2A33" stroke-width="4" stroke-linecap="round"/>
  <text x="130" y="84" text-anchor="middle" font-size="10" font-weight="700" fill="#1E2A33">OFF</text>
  <text x="100" y="104" text-anchor="end" font-size="10" fill="#33424D">Intermitente*</text>
  <text x="160" y="104" font-size="10" fill="#33424D">Baja</text>
  <text x="158" y="136" font-size="10" fill="#33424D">Alta</text>
  <text x="270" y="66" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1E2A33">RAIN RPLNT</text>
  <rect x="246" y="84" width="48" height="40" rx="4" fill="#1E272E" stroke="#9AA6AF" stroke-width="1.4"/>
  <circle cx="270" cy="104" r="10" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="16" y="168" font-size="10.5" fill="#1E2A33">Wipers: hasta 230 kt. Al apagarse quedan</text>
  <text x="16" y="182" font-size="10.5" fill="#1E2A33">fuera de la vista.</text>
  <text x="16" y="200" font-size="10.5" fill="#1E2A33">RAIN RPLNT: cada pulsación aplica una dosis medida;</text>
  <text x="16" y="214" font-size="10.5" fill="#1E2A33">solo con lluvia moderada a fuerte.</text>
  <text x="16" y="232" font-size="10.5" font-weight="700" fill="#C0392B">Inhibido en tierra con los motores detenidos.</text>
  <path d="M30 290 A30 30 0 0 1 40.9 266.9" fill="none" stroke="#E3B505" stroke-width="6"/>
  <path d="M40.9 266.9 A30 30 0 0 1 90 290" fill="none" stroke="#C9D3DB" stroke-width="6"/>
  <line x1="60" y1="290" x2="70.9" y2="268.6" stroke="#1E2A33" stroke-width="2" stroke-linecap="round"/>
  <text x="108" y="276" font-size="10.5" fill="#1E2A33">Botella del repellent: con la aguja</text>
  <text x="108" y="290" font-size="10.5" fill="#1E2A33">en el sector amarillo, cambiarla.</text>
  <text x="16" y="316" font-size="10" fill="#5B6B78">* En algunos aviones.</text>
</svg>
