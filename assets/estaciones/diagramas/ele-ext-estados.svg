  <path d="M305 124 L332 124" fill="none" stroke="#A9B4BD" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="293.5" y="119.5" width="9" height="9" rx="2" fill="#FFFFFF" stroke="#A9B4BD" stroke-width="1.6"/>
  <text x="298" y="146" text-anchor="middle" font-size="10.5" font-weight="400" fill="#33424D">line contactor</text>
  <text x="298" y="159" text-anchor="middle" font-size="11" font-weight="700" fill="#5B6B78">abierto</text>
  <text x="298" y="172" text-anchor="middle" font-size="10.5" font-weight="400" fill="#33424D">AVAIL hasta</text>
  <text x="298" y="185" text-anchor="middle" font-size="10.5" font-weight="400" fill="#33424D">desconectar</text>
  <path d="M125.5 82 L117.4 77.5 L117.4 86.5 Z" fill="#5B6B78"/>
  <path d="M243.5 82 L235.4 77.5 L235.4 86.5 Z" fill="#5B6B78"/>
  <rect x="8" y="200" width="344" height="40" rx="8" fill="#EAF1FC" stroke="#2F6FD6" stroke-width="1.2"/>
  <text x="180" y="216" text-anchor="middle" font-size="10.5" font-weight="600" fill="#33424D">ON sigue encendida aunque los engine generators</text>
  <text x="180" y="230" text-anchor="middle" font-size="10.5" font-weight="600" fill="#33424D">tomen la red: qué fuente alimenta se ve en la página ELEC</text>
  <rect x="23.5" y="254" width="9" height="9" rx="2" fill="#2E9D5B" stroke="#2E9D5B" stroke-width="1.6"/>
  <text x="43" y="262" font-size="10.5" fill="#5B6B78">contactor cerrado</text>
  <rect x="157.7" y="254" width="9" height="9" rx="2" fill="#FFFFFF" stroke="#A9B4BD" stroke-width="1.6"/>
  <text x="177.2" y="262" font-size="10.5" fill="#5B6B78">abierto</text>
  <text x="342" y="262" text-anchor="end" font-size="10.5" fill="#5B6B78">AVAIL verde · ON azul</text>
</svg>
