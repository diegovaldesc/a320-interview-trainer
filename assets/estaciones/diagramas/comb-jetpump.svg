<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 294" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Jet pump: A320 más nuevos</title>
  <desc id="d">Un lado del avión en los A320 más nuevos. La bomba del inner tank alimenta al motor y, con la transfer valve abierta (la maneja el FLSCU), manda combustible al jet pump del center tank. Ese chorro crea succión, y el jet pump devuelve al inner tank combustible del center tank.</desc>
  <rect x="1" y="1" width="358" height="292" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <defs><marker id="a2E9D5B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2E9D5B"/></marker></defs>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Jet pump: A320 más nuevos</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">Un lado del avión. El center tank no tiene bombas.</text>
  <rect x="28" y="52" width="64" height="28" rx="7" fill="#F3F5F7" stroke="#8C99A3" stroke-width="1.4"/>
  <text x="60" y="70" text-anchor="middle" font-size="11" font-weight="800" fill="#1E2A33">ENG</text>
  <rect x="16" y="124" width="150" height="88" rx="4" fill="#E5F4EA" stroke="#2E9D5B" stroke-width="1.4"/>
  <rect x="180" y="124" width="164" height="88" rx="4" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.4"/>
  <text x="72" y="142" font-size="10" font-weight="700" fill="#33424D">Inner tank</text>
  <text x="336" y="140" text-anchor="end" font-size="10" font-weight="700" fill="#0E5E6F">Center tank</text>
  <line x1="60" y1="80" x2="60" y2="180" stroke="#2E9D5B" stroke-width="2.4"/>
  <line x1="60" y1="104" x2="250" y2="104" stroke="#2E9D5B" stroke-width="2.4"/>
  <line x1="250" y1="104" x2="250" y2="158" stroke="#2E9D5B" stroke-width="2.4"/>
  <circle cx="60" cy="186" r="8" fill="#FFFFFF" stroke="#33424D" stroke-width="1.5"/>
  <line x1="55" y1="184" x2="65" y2="188" stroke="#33424D" stroke-width="1.4"/>
  <line x1="58" y1="191" x2="62" y2="181" stroke="#33424D" stroke-width="1.4"/>
  <text x="74" y="190" font-size="10" fill="#33424D">Bomba</text>
  <circle cx="200" cy="104" r="7" fill="#FFFFFF" stroke="#33424D" stroke-width="1.5"/>
  <line x1="193" y1="104" x2="207" y2="104" stroke="#33424D" stroke-width="1.8"/>
  <text x="200" y="92" text-anchor="middle" font-size="10" fill="#33424D">Transfer valve (FLSCU)</text>
  <polygon points="244,158 256,158 262,176 238,176" fill="#FFFFFF" stroke="#0E5E6F" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="234" y="170" text-anchor="end" font-size="10" font-weight="700" fill="#0E5E6F">Jet pump</text>
  <polyline points="238,186 132,186" fill="none" stroke="#2E9D5B" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a2E9D5B)"/>
  <line x1="320" y1="196" x2="268" y2="182" stroke="#2E9D5B" stroke-width="1.6" marker-end="url(#a2E9D5B)"/>
  <text x="318" y="206" text-anchor="end" font-size="10" fill="#2E9D5B">succión</text>
  <circle cx="26" cy="236" r="8.5" fill="#0E5E6F" stroke="none" stroke-width="1"/>
  <text x="26" y="239.8" text-anchor="middle" font-size="10.5" font-weight="800" fill="#FFFFFF">1</text>
  <text x="40" y="240" font-size="10.5" fill="#1E2A33">La bomba del inner manda combustible al jet pump.</text>
  <circle cx="26" cy="256" r="8.5" fill="#0E5E6F" stroke="none" stroke-width="1"/>
  <text x="26" y="259.8" text-anchor="middle" font-size="10.5" font-weight="800" fill="#FFFFFF">2</text>
  <text x="40" y="260" font-size="10.5" fill="#1E2A33">Ese chorro crea succión en el center tank.</text>
  <circle cx="26" cy="276" r="8.5" fill="#0E5E6F" stroke="none" stroke-width="1"/>
  <text x="26" y="279.8" text-anchor="middle" font-size="10.5" font-weight="800" fill="#FFFFFF">3</text>
  <text x="40" y="280" font-size="10.5" fill="#1E2A33">Sale al inner tank con combustible del center.</text>
</svg>
