<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Modos de frenado</title>
  <desc id="d">Escalera de modos: normal, con Green, BSCU, antiskid y autobrake; alternate con antiskid, con Yellow y el ABCU, sin autobrake; alternate sin antiskid, con un máximo de 1 000 PSI y, solo con el accumulator, al menos 7 aplicaciones; parking brake, con Yellow o el accumulator, al menos 12 horas. Triple indicator con la presión del accumulator y de los frenos izquierdos y derechos, que solo muestra presión cuando frena Yellow.</desc>
  <rect x="1" y="1" width="358" height="328" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <defs><marker id="a33424D" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#33424D"/></marker><marker id="b33424D" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#33424D"/></marker></defs>
  <text x="18" y="26" font-size="12.5" font-weight="800" fill="#0E5E6F">Modos de frenado</text>
  <text x="18" y="42" font-size="10" fill="#5B6B78">Del más completo al último recurso.</text>
  <rect x="18" y="54" width="196" height="52" rx="8" fill="#E9F5EE" stroke="#2E9D5B" stroke-width="1.5"/>
  <rect x="26" y="63" width="15" height="15" rx="3" fill="#E9F5EE" stroke="#2E9D5B" stroke-width="1.5"/>
  <text x="33.5" y="74.3" text-anchor="middle" font-size="10" font-weight="700" fill="#2E9D5B">G</text>
  <text x="48" y="74" font-size="10.5" font-weight="800" fill="#1E2A33">Normal</text>
  <text x="48" y="88" font-size="9" fill="#33424D">BSCU · antiskid · autobrake</text>
  <line x1="116" y1="106" x2="116" y2="116" stroke="#33424D" stroke-width="1.2" marker-end="url(#a33424D)"/>
  <text x="124" y="114" font-size="8.8" fill="#5B6B78">si falta Green</text>
  <rect x="18" y="118" width="196" height="52" rx="8" fill="#FDF3DC" stroke="#D99A00" stroke-width="1.5"/>
  <rect x="26" y="127" width="15" height="15" rx="3" fill="#FDF3DC" stroke="#D99A00" stroke-width="1.5"/>
  <text x="33.5" y="138.3" text-anchor="middle" font-size="10" font-weight="700" fill="#D99A00">Y</text>
  <text x="48" y="138" font-size="10.5" font-weight="800" fill="#1E2A33">Alternate con antiskid</text>
  <text x="48" y="152" font-size="9" fill="#33424D">ABCU · sin autobrake</text>
  <line x1="116" y1="170" x2="116" y2="180" stroke="#33424D" stroke-width="1.2" marker-end="url(#a33424D)"/>
  <text x="124" y="178" font-size="8.8" fill="#5B6B78">sin antiskid</text>
  <rect x="18" y="182" width="196" height="52" rx="8" fill="#FCEBD3" stroke="#C77700" stroke-width="1.5"/>
  <rect x="26" y="191" width="15" height="15" rx="3" fill="#FDF3DC" stroke="#D99A00" stroke-width="1.5"/>
  <text x="33.5" y="202.3" text-anchor="middle" font-size="10" font-weight="700" fill="#D99A00">Y</text>
  <text x="48" y="202" font-size="10.5" font-weight="800" fill="#1E2A33">Alternate sin antiskid</text>
  <text x="48" y="216" font-size="9" fill="#33424D">máx. 1 000 PSI</text>
  <text x="48" y="227" font-size="9" fill="#33424D">solo accumulator: ≥ 7 aplicaciones</text>
  <rect x="18" y="246" width="196" height="52" rx="8" fill="#EEF2F5" stroke="#33424D" stroke-width="1.5"/>
  <rect x="26" y="255" width="15" height="15" rx="3" fill="#FDF3DC" stroke="#D99A00" stroke-width="1.5"/>
  <text x="33.5" y="266.3" text-anchor="middle" font-size="10" font-weight="700" fill="#D99A00">Y</text>
  <text x="48" y="266" font-size="10.5" font-weight="800" fill="#1E2A33">Parking brake</text>
  <text x="48" y="280" font-size="9" fill="#33424D">Yellow o accumulator · ≥ 12 h</text>
  <rect x="232" y="54" width="110" height="150" rx="10" fill="#2A343C" stroke="#2A343C" stroke-width="1.4"/>
  <text x="284" y="70" text-anchor="middle" font-size="8.5" font-weight="800" fill="#FFFFFF">BRAKES / ACCU</text>
