<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Distancia requerida en el despacho</title>
  <desc id="d">Pista con su LDA y tres barras desde el umbral: la distancia certificada, desde 50 ft hasta detenerse, sin margen, con frenado manual máximo y sin reversores; la RLD seca, que es la certificada dividida por 0,6; y la RLD mojada, que es la RLD seca multiplicada por 1,15. Cada RLD debe caber en la LDA del destino; en el dibujo, la RLD mojada la llena justo.</desc>
  <rect x="1" y="1" width="358" height="288" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <defs><marker id="a33424D" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#33424D"/></marker><marker id="b33424D" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#33424D"/></marker></defs>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Distancia requerida en el despacho</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">Antes del vuelo, para la pista del destino.</text>
  <line x1="20" y1="64" x2="340" y2="64" stroke="#33424D" stroke-width="1.2" marker-end="url(#a33424D)" marker-start="url(#b33424D)"/>
  <text x="180" y="59" text-anchor="middle" font-size="11" font-weight="800" fill="#33424D" stroke="#FFFFFF" stroke-width="3" paint-order="stroke">LDA</text>
  <rect x="18" y="72" width="324" height="26" rx="2" fill="#4A5560" stroke="#4A5560" stroke-width="1"/>
  <line x1="32" y1="85" x2="334" y2="85" stroke="#FFFFFF" stroke-width="1.4" stroke-dasharray="10 8"/>
  <rect x="22" y="75.5" width="7" height="2.5" rx="0.5" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.5"/>
  <rect x="22" y="80.5" width="7" height="2.5" rx="0.5" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.5"/>
  <rect x="22" y="85.5" width="7" height="2.5" rx="0.5" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.5"/>
  <rect x="22" y="90.5" width="7" height="2.5" rx="0.5" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.5"/>
  <rect x="18" y="112" width="169" height="20" rx="4" fill="#F3F5F7" stroke="#33424D" stroke-width="1.3"/>
  <text x="26" y="126" font-size="11" font-weight="800" fill="#33424D">Certificada</text>
  <text x="193" y="126" font-size="10.5" fill="#33424D">50 ft → detenido; sin margen</text>
  <rect x="18" y="146" width="281.7" height="20" rx="4" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.3"/>
  <text x="26" y="160" font-size="11" font-weight="800" fill="#0E5E6F">RLD seca</text>
  <text x="110" y="160" font-size="10.5" fill="#33424D">= certificada ÷ 0,6</text>
  <rect x="18" y="180" width="324" height="20" rx="4" fill="#E6EFFA" stroke="#2F6FB5" stroke-width="1.3"/>
  <text x="26" y="194" font-size="11" font-weight="800" fill="#2F6FB5">RLD mojada</text>
  <text x="110" y="194" font-size="10.5" fill="#33424D">= RLD seca × 1,15</text>
  <line x1="342" y1="100" x2="342" y2="216" stroke="#C77700" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="18" y="240" font-size="10.5" fill="#33424D">Certificada: frenado manual máximo, sin reversores.</text>
  <text x="18" y="255" font-size="10.5" fill="#33424D">Cada RLD debe caber en la LDA del destino. En el</text>
  <text x="18" y="270" font-size="10.5" fill="#33424D">dibujo, la RLD mojada la llena justo.</text>
</svg>
