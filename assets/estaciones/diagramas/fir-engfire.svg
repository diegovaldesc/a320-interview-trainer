<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 302" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">ENG FIRE pb</title>
  <desc id="d">Al soltar el ENG FIRE pb, para ese motor: silencia la alarma sonora, arma los squibs, cierra la LP fuel valve, la hydraulic fire shut off valve, la bleed valve y la pack valve, corta el FADEC y desactiva el IDG. Debajo, los AGENT 1 y AGENT 2 con sus luces: SQUIB blanca, armado; DISCH ámbar, botella sin presión.</desc>
  <rect x="1" y="1" width="358" height="300" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">ENG FIRE pb</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">Al soltarlo, para ese motor.</text>
  <rect x="16" y="56" width="328" height="150" rx="6" fill="#F8E1DE" stroke="#C0392B" stroke-width="1.4"/>
  <text x="28" y="78" font-size="10.5" fill="#1E2A33">• Silencia la alarma sonora</text>
  <text x="28" y="99" font-size="10.5" fill="#1E2A33">• Arma los squibs de los extintores</text>
  <text x="28" y="120" font-size="10.5" fill="#1E2A33">• Cierra la LP fuel valve</text>
  <text x="28" y="141" font-size="10.5" fill="#1E2A33">• Cierra la hydraulic fire shut off valve</text>
  <text x="28" y="162" font-size="10.5" fill="#1E2A33">• Cierra la bleed valve y la pack valve</text>
  <text x="28" y="183" font-size="10.5" fill="#1E2A33">• Corta el FADEC y desactiva el IDG</text>
  <rect x="30" y="220" width="144" height="50" rx="6" fill="#FFFFFF" stroke="#8C99A3" stroke-width="1.4"/>
  <text x="102" y="238" text-anchor="middle" font-size="11" font-weight="800" fill="#1E2A33">AGENT 1</text>
  <text x="68" y="260" text-anchor="middle" font-size="10" font-weight="700" fill="#5B6B78">SQUIB</text>
  <text x="136" y="260" text-anchor="middle" font-size="10" font-weight="700" fill="#C77700">DISCH</text>
  <rect x="186" y="220" width="144" height="50" rx="6" fill="#FFFFFF" stroke="#8C99A3" stroke-width="1.4"/>
  <text x="258" y="238" text-anchor="middle" font-size="11" font-weight="800" fill="#1E2A33">AGENT 2</text>
  <text x="224" y="260" text-anchor="middle" font-size="10" font-weight="700" fill="#5B6B78">SQUIB</text>
  <text x="292" y="260" text-anchor="middle" font-size="10" font-weight="700" fill="#C77700">DISCH</text>
  <text x="16" y="290" font-size="10" fill="#33424D">SQUIB: armado (blanco). DISCH: botella sin presión (ámbar).</text>
</svg>
