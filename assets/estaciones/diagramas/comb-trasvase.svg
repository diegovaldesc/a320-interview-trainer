<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 256" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Qué abre las transfer valves</title>
  <desc id="d">Las dos alas vistas desde arriba, cada una con su outer tank y su inner tank. Un low level sensor del inner tank izquierdo, a unos 750 kg, manda por una orden eléctrica una transfer valve en cada ala, y el combustible del outer cae al inner en los dos lados. Simplificado: cada ala tiene dos valves y cada inner tank dos sensores. Las valves quedan abiertas hasta la próxima carga de combustible.</desc>
  <rect x="1" y="1" width="358" height="254" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <defs><marker id="a2E9D5B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2E9D5B"/></marker></defs>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Qué abre las transfer valves</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">Simplificado: un sensor y una de las dos valves de cada ala.</text>
  <rect x="16" y="90" width="60" height="50" rx="3" fill="#E5F4EA" stroke="#2E9D5B" stroke-width="1.4"/>
  <rect x="76" y="90" width="90" height="50" rx="3" fill="#E5F4EA" stroke="#2E9D5B" stroke-width="1.4"/>
  <rect x="194" y="90" width="90" height="50" rx="3" fill="#E5F4EA" stroke="#2E9D5B" stroke-width="1.4"/>
  <rect x="284" y="90" width="60" height="50" rx="3" fill="#E5F4EA" stroke="#2E9D5B" stroke-width="1.4"/>
  <text x="46" y="104" text-anchor="middle" font-size="10" font-weight="700" fill="#33424D">Outer</text>
  <text x="108" y="104" text-anchor="middle" font-size="10" font-weight="700" fill="#33424D">Inner</text>
  <text x="239" y="104" text-anchor="middle" font-size="10" font-weight="700" fill="#33424D">Inner</text>
  <text x="314" y="104" text-anchor="middle" font-size="10" font-weight="700" fill="#33424D">Outer</text>
  <line x1="82" y1="126" x2="160" y2="126" stroke="#C77700" stroke-width="1.4" stroke-dasharray="4 3"/>
  <rect x="145" y="121" width="10" height="10" rx="2" fill="#C77700" stroke="#C77700" stroke-width="1.4"/>
  <polyline points="150,121 150,74 76,74 76,108" fill="none" stroke="#0E5E6F" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 3"/>
  <polyline points="150,74 284,74 284,108" fill="none" stroke="#0E5E6F" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 3"/>
  <text x="217" y="68" text-anchor="middle" font-size="10" fill="#0E5E6F">Orden eléctrica del sensor</text>
  <circle cx="76" cy="115" r="7" fill="#FFFFFF" stroke="#33424D" stroke-width="1.5"/>
  <line x1="69" y1="115" x2="83" y2="115" stroke="#33424D" stroke-width="1.8"/>
  <circle cx="284" cy="115" r="7" fill="#FFFFFF" stroke="#33424D" stroke-width="1.5"/>
  <line x1="277" y1="115" x2="291" y2="115" stroke="#33424D" stroke-width="1.8"/>
  <line x1="40" y1="132" x2="104" y2="132" stroke="#2E9D5B" stroke-width="2" marker-end="url(#a2E9D5B)"/>
  <line x1="320" y1="132" x2="256" y2="132" stroke="#2E9D5B" stroke-width="2" marker-end="url(#a2E9D5B)"/>
  <text x="76" y="156" text-anchor="middle" font-size="10" fill="#33424D">Transfer valve</text>
  <text x="284" y="156" text-anchor="middle" font-size="10" fill="#33424D">Transfer valve</text>
  <text x="150" y="174" text-anchor="middle" font-size="10" font-weight="700" fill="#C77700">Low level sensor: unos 750 kg</text>
  <text x="180" y="200" text-anchor="middle" font-size="10.5" fill="#1E2A33">Las dos alas transfieren a la vez.</text>
  <text x="180" y="216" text-anchor="middle" font-size="10.5" fill="#1E2A33">Quedan abiertas hasta la próxima carga de combustible.</text>
  <line x1="70" y1="240.5" x2="90" y2="240.5" stroke="#2E9D5B" stroke-width="2"/>
  <text x="95" y="244" font-size="10" fill="#33424D">Combustible</text>
  <line x1="165" y1="240.5" x2="185" y2="240.5" stroke="#0E5E6F" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="190" y="244" font-size="10" fill="#33424D">Orden eléctrica</text>
</svg>
