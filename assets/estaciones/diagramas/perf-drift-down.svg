<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Falla de motor en crucero</title>
  <desc id="d">Perfil de descenso después de una falla de motor en crucero. La standard strategy, a M 0,78 / 300 kt, baja más y nivela en el REC MAX con un motor. El drift down, a green dot, baja menos y nivela más alto, en el drift down ceiling: sobre terreno alto mantiene el avión lo más alto posible, y libre del terreno se vuelve a la standard.</desc>
  <rect x="1" y="1" width="358" height="278" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <defs><marker id="a33424D" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#33424D"/></marker><marker id="b33424D" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#33424D"/></marker></defs>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Falla de motor en crucero</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">Dos formas de descender con un motor.</text>
  <polygon points="14,236 14,222 80,214 150,208 210,196 262,178 284,172 306,186 346,202 346,236" fill="#EFE5DA" stroke="#A07C55" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="332" y="228" text-anchor="end" font-size="10" font-weight="700" fill="#A07C55">terreno</text>
  <line x1="14" y1="66" x2="56" y2="66" stroke="#0E5E6F" stroke-width="2.4" stroke-linecap="round"/>
  <text x="16" y="58" font-size="10" font-weight="700" fill="#5B6B78">crucero</text>
  <polyline points="56,66 150,158 196,158" fill="none" stroke="#2F6FB5" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="56,66 220,102 342,102" fill="none" stroke="#0E5E6F" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="56" cy="66" r="4.2" fill="#C0392B" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="64" y="58" font-size="10.5" font-weight="800" fill="#C0392B">falla de motor</text>
  <text x="342" y="95" text-anchor="end" font-size="10.5" font-weight="800" fill="#0E5E6F">drift down ceiling</text>
  <text x="150" y="78" text-anchor="middle" font-size="10.5" font-weight="800" fill="#0E5E6F" stroke="#FFFFFF" stroke-width="3" paint-order="stroke">drift down · green dot</text>
  <text x="112" y="132" text-anchor="end" font-size="10.5" font-weight="800" fill="#2F6FB5" stroke="#FFFFFF" stroke-width="3" paint-order="stroke">standard</text>
  <text x="112" y="145" text-anchor="end" font-size="10.5" font-weight="700" fill="#2F6FB5" stroke="#FFFFFF" stroke-width="3" paint-order="stroke">M 0,78 / 300 kt</text>
  <text x="198" y="174" text-anchor="end" font-size="10.5" font-weight="800" fill="#2F6FB5" stroke="#FFFFFF" stroke-width="3" paint-order="stroke">REC MAX con un motor</text>
  <text x="18" y="256" font-size="10.5" fill="#33424D">Sobre terreno alto, el drift down mantiene el avión lo más</text>
  <text x="18" y="271" font-size="10.5" fill="#33424D">alto posible; libre del terreno, se vuelve a la standard.</text>
</svg>
