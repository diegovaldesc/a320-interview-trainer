<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 282" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Prioridad de sidesticks</title>
  <desc id="d">Tres casos de las luces SIDE STICK PRIORITY: dual input, con las dos luces verdes parpadeando y el aviso DUAL INPUT; el capitán toma la prioridad con el takeover pushbutton, flecha roja frente al primer oficial y aviso PRIORITY LEFT; y después de 40 segundos la prioridad queda fija hasta que alguien presione su pushbutton.</desc>
  <rect x="1" y="1" width="358" height="280" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="180" y="24" text-anchor="middle" font-size="10" font-weight="700" fill="#33424D">Luces SIDE STICK PRIORITY del glareshield</text>
  <text x="18" y="60" font-size="10.5" font-weight="800" fill="#1E2A33">Dual input</text>
  <rect x="204" y="42" width="56" height="30" rx="5" fill="#1E2A33" stroke="#1E2A33" stroke-width="1.4"/>
  <rect x="208" y="47" width="22" height="20" rx="3" fill="#2E9D5B" stroke="#7FD3A2" stroke-width="1"/>
  <text x="219" y="60" text-anchor="middle" font-size="7.5" font-weight="800" fill="#FFFFFF">CAPT</text>
  <path d="M236 57 l9 -8 v5 h9 v6 h-9 v5 z" fill="#46555F"/>
  <rect x="278" y="42" width="56" height="30" rx="5" fill="#1E2A33" stroke="#1E2A33" stroke-width="1.4"/>
  <rect x="282" y="47" width="22" height="20" rx="3" fill="#2E9D5B" stroke="#7FD3A2" stroke-width="1"/>
  <text x="293" y="60" text-anchor="middle" font-size="7.5" font-weight="800" fill="#FFFFFF">F/O</text>
  <path d="M310 57 l9 -8 v5 h9 v6 h-9 v5 z" fill="#46555F"/>
  <text x="18" y="90" font-size="9.5" fill="#5B6B78">Las órdenes se suman. Verdes parpadeando y suena «DUAL INPUT».</text>
  <text x="18" y="126" font-size="10.5" font-weight="800" fill="#1E2A33">Capitán con prioridad</text>
  <rect x="204" y="108" width="56" height="30" rx="5" fill="#1E2A33" stroke="#1E2A33" stroke-width="1.4"/>
  <rect x="208" y="113" width="22" height="20" rx="3" fill="#2E9D5B" stroke="#7FD3A2" stroke-width="1"/>
  <text x="219" y="126" text-anchor="middle" font-size="7.5" font-weight="800" fill="#FFFFFF">CAPT</text>
  <path d="M236 123 l9 -8 v5 h9 v6 h-9 v5 z" fill="#46555F"/>
  <rect x="278" y="108" width="56" height="30" rx="5" fill="#1E2A33" stroke="#1E2A33" stroke-width="1.4"/>
  <rect x="282" y="113" width="22" height="20" rx="3" fill="#33424D" stroke="#46555F" stroke-width="1"/>
  <text x="293" y="126" text-anchor="middle" font-size="7.5" font-weight="800" fill="#8C99A3">F/O</text>
  <path d="M310 123 l9 -8 v5 h9 v6 h-9 v5 z" fill="#E5483B"/>
  <text x="18" y="156" font-size="9.5" fill="#5B6B78">Mantiene su takeover pb: flecha roja frente al F/O y «PRIORITY LEFT».</text>
  <text x="18" y="192" font-size="10.5" font-weight="800" fill="#1E2A33">Después de 40 s</text>
  <rect x="204" y="174" width="56" height="30" rx="5" fill="#1E2A33" stroke="#1E2A33" stroke-width="1.4"/>
  <rect x="208" y="179" width="22" height="20" rx="3" fill="#33424D" stroke="#46555F" stroke-width="1"/>
  <text x="219" y="192" text-anchor="middle" font-size="7.5" font-weight="800" fill="#8C99A3">CAPT</text>
  <path d="M236 189 l9 -8 v5 h9 v6 h-9 v5 z" fill="#46555F"/>
  <rect x="278" y="174" width="56" height="30" rx="5" fill="#1E2A33" stroke="#1E2A33" stroke-width="1.4"/>
  <rect x="282" y="179" width="22" height="20" rx="3" fill="#33424D" stroke="#46555F" stroke-width="1"/>
  <text x="293" y="192" text-anchor="middle" font-size="7.5" font-weight="800" fill="#8C99A3">F/O</text>
  <path d="M310 189 l9 -8 v5 h9 v6 h-9 v5 z" fill="#E5483B"/>
  <text x="18" y="222" font-size="9.5" fill="#5B6B78">Prioridad fija: el F/O sigue desactivado hasta que alguien presione su pb.</text>
  <line x1="18" y1="236" x2="342" y2="236" stroke="#E4EAEF" stroke-width="1"/>
  <text x="18" y="254" font-size="9.5" fill="#33424D">Verde: frente al que tiene la prioridad, si el otro sigue moviendo.</text>
  <text x="18" y="268" font-size="9.5" fill="#33424D">Flecha roja: frente al piloto que perdió el mando.</text>
</svg>
