<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 276" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Triple indicator</title>
  <desc id="d">El indicador BRAKES and ACCU PRESS del panel central. Arriba, la aguja ACCU, con la presión del accumulator de Yellow. Abajo, las agujas BRAKES L y R, con la presión de Yellow en los frenos izquierdos y derechos; solo marcan presión cuando Yellow controla los frenos, en alternate o con el parking brake. En el dibujo, con frenado normal de Green, los frenos marcan cero.</desc>
