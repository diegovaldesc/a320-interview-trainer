  <text x="157" y="104" text-anchor="middle" font-size="10.5" font-weight="800" fill="#33424D">Ground spoilers: 1 a 5</text>
  <text x="18" y="240" font-size="10.5" fill="#33424D">Spoilers: un servojack y un SEC cada uno;</text>
  <text x="18" y="255" font-size="10.5" fill="#33424D">si su SEC falla, se retraen.</text>
  <text x="18" y="274" font-size="10.5" fill="#33424D">Aileron: dos servojacks; ELAC 1 y, de respaldo, ELAC 2.</text>
