  <title id="t">Qué se protege del hielo</title>
  <desc id="d">Vista superior del A320. En ámbar, con aire caliente: los slats 3, 4 y 5 de cada ala y las entradas de aire de los dos motores. En azul, con calefacción eléctrica: las ventanas del cockpit, las sondas (pitot, static, AOA y TAT) y el drain mast. En gris, sin antihielo: los slats 1 y 2, los flaps y el estabilizador.</desc>
