<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 262" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">El peso máximo de despegue del día</title>
  <desc id="d">Seis barras con el peso que permite cada límite, con números de ejemplo: estructural 77,0 t, pista 75,8 t, ascenso 72,5 t, obstáculos 74,1 t, neumáticos 76,4 t y frenos 75,3 t. La más corta, el ascenso, es el máximo del día.</desc>
  <rect x="1" y="1" width="358" height="260" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="18" y="26" font-size="12.5" font-weight="800" fill="#0E5E6F">El peso máximo de despegue del día</text>
  <text x="18" y="42" font-size="10" fill="#5B6B78">Cada límite permite un peso; manda el menor (números de ejemplo).</text>
  <text x="18" y="77" font-size="10" font-weight="600" fill="#33424D">Estructural (MTOW)</text>
  <rect x="150" y="66" width="148.5" height="16" rx="4" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.3"/>
  <text x="303.5" y="78" font-size="10" font-weight="500" fill="#33424D">77,0 t</text>
  <text x="18" y="105" font-size="10" font-weight="600" fill="#33424D">Pista (TOD, TOR, ASD)</text>
  <rect x="150" y="94" width="132.3" height="16" rx="4" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.3"/>
  <text x="287.3" y="106" font-size="10" font-weight="500" fill="#33424D">75,8 t</text>
  <text x="18" y="133" font-size="10" font-weight="800" fill="#C77700">Ascenso (2.º segmento)</text>
  <rect x="150" y="122" width="87.8" height="16" rx="4" fill="#FCEBD3" stroke="#C77700" stroke-width="1.3"/>
  <text x="242.8" y="134" font-size="10" font-weight="800" fill="#C77700">72,5 t</text>
  <text x="18" y="161" font-size="10" font-weight="600" fill="#33424D">Obstáculos</text>
  <rect x="150" y="150" width="109.3" height="16" rx="4" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.3"/>
  <text x="264.3" y="162" font-size="10" font-weight="500" fill="#33424D">74,1 t</text>
  <text x="18" y="189" font-size="10" font-weight="600" fill="#33424D">Neumáticos (195 kt GS)</text>
  <rect x="150" y="178" width="140.4" height="16" rx="4" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.3"/>
  <text x="295.4" y="190" font-size="10" font-weight="500" fill="#33424D">76,4 t</text>
  <text x="18" y="217" font-size="10" font-weight="600" fill="#33424D">Frenos (energía)</text>
  <rect x="150" y="206" width="125.5" height="16" rx="4" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.3"/>
  <text x="280.5" y="218" font-size="10" font-weight="500" fill="#33424D">75,3 t</text>
  <line x1="237.8" y1="58" x2="237.8" y2="236" stroke="#C77700" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="237.8" y="250" text-anchor="middle" font-size="10.5" font-weight="800" fill="#C77700">máximo del día: 72,5 t</text>
</svg>
