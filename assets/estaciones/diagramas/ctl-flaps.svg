<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">La posición 1 de la flaps lever</title>
  <desc id="d">Flaps lever con las posiciones 0, 1, 2, 3 y FULL, con topes en 1 y en 3. En la posición 1 hay dos configuraciones: CONF 1+F (slats 18°, flaps 10°), en tierra para el despegue, con retracción automática de los flaps a 210 kt; y CONF 1 (slats 18°, flaps 0°), al pasar de 0 a 1 en vuelo. En 2, 3 y FULL se extienden más slats y más flaps.</desc>
  <rect x="1" y="1" width="358" height="298" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">La posición 1 de la flaps lever</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">Misma posición, dos configuraciones.</text>
  <rect x="22" y="54" width="66" height="170" rx="10" fill="#F3F5F7" stroke="#C9D3DB" stroke-width="1.4"/>
  <line x1="44" y1="72" x2="44" y2="208" stroke="#8C99A3" stroke-width="3" stroke-linecap="round"/>
  <line x1="38" y1="72" x2="50" y2="72" stroke="#1E2A33" stroke-width="1.6"/>
  <text x="56" y="76" font-size="11" font-weight="700" fill="#1E2A33">0</text>
  <line x1="38" y1="106" x2="50" y2="106" stroke="#1E2A33" stroke-width="1.6"/>
  <text x="56" y="110" font-size="11" font-weight="700" fill="#1E2A33">1</text>
  <text x="30" y="110" text-anchor="middle" font-size="11" fill="#D98A00">▸</text>
  <line x1="38" y1="140" x2="50" y2="140" stroke="#1E2A33" stroke-width="1.6"/>
  <text x="56" y="144" font-size="11" font-weight="700" fill="#1E2A33">2</text>
  <line x1="38" y1="174" x2="50" y2="174" stroke="#1E2A33" stroke-width="1.6"/>
  <text x="56" y="178" font-size="11" font-weight="700" fill="#1E2A33">3</text>
  <text x="30" y="178" text-anchor="middle" font-size="11" fill="#D98A00">▸</text>
  <line x1="38" y1="208" x2="50" y2="208" stroke="#1E2A33" stroke-width="1.6"/>
  <text x="56" y="212" font-size="11" font-weight="700" fill="#1E2A33">FULL</text>
  <rect x="36" y="99" width="16" height="14" rx="4" fill="#1E2A33" stroke="#1E2A33" stroke-width="1.4"/>
  <text x="54" y="244" text-anchor="middle" font-size="10" fill="#8A5300">topes</text>
  <text x="54" y="257" text-anchor="middle" font-size="10" fill="#8A5300">en 1 y 3</text>
  <rect x="112" y="56" width="230" height="96" rx="10" fill="#FFFFFF" stroke="#7F8D99" stroke-width="1.4"/>
  <text x="124" y="77" font-size="12" font-weight="800" fill="#0E7C86">CONF 1+F</text>
  <text x="124" y="93" font-size="10.5" font-weight="700" fill="#33424D">Slats 18° · flaps 10°</text>
  <text x="124" y="111" font-size="10.5" fill="#33424D">En tierra, para el despegue.</text>
  <text x="124" y="125" font-size="10.5" fill="#33424D">Si no se pasa a 0, los flaps</text>
  <text x="124" y="139" font-size="10.5" fill="#33424D">se retraen solos a 210 kt.</text>
  <path d="M256 76 C262 68 292 68 312 74 L312 79 C292 80 264 81 256 76 Z" fill="#FFFFFF" stroke="#1E2A33" stroke-width="1.2"/>
  <polygon points="253.4,75.1 241.9,82 253.3,81.4" fill="#E4EAEF" stroke="#7F8D99" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="313.4,74 336.5,81.2 312.5,79.5" fill="#E4EAEF" stroke="#7F8D99" stroke-width="1.2" stroke-linejoin="round"/>
  <rect x="112" y="162" width="230" height="96" rx="10" fill="#FFFFFF" stroke="#7F8D99" stroke-width="1.4"/>
  <text x="124" y="183" font-size="12" font-weight="800" fill="#0E7C86">CONF 1</text>
  <text x="124" y="199" font-size="10.5" font-weight="700" fill="#33424D">Slats 18° · flaps 0°</text>
  <text x="124" y="217" font-size="10.5" fill="#33424D">En vuelo, al pasar de 0 a 1.</text>
  <text x="124" y="231" font-size="10.5" fill="#33424D">Se extienden los slats;</text>
  <text x="124" y="245" font-size="10.5" fill="#33424D">los flaps quedan arriba.</text>
  <path d="M256 182 C262 174 292 174 312 180 L312 185 C292 186 264 187 256 182 Z" fill="#FFFFFF" stroke="#1E2A33" stroke-width="1.2"/>
  <polygon points="253.4,181.1 241.9,188 253.3,187.4" fill="#E4EAEF" stroke="#7F8D99" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="313,180 337,183 313,185.5" fill="#E4EAEF" stroke="#7F8D99" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="18" y="286" font-size="10.5" fill="#33424D">En 2, 3 y FULL, más slats y más flaps.</text>
</svg>
