  <line x1="167" y1="108" x2="180" y2="108" stroke="#C0392B" stroke-width="1.6"/>
  <rect x="240" y="58" width="84" height="26" rx="7" fill="#F3F5F7" stroke="#8C99A3" stroke-width="1.4"/>
  <text x="282" y="75" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1E2A33">AFT CABIN</text>
  <line x1="282" y1="130" x2="282" y2="86" stroke="#2F6FD6" stroke-width="2.2" marker-end="url(#a2F6FD6)"/>
  <circle cx="260" cy="108" r="7" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.5"/>
