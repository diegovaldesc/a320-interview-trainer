  <text x="180" y="74.5" text-anchor="middle" font-size="11" font-weight="800" fill="#0E5E6F">WING</text>
  <text x="180" y="87.5" text-anchor="middle" font-size="10" fill="#33424D">pb</text>
  <polyline points="150,77 140,77 140,132 92,132" fill="none" stroke="#0E5E6F" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 3"/>
