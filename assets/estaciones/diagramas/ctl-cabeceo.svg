  <text x="64" y="56" text-anchor="middle" font-size="11" font-weight="700" fill="#1E2A33">Elevator L</text>
  <rect x="44" y="64" width="15" height="15" rx="3" fill="#EAF1FC" stroke="#2F6FD6" stroke-width="1.5"/>
  <text x="51.5" y="75.3" text-anchor="middle" font-size="10" font-weight="700" fill="#2F6FD6">B</text>
