  <title id="t">Roll y spoilers: hidráulico y computador de cada superficie</title>
  <desc id="d">Spoilers 1 a 5 de cada ala: 1 Green con el SEC 3, 2 Yellow con el SEC 3, 3 Blue con el SEC 1, 4 Yellow con el SEC 1 y 5 Green con el SEC 2. Ailerons con dos actuadores, Blue y Green, mandados por el ELAC 1 y de respaldo el ELAC 2. Roll: spoilers 2 a 5 y aileron; speed brakes: 2, 3 y 4; ground spoilers: 1 a 5.</desc>
