<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 238" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Distancias declaradas</title>
  <desc id="d">Pista con una stopway y una clearway al final. La TORA cubre la pista, la ASDA suma la stopway y la TODA suma la clearway. Stopway: soporta el peso del avión para frenar. Clearway: libre de obstáculos, pendiente de hasta 1,25 %, al menos 152 m de ancho y como máximo la mitad de la TORA.</desc>
  <rect x="1" y="1" width="358" height="236" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="18" y="26" font-size="12.5" font-weight="800" fill="#0E5E6F">Distancias declaradas</text>
  <text x="18" y="42" font-size="10" fill="#5B6B78">Lo que el aeropuerto publica para cada pista.</text>
  <rect x="248" y="56" width="94" height="42" rx="4" fill="#E6EFFA" stroke="#2F6FB5" stroke-width="1.3" stroke-dasharray="4 3"/>
  <rect x="18" y="64" width="230" height="26" rx="2" fill="#4A5560" stroke="#4A5560" stroke-width="1"/>
  <line x1="28" y1="77" x2="240" y2="77" stroke="#FFFFFF" stroke-width="1.4" stroke-dasharray="10 8"/>
  <rect x="248" y="64" width="36" height="26" rx="2" fill="#B9C2CA" stroke="#8C99A3" stroke-width="1"/>
  <polyline points="261,70 255,77 261,84" fill="none" stroke="#E8B923" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="271,70 265,77 271,84" fill="none" stroke="#E8B923" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="281,70 275,77 281,84" fill="none" stroke="#E8B923" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="133" y="58" text-anchor="middle" font-size="10" font-weight="700" fill="#33424D">Pista</text>
  <text x="266" y="110" text-anchor="middle" font-size="9.5" font-weight="700" fill="#33424D">Stopway</text>
  <text x="339" y="52" text-anchor="end" font-size="9.5" font-weight="700" fill="#2F6FB5">Clearway</text>
  <rect x="18" y="126" width="230" height="16" rx="4" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.3"/>
  <text x="26" y="138" font-size="10.5" font-weight="800" fill="#0E5E6F">TORA</text>
  <text x="68" y="138" font-size="10" fill="#33424D">= la pista</text>
  <rect x="18" y="150" width="266" height="16" rx="4" fill="#FCEBD3" stroke="#C77700" stroke-width="1.3"/>
  <text x="26" y="162" font-size="10.5" font-weight="800" fill="#C77700">ASDA</text>
  <text x="68" y="162" font-size="10" fill="#33424D">= TORA + stopway</text>
  <rect x="18" y="174" width="324" height="16" rx="4" fill="#E6EFFA" stroke="#2F6FB5" stroke-width="1.3"/>
  <text x="26" y="186" font-size="10.5" font-weight="800" fill="#2F6FB5">TODA</text>
  <text x="68" y="186" font-size="10" fill="#33424D">= TORA + clearway</text>
  <text x="18" y="210" font-size="9.5" fill="#33424D">Stopway: soporta el peso del avión, para frenar.</text>
  <text x="18" y="226" font-size="9.2" fill="#33424D">Clearway: libre de obstáculos; pendiente ≤ 1,25 %, ancho ≥ 152 m, largo ≤ ½ TORA.</text>
</svg>
