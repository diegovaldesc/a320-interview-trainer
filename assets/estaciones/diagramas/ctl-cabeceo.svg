<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 344" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Pitch y yaw: quién mueve cada superficie</title>
  <desc id="d">Elevator izquierdo con actuadores Blue y Green, elevator derecho con Yellow y Blue. El THS lo mueven dos motores hidráulicos, Green y Yellow, mandados por tres motores eléctricos o por el pitch trim wheel, que es mecánico. Computadores del pitch en orden: ELAC 2, ELAC 1, SEC 1 o SEC 2. El rudder tiene tres servojacks, Green, Blue y Yellow; los pedales lo mueven mecánicamente y los FAC mandan el yaw damper, el rudder trim y el travel limit.</desc>
  <rect x="1" y="1" width="358" height="342" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <defs><marker id="a1E2A33" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1E2A33"/></marker></defs>
  <text x="18" y="24" font-size="11" font-weight="800" fill="#0E7C86">PITCH</text>
