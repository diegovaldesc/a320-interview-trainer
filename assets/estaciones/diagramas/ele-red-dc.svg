<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 312" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">La red DC en vuelo normal</title>
  <desc id="d">GEN 1 alimenta AC BUS 1 y el TR 1 convierte esa AC en DC para el DC BUS 1, que por su DC TIE cerrado alimenta el DC BAT BUS y este el DC ESS BUS. GEN 2 alimenta AC BUS 2 y el TR 2 convierte esa AC en DC para el DC BUS 2, cuyo DC TIE hacia el DC BAT BUS está abierto en normal. El ESS TR, colgado del AC ESS BUS, queda en reserva.</desc>
