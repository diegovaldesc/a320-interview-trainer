  <text x="180" y="146" text-anchor="middle" font-size="10.5" font-weight="400" fill="#33424D">line contactor</text>
  <text x="180" y="159" text-anchor="middle" font-size="11" font-weight="700" fill="#1F6E41">cerrado</text>
  <text x="180" y="172" text-anchor="middle" font-size="10.5" font-weight="400" fill="#33424D">alimenta la red</text>
  <rect x="244" y="12" width="108" height="178" rx="10" fill="#F6F8FA" stroke="#DDE3E8"/>
  <circle cx="264" cy="30" r="9" fill="#33424D"/>
  <text x="264" y="34" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">3</text>
  <text x="306" y="34" text-anchor="middle" font-size="11" font-weight="700" fill="#33424D">Otra vez</text>
  <text x="298" y="58" text-anchor="middle" font-size="10" font-weight="700" fill="#33424D">EXT PWR</text>
