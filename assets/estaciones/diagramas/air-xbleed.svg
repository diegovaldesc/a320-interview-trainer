<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">APU BLEED en ON</title>
  <desc id="d">Con el APU BLEED en ON y el X BLEED en AUTO: la APU bleed valve y la crossbleed valve abiertas, las bleed valves de los dos motores cerradas, y el aire del APU llega a los dos lados. Una check valve en la línea del APU impide que el aire vuelva hacia el APU.</desc>
