  <rect x="114.4" y="196" width="32.8" height="22" rx="0" fill="#FFFFFF" stroke="#8C99A3" stroke-width="1"/>
  <text x="130.8" y="211" text-anchor="middle" font-size="11" font-weight="800" fill="#1E2A33">4</text>
  <rect x="147.2" y="196" width="32.8" height="22" rx="0" fill="#FFFFFF" stroke="#8C99A3" stroke-width="1"/>
  <text x="163.6" y="211" text-anchor="middle" font-size="11" font-weight="800" fill="#1E2A33">5</text>
  <rect x="180" y="196" width="32.8" height="22" rx="0" fill="#FFFFFF" stroke="#8C99A3" stroke-width="1"/>
  <text x="196.4" y="211" text-anchor="middle" font-size="11" font-weight="800" fill="#1E2A33">6</text>
