<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 346" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Quién alimenta las pantallas</title>
  <desc id="d">Los sensores y sistemas mandan datos a los dos SDAC y, para las warnings rojas, directamente a los dos FWC. Los SDAC alimentan a los tres DMC (páginas y motores) y a los FWC (cautions ámbar). Los FWC generan los mensajes, los memos, los sonidos y encienden MASTER WARN y MASTER CAUT. Los DMC alimentan las seis pantallas.</desc>
  <rect x="1" y="1" width="358" height="344" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Quién alimenta las pantallas</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">Esquema simplificado.</text>
  <defs><marker id="a33424D" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#33424D"/></marker><marker id="aC0392B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#C0392B"/></marker><marker id="aC77700" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#C77700"/></marker></defs>
  <rect x="16" y="60" width="328" height="30" rx="7" fill="#F3F5F7" stroke="#8C99A3" stroke-width="1.4"/>
  <text x="180" y="79" text-anchor="middle" font-size="11" font-weight="800" fill="#1E2A33">Sensores y sistemas del avión</text>
  <rect x="30" y="124" width="110" height="40" rx="7" fill="#FFFFFF" stroke="#33424D" stroke-width="1.4"/>
  <text x="85" y="141.5" text-anchor="middle" font-size="11" font-weight="800" fill="#1E2A33">2 SDAC</text>
  <text x="85" y="154.5" text-anchor="middle" font-size="10" fill="#33424D">recogen datos</text>
  <rect x="220" y="124" width="110" height="40" rx="7" fill="#F8E1DE" stroke="#C0392B" stroke-width="1.4"/>
  <text x="275" y="141.5" text-anchor="middle" font-size="11" font-weight="800" fill="#C0392B">2 FWC</text>
  <text x="275" y="154.5" text-anchor="middle" font-size="10" fill="#33424D">alertas</text>
  <rect x="30" y="206" width="110" height="40" rx="7" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.4"/>
  <text x="85" y="223.5" text-anchor="middle" font-size="11" font-weight="800" fill="#0E5E6F">3 DMC</text>
  <text x="85" y="236.5" text-anchor="middle" font-size="10" fill="#33424D">el 3 en standby</text>
  <line x1="85" y1="90" x2="85" y2="120" stroke="#33424D" stroke-width="1.6" marker-end="url(#a33424D)"/>
  <line x1="275" y1="90" x2="275" y2="120" stroke="#C0392B" stroke-width="1.8" marker-end="url(#aC0392B)"/>
  <text x="282" y="110" font-size="10" fill="#C0392B">rojas, directo</text>
  <line x1="140" y1="144" x2="216" y2="144" stroke="#C77700" stroke-width="1.8" marker-end="url(#aC77700)"/>
  <text x="178" y="138" text-anchor="middle" font-size="10" fill="#C77700">ámbar</text>
  <line x1="85" y1="164" x2="85" y2="202" stroke="#33424D" stroke-width="1.6" marker-end="url(#a33424D)"/>
  <text x="92" y="188" font-size="10" fill="#33424D">páginas y motores</text>
  <rect x="200" y="206" width="144" height="40" rx="7" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.4"/>
  <text x="272" y="223.5" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1E2A33">Mensajes, memos</text>
  <text x="272" y="236.5" text-anchor="middle" font-size="10" fill="#33424D">sonidos, MASTER WARN/CAUT</text>
  <line x1="275" y1="164" x2="275" y2="202" stroke="#C0392B" stroke-width="1.6" marker-end="url(#aC0392B)"/>
  <rect x="30" y="278" width="314" height="30" rx="7" fill="#1E272E" stroke="#9AA6AF" stroke-width="1.4"/>
  <text x="187" y="297" text-anchor="middle" font-size="11" font-weight="800" fill="#FFFFFF">Las seis pantallas (PFD, ND, E/WD, SD)</text>
  <line x1="85" y1="246" x2="85" y2="274" stroke="#33424D" stroke-width="1.6" marker-end="url(#a33424D)"/>
  <text x="16" y="332" font-size="11" font-weight="800" fill="#0E5E6F">SDAC recoge; DMC dibuja; FWC alerta.</text>
</svg>
