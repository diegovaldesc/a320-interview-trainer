<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 286" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Las seis pantallas del EIS</title>
  <desc id="d">El panel de instrumentos con las seis pantallas: PFD y ND del capitán a la izquierda, E/WD arriba al centro y SD abajo al centro, y ND y PFD del F/O a la derecha. Los PFD y ND forman el EFIS, para vuelo y navegación; el E/WD y el SD forman el ECAM, para motores y alertas. Pantallas CRT hasta el MSN 02321 y LCD desde el 02572.</desc>
  <rect x="1" y="1" width="358" height="284" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Las seis pantallas del EIS</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">Panel de instrumentos, de frente.</text>
  <rect x="16" y="70" width="62" height="62" rx="5" fill="#1E272E" stroke="#9AA6AF" stroke-width="1.4"/>
  <text x="47" y="99" text-anchor="middle" font-size="11" font-weight="800" fill="#5AC8E6">PFD</text>
  <text x="47" y="114" text-anchor="middle" font-size="10" fill="#C9D3DB">capitán</text>
  <rect x="84" y="70" width="62" height="62" rx="5" fill="#1E272E" stroke="#9AA6AF" stroke-width="1.4"/>
  <text x="115" y="99" text-anchor="middle" font-size="11" font-weight="800" fill="#5AC8E6">ND</text>
  <text x="115" y="114" text-anchor="middle" font-size="10" fill="#C9D3DB">capitán</text>
  <rect x="152" y="62" width="56" height="56" rx="5" fill="#1E272E" stroke="#9AA6AF" stroke-width="1.4"/>
  <text x="180" y="88" text-anchor="middle" font-size="11" font-weight="800" fill="#3DDC84">E/WD</text>
  <text x="180" y="103" text-anchor="middle" font-size="10" fill="#C9D3DB">arriba</text>
  <rect x="152" y="124" width="56" height="56" rx="5" fill="#1E272E" stroke="#9AA6AF" stroke-width="1.4"/>
  <text x="180" y="150" text-anchor="middle" font-size="11" font-weight="800" fill="#3DDC84">SD</text>
  <text x="180" y="165" text-anchor="middle" font-size="10" fill="#C9D3DB">abajo</text>
  <rect x="214" y="70" width="62" height="62" rx="5" fill="#1E272E" stroke="#9AA6AF" stroke-width="1.4"/>
  <text x="245" y="99" text-anchor="middle" font-size="11" font-weight="800" fill="#5AC8E6">ND</text>
  <text x="245" y="114" text-anchor="middle" font-size="10" fill="#C9D3DB">F/O</text>
  <rect x="282" y="70" width="62" height="62" rx="5" fill="#1E272E" stroke="#9AA6AF" stroke-width="1.4"/>
  <text x="313" y="99" text-anchor="middle" font-size="11" font-weight="800" fill="#5AC8E6">PFD</text>
  <text x="313" y="114" text-anchor="middle" font-size="10" fill="#C9D3DB">F/O</text>
  <rect x="14" y="196" width="158" height="52" rx="6" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.4"/>
  <text x="26" y="216" font-size="11.5" font-weight="800" fill="#0E5E6F">EFIS</text>
  <text x="26" y="236" font-size="10.5" fill="#33424D">PFD y ND: vuelo y navegación</text>
  <rect x="188" y="196" width="158" height="52" rx="6" fill="#E5F4EA" stroke="#2E9D5B" stroke-width="1.4"/>
  <text x="200" y="216" font-size="11.5" font-weight="800" fill="#2E9D5B">ECAM</text>
  <text x="200" y="236" font-size="10.5" fill="#33424D">E/WD y SD: motores, alertas</text>
  <text x="16" y="272" font-size="10.5" fill="#5B6B78">CRT hasta el MSN 02321; LCD desde el 02572.</text>
</svg>
