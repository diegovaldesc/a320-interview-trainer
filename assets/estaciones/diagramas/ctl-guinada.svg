<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 312" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Quién mueve el rudder</title>
  <desc id="d">El rudder tiene tres servojacks, Green, Blue y Yellow. Los pedales, dos pares unidos, lo mueven mecánicamente. Los ELAC calculan el yaw damping y la turn coordination y los ejecuta el FAC 1, con el FAC 2 en standby; el FAC también hace el rudder trim y el travel limit. Las órdenes automáticas no mueven los pedales.</desc>
  <rect x="1" y="1" width="358" height="310" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <defs><marker id="a33424D" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#33424D"/></marker></defs>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Quién mueve el rudder</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">Pedales mecánicos; el yaw automático es eléctrico.</text>
  <rect x="214" y="58" width="128" height="80" rx="8" fill="#FBEBDC" stroke="#D9822B" stroke-width="1.6"/>
  <text x="278" y="78" text-anchor="middle" font-size="12" font-weight="800" fill="#D9822B">Rudder</text>
  <rect x="244" y="88" width="16" height="16" rx="3" fill="#E9F5EE" stroke="#2E9D5B" stroke-width="1.5"/>
  <text x="252" y="100" text-anchor="middle" font-size="10.5" font-weight="800" fill="#2E9D5B">G</text>
  <rect x="270" y="88" width="16" height="16" rx="3" fill="#EAF1FC" stroke="#2F6FD6" stroke-width="1.5"/>
  <text x="278" y="100" text-anchor="middle" font-size="10.5" font-weight="800" fill="#2F6FD6">B</text>
  <rect x="296" y="88" width="16" height="16" rx="3" fill="#FDF3DC" stroke="#D99A00" stroke-width="1.5"/>
  <text x="304" y="100" text-anchor="middle" font-size="10.5" font-weight="800" fill="#D99A00">Y</text>
  <text x="278" y="126" text-anchor="middle" font-size="10" fill="#5B6B78">3 servojacks</text>
  <rect x="18" y="64" width="126" height="54" rx="8" fill="#FFFFFF" stroke="#C9D3DB" stroke-width="1.4"/>
  <text x="81" y="86" text-anchor="middle" font-size="11" font-weight="800" fill="#1E2A33">Pedales</text>
  <text x="81" y="102" text-anchor="middle" font-size="10" fill="#5B6B78">los dos pares, unidos</text>
  <line x1="144" y1="91" x2="208" y2="91" stroke="#33424D" stroke-width="1.8" stroke-dasharray="1.5 3" marker-end="url(#a33424D)"/>
  <text x="176" y="84" text-anchor="middle" font-size="10" fill="#33424D">mecánico</text>
  <rect x="18" y="160" width="126" height="66" rx="8" fill="#DDF0F1" stroke="#0E7C86" stroke-width="1.4"/>
  <text x="81" y="180" text-anchor="middle" font-size="11" font-weight="800" fill="#0E7C86">ELAC</text>
  <text x="81" y="196" text-anchor="middle" font-size="10" fill="#33424D">calculan yaw damping</text>
  <text x="81" y="210" text-anchor="middle" font-size="10" fill="#33424D">y turn coordination</text>
  <rect x="214" y="160" width="128" height="96" rx="8" fill="#FFFFFF" stroke="#D9822B" stroke-width="1.4"/>
  <text x="278" y="178" text-anchor="middle" font-size="11" font-weight="800" fill="#D9822B">FAC 1</text>
  <text x="278" y="192" text-anchor="middle" font-size="10" fill="#5B6B78">(FAC 2 en standby)</text>
  <text x="278" y="208" text-anchor="middle" font-size="10" fill="#33424D">yaw damper</text>
  <text x="278" y="221" text-anchor="middle" font-size="10" fill="#33424D">turn coordination</text>
  <text x="278" y="234" text-anchor="middle" font-size="10" fill="#33424D">rudder trim</text>
  <text x="278" y="247" text-anchor="middle" font-size="10" fill="#33424D">travel limit</text>
  <line x1="144" y1="193" x2="208" y2="193" stroke="#33424D" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#a33424D)"/>
  <line x1="278" y1="160" x2="278" y2="144" stroke="#33424D" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#a33424D)"/>
  <text x="18" y="278" font-size="10.5" fill="#33424D">Las órdenes automáticas no mueven los pedales.</text>
  <line x1="18" y1="296" x2="38" y2="296" stroke="#33424D" stroke-width="1.8" stroke-dasharray="1.5 3"/>
  <text x="43" y="300" font-size="10" fill="#33424D">mecánico</text>
  <line x1="110" y1="296" x2="130" y2="296" stroke="#33424D" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="135" y="300" font-size="10" fill="#33424D">orden eléctrica</text>
</svg>
