<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 304" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Tres zonas, aire frío y aire caliente</title>
  <desc id="d">Los dos packs mandan aire frío a la mixing unit, que lo mezcla con aire recirculado; de ahí sale un ducto a cada zona: cockpit, FWD CABIN y AFT CABIN. El aire caliente se toma antes de los packs por la hot air pressure regulating valve, y una trim air valve por zona agrega ese aire caliente a su ducto.</desc>
  <rect x="1" y="1" width="358" height="302" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <defs><marker id="a2F6FD6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2F6FD6"/></marker><marker id="aC0392B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#C0392B"/></marker></defs>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Tres zonas, aire frío y aire caliente</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">Esquema simplificado.</text>
  <rect x="40" y="58" width="84" height="26" rx="7" fill="#F3F5F7" stroke="#8C99A3" stroke-width="1.4"/>
  <text x="82" y="75" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1E2A33">Cockpit</text>
