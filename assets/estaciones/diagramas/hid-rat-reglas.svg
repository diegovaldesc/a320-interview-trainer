<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 214" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Reglas del RAT</title>
  <desc id="d">El RAT mueve el sistema Blue a 2500 PSI y el Blue mueve el emergency generator. Sale solo si se pierden AC BUS 1 y AC BUS 2 sobre 100 kt, se puede sacar con RAT MAN ON y solo se guarda en tierra.</desc>
  <defs>
    <marker id="fb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2F6FD6"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="358" height="212" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>

  <!-- cadena RAT → Blue → emergency generator -->
  <rect x="14" y="16" width="70" height="56" rx="10" fill="#EAF1FC" stroke="#2F6FD6" stroke-width="2"/>
  <ellipse cx="49" cy="38" rx="4" ry="14" fill="#2F6FD6" transform="rotate(30 49 38)"/>
  <ellipse cx="49" cy="38" rx="4" ry="14" fill="#2F6FD6" transform="rotate(-30 49 38)"/>
  <circle cx="49" cy="38" r="4" fill="#1E2A33"/>
  <text x="49" y="65" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1E2A33">RAT</text>
  <line x1="86" y1="44" x2="104" y2="44" stroke="#2F6FD6" stroke-width="2.5" marker-end="url(#fb)"/>
  <rect x="108" y="16" width="104" height="56" rx="10" fill="#2F6FD6"/>
  <text x="160" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">BLUE</text>
  <text x="160" y="58" text-anchor="middle" font-size="11.5" fill="#FFFFFF">2500 PSI</text>
  <line x1="214" y1="44" x2="232" y2="44" stroke="#2F6FD6" stroke-width="2.5" marker-end="url(#fb)"/>
  <rect x="236" y="16" width="110" height="56" rx="10" fill="#FFFFFF" stroke="#2F6FD6" stroke-width="2"/>
  <text x="291" y="40" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1E2A33">Emergency</text>
  <text x="291" y="56" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1E2A33">generator</text>

  <!-- reglas -->
  <rect x="14" y="88" width="332" height="34" rx="8" fill="#F3F6F8"/>
  <text x="26" y="110" font-size="12" fill="#1E2A33"><tspan font-weight="700">Sale solo:</tspan> sin AC BUS 1 ni AC BUS 2, sobre 100 kt</text>
  <rect x="14" y="128" width="332" height="34" rx="8" fill="#F3F6F8"/>
  <text x="26" y="150" font-size="12" fill="#1E2A33"><tspan font-weight="700">Manual:</tspan> RAT MAN ON pb, en cualquier momento</text>
  <rect x="14" y="168" width="332" height="34" rx="8" fill="#F3F6F8"/>
  <text x="26" y="190" font-size="12" fill="#1E2A33"><tspan font-weight="700">Stow:</tspan> solo con el avión en tierra</text>
</svg>
