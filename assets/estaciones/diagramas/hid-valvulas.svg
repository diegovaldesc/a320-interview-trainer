<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Válvulas y filtros de un sistema con bomba de motor</title>
  <desc id="d">En Green y Yellow, la fire shutoff valve está antes de la bomba del motor y se cierra con el ENG FIRE pb. La leak measurement valve está antes de los primary flight controls y se cierra desde el maintenance panel. El case drain filter de la bomba permite revisar su desgaste.</desc>
  <rect x="1" y="1" width="358" height="298" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>

  <!-- recorrido -->
  <line x1="60" y1="262" x2="60" y2="40" stroke="#2E9D5B" stroke-width="6" stroke-linecap="round"/>
  <line x1="60" y1="40" x2="214" y2="40" stroke="#2E9D5B" stroke-width="6" stroke-linecap="round"/>

  <!-- reservorio -->
  <rect x="18" y="258" width="84" height="28" rx="7" fill="#E9F5EE" stroke="#2E9D5B" stroke-width="2"/>
  <text x="60" y="276" text-anchor="middle" font-size="11.5" fill="#1E2A33">Reservorio</text>

  <!-- fire shutoff valve -->
  <circle cx="60" cy="214" r="14" fill="#FFFFFF" stroke="#C0392B" stroke-width="3"/>
  <line x1="60" y1="200" x2="60" y2="228" stroke="#C0392B" stroke-width="3"/>
  <text x="84" y="210" font-size="12" font-weight="700" fill="#A93226">Fire shutoff valve</text>
  <text x="84" y="226" font-size="11" fill="#33424D">se cierra con el ENG 1(2) FIRE pb</text>
  <text x="84" y="241" font-size="10.5" fill="#5B6B78">solo Green y Yellow (el Blue no tiene)</text>

  <!-- bomba de motor + filtro -->
  <rect x="20" y="146" width="80" height="34" rx="9" fill="#FFFFFF" stroke="#2E9D5B" stroke-width="2"/>
  <text x="60" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#1E2A33">ENG pump</text>
  <path d="M100 163 L120 163" stroke="#8A99A6" stroke-width="2"/>
  <path d="M120 152 L138 163 L120 174 Z" fill="#F3F6F8" stroke="#5B6B78" stroke-width="1.5"/>
  <text x="146" y="159" font-size="12" font-weight="700" fill="#1E2A33">Case drain filter</text>
  <text x="146" y="175" font-size="11" fill="#33424D">mantenimiento revisa desgaste</text>

  <!-- leak measurement valve -->
  <circle cx="60" cy="96" r="13" fill="#FFFFFF" stroke="#33424D" stroke-width="2.5"/>
  <line x1="47" y1="96" x2="73" y2="96" stroke="#33424D" stroke-width="2.5"/>
  <text x="84" y="92" font-size="12" font-weight="700" fill="#1E2A33">Leak measurement valve</text>
  <text x="84" y="108" font-size="11" fill="#33424D">se cierra desde el maintenance panel</text>

  <!-- primary flight controls -->
  <rect x="214" y="22" width="132" height="38" rx="9" fill="#FFFFFF" stroke="#1E2A33" stroke-width="2"/>
  <text x="280" y="38" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1E2A33">Primary</text>
  <text x="280" y="53" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1E2A33">flight controls</text>

</svg>
