  <text x="287" y="222" text-anchor="middle" font-size="9" font-weight="700" fill="#D99A00">Muestra presión solo</text>
  <text x="287" y="234" text-anchor="middle" font-size="9" font-weight="700" fill="#D99A00">cuando frena Yellow</text>
  <text x="18" y="318" font-size="9" fill="#33424D">Con el switch A/SKID &amp; N/W STRG en OFF: Yellow sin antiskid ni steering.</text>
</svg>
