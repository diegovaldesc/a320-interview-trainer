  <title id="t">Arranque en tierra con external power</title>
  <desc id="d">Antes del arranque, el EXT PWR alimenta AC BUS 1 y AC BUS 2 con los dos BTC cerrados. Con el motor 2 en marcha, el GEN 2 toma el AC BUS 2 y el EXT PWR sigue con el AC BUS 1 por el BTC 1. Con los dos motores, cada GEN alimenta su lado, los BTC se abren y el EXT PWR queda disponible sin alimentar.</desc>
