<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 228" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Los tanques del A320</title>
  <desc id="d">Esquema, no a escala, de los tanques de punta a punta: vent surge tank, outer tank, inner tank, center tank, inner tank, outer tank y vent surge tank. Combustible usable aproximado: entre 680 y 690 kg en cada outer tank, entre 5 400 y 5 600 kg en cada inner tank y unos 6 470 kg en el center tank; en total, entre 18 600 y 19 000 kg según el avión.</desc>
  <rect x="1" y="1" width="358" height="226" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Los tanques del A320</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">Esquema, no a escala. Combustible usable aproximado.</text>
  <rect x="146" y="70" width="68" height="80" rx="10" fill="#F3F5F7" stroke="#8C99A3" stroke-width="1.4" stroke-dasharray="3 3"/>
  <rect x="16" y="80" width="22" height="60" rx="3" fill="#FFFFFF" stroke="#8C99A3" stroke-width="1.3" stroke-dasharray="3 2"/>
  <rect x="38" y="80" width="48" height="60" rx="3" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.3"/>
  <text x="62" y="114" text-anchor="middle" font-size="11" font-weight="800" fill="#0E5E6F">Outer</text>
  <rect x="86" y="80" width="66" height="60" rx="3" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.3"/>
  <text x="119" y="114" text-anchor="middle" font-size="11" font-weight="800" fill="#0E5E6F">Inner</text>
  <rect x="152" y="80" width="56" height="60" rx="3" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.3"/>
  <text x="180" y="114" text-anchor="middle" font-size="11" font-weight="800" fill="#0E5E6F">Center</text>
  <rect x="208" y="80" width="66" height="60" rx="3" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.3"/>
  <text x="241" y="114" text-anchor="middle" font-size="11" font-weight="800" fill="#0E5E6F">Inner</text>
  <rect x="274" y="80" width="48" height="60" rx="3" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.3"/>
  <text x="298" y="114" text-anchor="middle" font-size="11" font-weight="800" fill="#0E5E6F">Outer</text>
  <rect x="322" y="80" width="22" height="60" rx="3" fill="#FFFFFF" stroke="#8C99A3" stroke-width="1.3" stroke-dasharray="3 2"/>
  <line x1="27" y1="66" x2="27" y2="80" stroke="#8C99A3" stroke-width="1.2"/>
  <text x="16" y="62" font-size="10" fill="#33424D">Vent surge tank</text>
  <line x1="333" y1="66" x2="333" y2="80" stroke="#8C99A3" stroke-width="1.2"/>
  <text x="344" y="62" text-anchor="end" font-size="10" fill="#33424D">Vent surge tank</text>
  <text x="119" y="160" text-anchor="middle" font-size="10" fill="#33424D">5 400–5 600 kg</text>
  <text x="241" y="160" text-anchor="middle" font-size="10" fill="#33424D">5 400–5 600 kg</text>
  <line x1="62" y1="140" x2="62" y2="172" stroke="#8C99A3" stroke-width="1.2"/>
  <text x="62" y="184" text-anchor="middle" font-size="10" fill="#33424D">680–690 kg</text>
  <line x1="298" y1="140" x2="298" y2="172" stroke="#8C99A3" stroke-width="1.2"/>
  <text x="298" y="184" text-anchor="middle" font-size="10" fill="#33424D">680–690 kg</text>
  <line x1="180" y1="150" x2="180" y2="172" stroke="#8C99A3" stroke-width="1.2"/>
  <text x="180" y="184" text-anchor="middle" font-size="10" fill="#33424D">unos 6 470 kg</text>
  <text x="180" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#1E2A33">Total: entre 18 600 y 19 000 kg, según el avión</text>
</svg>
