<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 284" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Fuentes de aire</title>
  <desc id="d">Esquema del sistema neumático: el bleed del motor 1 y del motor 2, cada uno con su bleed valve, unidos por el crossbleed duct con su crossbleed valve. La conexión de tierra HP y el APU, con su APU bleed valve, entran por el lado izquierdo. Arriba, los usuarios: el pack 1 y el wing anti-ice de un lado, el pack 2 y el wing anti-ice del otro.</desc>
