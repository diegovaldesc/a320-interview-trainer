<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 238" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Flaps lever: CONF 1+F y CONF 1</title>
  <desc id="d">Flaps lever con las posiciones 0, 1, 2, 3 y FULL, con topes en 1 y en 3. En la posición 1, CONF 1+F (slats 18°, flaps 10°) en tierra para el despegue, con retracción automática de los flaps a 210 kt; y CONF 1 (slats 18°, flaps 0°) al pasar de 0 a 1 en vuelo.</desc>
  <rect x="1" y="1" width="358" height="236" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <rect x="24" y="24" width="60" height="170" rx="10" fill="#F3F5F7" stroke="#C9D3DB" stroke-width="1.4"/>
  <line x1="44" y1="40" x2="44" y2="176" stroke="#8C99A3" stroke-width="3" stroke-linecap="round"/>
  <line x1="38" y1="40" x2="50" y2="40" stroke="#1E2A33" stroke-width="1.6"/>
  <text x="56" y="44" font-size="11" font-weight="700" fill="#1E2A33">0</text>
  <line x1="38" y1="74" x2="50" y2="74" stroke="#1E2A33" stroke-width="1.6"/>
  <text x="56" y="78" font-size="11" font-weight="700" fill="#1E2A33">1</text>
  <text x="30" y="78" text-anchor="middle" font-size="9" fill="#D98A00">▸</text>
  <line x1="38" y1="108" x2="50" y2="108" stroke="#1E2A33" stroke-width="1.6"/>
  <text x="56" y="112" font-size="11" font-weight="700" fill="#1E2A33">2</text>
  <line x1="38" y1="142" x2="50" y2="142" stroke="#1E2A33" stroke-width="1.6"/>
  <text x="56" y="146" font-size="11" font-weight="700" fill="#1E2A33">3</text>
  <text x="30" y="146" text-anchor="middle" font-size="9" fill="#D98A00">▸</text>
  <line x1="38" y1="176" x2="50" y2="176" stroke="#1E2A33" stroke-width="1.6"/>
  <text x="56" y="180" font-size="11" font-weight="700" fill="#1E2A33">FULL</text>
  <rect x="36" y="67" width="16" height="14" rx="4" fill="#1E2A33" stroke="#1E2A33" stroke-width="1.4"/>
  <text x="54" y="206" text-anchor="middle" font-size="8.5" fill="#D98A00">topes en 1 y 3</text>
  <rect x="116" y="26" width="228" height="88" rx="10" fill="#FFFFFF" stroke="#7F8D99" stroke-width="1.4"/>
  <text x="128" y="46" font-size="12" font-weight="800" fill="#0E7C86">CONF 1+F</text>
  <text x="128" y="61" font-size="10" font-weight="700" fill="#33424D">Slats 18° · flaps 10°</text>
  <text x="128" y="78" font-size="9.5" fill="#5B6B78">En tierra, para el despegue.</text>
  <text x="128" y="91" font-size="9.5" fill="#5B6B78">Si no se pasa a 0, los flaps</text>
  <text x="128" y="104" font-size="9.5" fill="#5B6B78">se retraen solos a 210 kt.</text>
  <path d="M264 54 C270 46 300 46 320 52 L320 57 C300 58 272 59 264 54 Z" fill="#FFFFFF" stroke="#1E2A33" stroke-width="1.2"/>
  <polygon points="261.4,53.1 249.9,60 261.3,59.4" fill="#E4EAEF" stroke="#7F8D99" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="321.4,52 344.5,59.2 320.5,57.5" fill="#E4EAEF" stroke="#7F8D99" stroke-width="1.2" stroke-linejoin="round"/>
  <rect x="116" y="124" width="228" height="88" rx="10" fill="#FFFFFF" stroke="#7F8D99" stroke-width="1.4"/>
  <text x="128" y="144" font-size="12" font-weight="800" fill="#0E7C86">CONF 1</text>
  <text x="128" y="159" font-size="10" font-weight="700" fill="#33424D">Slats 18° · flaps 0°</text>
  <text x="128" y="176" font-size="9.5" fill="#5B6B78">En vuelo, al pasar de 0 a 1.</text>
  <text x="128" y="189" font-size="9.5" fill="#5B6B78">Los slats salen; los flaps</text>
  <text x="128" y="202" font-size="9.5" fill="#5B6B78">se quedan arriba.</text>
  <path d="M264 152 C270 144 300 144 320 150 L320 155 C300 156 272 157 264 152 Z" fill="#FFFFFF" stroke="#1E2A33" stroke-width="1.2"/>
  <polygon points="261.4,151.1 249.9,158 261.3,157.4" fill="#E4EAEF" stroke="#7F8D99" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="321,150 345,153 321,155.5" fill="#E4EAEF" stroke="#7F8D99" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="180" y="226" text-anchor="middle" font-size="9.5" fill="#33424D">Las posiciones 2, 3 y FULL extienden más los slats y los flaps.</text>
</svg>
