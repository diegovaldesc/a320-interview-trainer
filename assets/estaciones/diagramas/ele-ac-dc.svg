<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">AC y DC</title>
  <desc id="d">DC: una línea pareja de 28 V, siempre del mismo lado del cero; la entregan las baterías y los TR. AC: una onda que cruza el cero en ciclos, 115/200 V y 400 Hz; la entregan los generadores, el external power y el static inverter.</desc>
  <rect x="1" y="1" width="358" height="238" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="18" y="32" font-size="12" font-weight="700" fill="#33424D">DC · corriente continua</text>
  <text x="18" y="52" font-size="10.5" fill="#1E2A33">28 V, siempre en el</text>
  <text x="18" y="66" font-size="10.5" fill="#1E2A33">mismo sentido</text>
  <text x="18" y="88" font-size="10.5" fill="#5B6B78">La entregan: baterías y TR</text>
  <path d="M196 22 L196 92" fill="none" stroke="#5B6B78" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M196 84 L344 84" fill="none" stroke="#5B6B78" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="190" y="88" text-anchor="end" font-size="10.5" fill="#5B6B78">0</text>
  <text x="344" y="99" text-anchor="end" font-size="10.5" fill="#5B6B78">tiempo</text>
  <path d="M196 42 L340 42" fill="none" stroke="#2E9D5B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="344" y="36" text-anchor="end" font-size="10.5" font-weight="700" fill="#1F6E41">28 V</text>
  <line x1="14" y1="112" x2="346" y2="112" stroke="#E4E9ED" stroke-width="1"/>
  <text x="18" y="138" font-size="12" font-weight="700" fill="#33424D">AC · corriente alterna</text>
  <text x="18" y="158" font-size="10.5" fill="#1E2A33">115/200 V y 400 Hz:</text>
  <text x="18" y="172" font-size="10.5" fill="#1E2A33">cambia de sentido en ciclos</text>
  <text x="18" y="194" font-size="10.5" fill="#5B6B78">La entregan: generadores,</text>
  <text x="18" y="208" font-size="10.5" fill="#5B6B78">EXT PWR y static inverter</text>
  <path d="M196 130 L196 214" fill="none" stroke="#5B6B78" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M196 172 L344 172" fill="none" stroke="#5B6B78" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
