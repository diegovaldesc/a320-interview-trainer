<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 328" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Quién llama a quién</title>
  <desc id="d">SELCAL desde tierra: destella la tecla de la radio y suena el buzzer hasta RESET. Cabina al cockpit: destella ATT en la tecla CAB y suena un buzzer; EMER: ON, CALL y tres buzzers. Mecánico al cockpit: destella MECH ámbar y suena un buzzer. Cockpit a la cabina: panel CALLS, FWD o AFT para lo normal y EMER para lo urgente. Cockpit al mecánico: botón MECH, luz azul COCKPIT CALL y bocina externa.</desc>
  <rect x="1" y="1" width="358" height="326" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Quién llama a quién</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">Y cómo se ve en el cockpit.</text>
  <rect x="16" y="58" width="328" height="42" rx="6" fill="#FFFFFF" stroke="#0E5E6F" stroke-width="1.4"/>
  <text x="26" y="83" font-size="10.5" font-weight="800" fill="#0E5E6F">Tierra (SELCAL)</text>
  <text x="150" y="76" font-size="10" fill="#33424D">Destella la tecla de la radio;</text>
  <text x="150" y="90" font-size="10" fill="#33424D">buzzer hasta RESET.</text>
  <rect x="16" y="106" width="328" height="42" rx="6" fill="#FFFFFF" stroke="#C77700" stroke-width="1.4"/>
  <text x="26" y="131" font-size="10.5" font-weight="800" fill="#8A5300">Cabina al cockpit</text>
  <text x="150" y="124" font-size="10" fill="#33424D">Destella ATT en la tecla CAB;</text>
  <text x="150" y="138" font-size="10" fill="#33424D">buzzer. EMER: ON, CALL, 3 buzzers.</text>
  <rect x="16" y="154" width="328" height="42" rx="6" fill="#FFFFFF" stroke="#C77700" stroke-width="1.4"/>
  <text x="26" y="179" font-size="10.5" font-weight="800" fill="#8A5300">Mecánico al cockpit</text>
  <text x="150" y="172" font-size="10" fill="#33424D">Destella MECH ámbar en los ACP;</text>
  <text x="150" y="186" font-size="10" fill="#33424D">buzzer. Es una llamada, no una falla.</text>
  <rect x="16" y="202" width="328" height="42" rx="6" fill="#FFFFFF" stroke="#2E9D5B" stroke-width="1.4"/>
  <text x="26" y="227" font-size="10.5" font-weight="800" fill="#2E9D5B">Cockpit a la cabina</text>
  <text x="150" y="220" font-size="10" fill="#33424D">Panel CALLS: FWD/AFT (normal),</text>
  <text x="150" y="234" font-size="10" fill="#33424D">EMER (todas, urgente).</text>
  <rect x="16" y="250" width="328" height="42" rx="6" fill="#FFFFFF" stroke="#2E9D5B" stroke-width="1.4"/>
  <text x="26" y="275" font-size="10.5" font-weight="800" fill="#2E9D5B">Cockpit al mecánico</text>
  <text x="150" y="268" font-size="10" fill="#33424D">Botón MECH: luz azul COCKPIT CALL</text>
  <text x="150" y="282" font-size="10" fill="#33424D">y bocina externa.</text>
  <text x="16" y="314" font-size="10.5" fill="#5B6B78">SELCAL y buzzers de cabina: inhibidos en despegue y aterrizaje.</text>
</svg>
