<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 272" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Del tanque al motor</title>
  <desc id="d">Dos bombas en cada inner tank empujan el combustible por la línea de su lado hasta la LP valve y el motor. La crossfeed valve, cerrada en el dibujo, une las dos líneas. El APU toma combustible de la línea izquierda, con su APU fuel pump.</desc>
