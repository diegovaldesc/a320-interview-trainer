<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 298" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Oxígeno del cockpit</title>
  <desc id="d">De la botella de alta presión al regulador, a la válvula CREW SUPPLY y a las máscaras. A320 con motores IAE o CFM: una botella para todas las máscaras. A320neo: dos botellas, una para el capitán y el tercer ocupante y otra para el F/O y el cuarto. Si sube demasiado la presión, el oxígeno se descarga afuera.</desc>
