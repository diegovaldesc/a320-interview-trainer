<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 292" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Rechazar o continuar</title>
  <desc id="d">Cinta de velocidad en tres tramos. Bajo 100 kt: el comandante decide según el caso y, ante una alerta ECAM, considera seriamente rechazar. De 100 kt a V1, go-minded: rechazar solo por fuego o daño severo, pérdida súbita de empuje, señal inequívoca de que no volará o alerta ECAM. Sobre V1, GO: continuar. La acción de parar se toma antes de V1. Bajo 72 kt no salen los ground spoilers ni el autobrake.</desc>
  <rect x="1" y="1" width="358" height="290" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Rechazar o continuar</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">Decide el comandante; la acción de parar, antes de V1.</text>
  <rect x="18" y="56" width="132" height="24" rx="4" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.3"/>
  <text x="84" y="72" text-anchor="middle" font-size="11" font-weight="800" fill="#0E5E6F">según el caso</text>
  <rect x="150" y="56" width="118" height="24" rx="4" fill="#FCEBD3" stroke="#C77700" stroke-width="1.3"/>
  <text x="209" y="72" text-anchor="middle" font-size="11" font-weight="800" fill="#C77700">go-minded</text>
  <rect x="268" y="56" width="74" height="24" rx="4" fill="#E5F4EA" stroke="#2E9D5B" stroke-width="1.3"/>
  <text x="305" y="72" text-anchor="middle" font-size="11" font-weight="800" fill="#2E9D5B">GO</text>
  <text x="150" y="96" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1E2A33">100 kt</text>
  <text x="268" y="96" text-anchor="middle" font-size="11" font-weight="800" fill="#1E2A33">V1</text>
  <line x1="150" y1="52" x2="150" y2="84" stroke="#1E2A33" stroke-width="1.4"/>
  <line x1="268" y1="52" x2="268" y2="84" stroke="#1E2A33" stroke-width="1.4"/>
  <rect x="18" y="116" width="86" height="22" rx="5" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.3"/>
  <text x="61" y="131" text-anchor="middle" font-size="10.5" font-weight="800" fill="#0E5E6F">Bajo 100 kt</text>
  <text x="114" y="129" font-size="10.5" fill="#33424D">Decide según el caso; ante una alerta</text>
  <text x="114" y="143" font-size="10.5" fill="#33424D">ECAM, considerar seriamente rechazar.</text>
  <rect x="18" y="158" width="86" height="22" rx="5" fill="#FCEBD3" stroke="#C77700" stroke-width="1.3"/>
  <text x="61" y="173" text-anchor="middle" font-size="10.5" font-weight="800" fill="#C77700">100 kt a V1</text>
  <text x="114" y="171" font-size="10.5" fill="#33424D">Solo por fuego o daño severo, pérdida</text>
  <text x="114" y="185" font-size="10.5" fill="#33424D">súbita de empuje, señal inequívoca de</text>
  <text x="114" y="199" font-size="10.5" fill="#33424D">que no volará, o alerta ECAM.</text>
  <rect x="18" y="214" width="86" height="22" rx="5" fill="#E5F4EA" stroke="#2E9D5B" stroke-width="1.3"/>
  <text x="61" y="229" text-anchor="middle" font-size="10.5" font-weight="800" fill="#2E9D5B">Sobre V1</text>
  <text x="114" y="227" font-size="10.5" fill="#33424D">Continuar: puede no quedar pista</text>
  <text x="114" y="241" font-size="10.5" fill="#33424D">para detenerse.</text>
  <text x="18" y="280" font-size="10" fill="#5B6B78">Bajo 72 kt no salen los ground spoilers ni el autobrake.</text>
</svg>
