  <text x="109" y="173" text-anchor="middle" font-size="11" font-weight="800" fill="#D99A00">Y</text>
  <text x="109" y="196" text-anchor="middle" font-size="10.5" fill="#33424D">SEC 3</text>
  <rect x="136" y="140" width="42" height="40" rx="5" fill="#EAF1FC" stroke="#2F6FD6" stroke-width="1.6"/>
  <text x="157" y="157" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1E2A33">3</text>
