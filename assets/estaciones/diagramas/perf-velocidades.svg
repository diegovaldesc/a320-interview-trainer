<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Las velocidades del despegue</title>
  <desc id="d">Despegue visto de lado: VMCG, VEF, V1 y VR sobre la pista, VLOF al dejar el suelo y V2 a 35 ft. Debajo: VMCG ≤ VEF ≤ V1 ≤ VR; VR ≥ 1,05 VMCA; V2 ≥ 1,1 VMCA; V2 ≥ 1,13 VS1g; V1 ≤ VMBE; la VLOF limitada por los neumáticos.</desc>
  <rect x="1" y="1" width="358" height="248" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <defs><marker id="a8C99A3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8C99A3"/></marker><marker id="b8C99A3" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#8C99A3"/></marker></defs>
  <text x="18" y="26" font-size="12.5" font-weight="800" fill="#0E5E6F">Las velocidades del despegue</text>
  <text x="18" y="42" font-size="10" fill="#5B6B78">De izquierda a derecha, en el orden en que aparecen.</text>
  <rect x="14" y="150" width="262" height="9" rx="2" fill="#4A5560" stroke="#4A5560" stroke-width="1"/>
  <line x1="14" y1="159" x2="346" y2="159" stroke="#8C99A3" stroke-width="1"/>
  <line x1="24" y1="154.5" x2="266" y2="154.5" stroke="#FFFFFF" stroke-width="1.2" stroke-dasharray="8 7"/>
  <line x1="250" y1="96" x2="346" y2="96" stroke="#8C99A3" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="346" y="90" text-anchor="end" font-size="9.5" font-weight="700" fill="#5B6B78">35 ft</text>
  <path d="M22 146 L228 146 Q282 143 326 96" fill="none" stroke="#0E5E6F" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="66" y1="140" x2="66" y2="150" stroke="#1E2A33" stroke-width="1.4"/>
  <text x="66" y="134" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1E2A33">VMCG</text>
  <line x1="116" y1="140" x2="116" y2="150" stroke="#1E2A33" stroke-width="1.4"/>
  <text x="116" y="134" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1E2A33">VEF</text>
  <line x1="140" y1="140" x2="140" y2="150" stroke="#1E2A33" stroke-width="1.4"/>
  <text x="140" y="134" text-anchor="middle" font-size="10.5" font-weight="800" fill="#C77700">V1</text>
  <line x1="186" y1="140" x2="186" y2="150" stroke="#1E2A33" stroke-width="1.4"/>
  <text x="186" y="134" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1E2A33">VR</text>
  <line x1="228" y1="140" x2="228" y2="150" stroke="#1E2A33" stroke-width="1.4"/>
  <text x="228" y="134" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1E2A33">VLOF</text>
  <circle cx="326" cy="96" r="3.2" fill="#0E5E6F" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="318" y="80" text-anchor="middle" font-size="11" font-weight="800" fill="#0E5E6F">V2</text>
  <text x="22" y="140" font-size="9" fill="#5B6B78">BR</text>
  <text x="18" y="186" font-size="11.5" font-weight="800" fill="#1E2A33">VMCG ≤ VEF ≤ V1 ≤ VR</text>
  <text x="18" y="203" font-size="9.5" fill="#5B6B78">VEF: un segundo antes de V1, para reconocer la falla.</text>
  <text x="18" y="221" font-size="9.8" fill="#1E2A33">VR ≥ 1,05 VMCA · V2 ≥ 1,1 VMCA · V2 ≥ 1,13 VS1g</text>
  <text x="18" y="238" font-size="9.5" fill="#5B6B78">V1 ≤ VMBE (frenos) · VLOF limitada por los neumáticos (195 kt GS)</text>
</svg>
