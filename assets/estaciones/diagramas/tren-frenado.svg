<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 314" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Modos de frenado</title>
  <desc id="d">Tabla de los modos de frenado en los MSN más nuevos, con ABCU. Normal: fuerza de Green, mando del BSCU, con antiskid y autobrake. Alternate con antiskid: Yellow o el accumulator, mando del ABCU, con el antiskid del BSCU. Alternate sin antiskid: Yellow o el accumulator, mando del ABCU, con la presión limitada a 1 000 PSI en forma automática. Parking brake: Yellow o el accumulator, con su manija, a presión completa. Si falta Green, el paso a Yellow es automático; alternate y parking brake comparten la reserva, y el accumulator cargado da al menos 7 aplicaciones.</desc>
  <rect x="1" y="1" width="358" height="312" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Modos de frenado</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">MSN más nuevos (con ABCU).</text>
  <text x="18" y="66" font-size="10" font-weight="800" fill="#5B6B78">Modo</text>
  <text x="130" y="66" font-size="10" font-weight="800" fill="#5B6B78">Fuerza</text>
  <text x="192" y="66" font-size="10" font-weight="800" fill="#5B6B78">Mando</text>
  <text x="252" y="66" font-size="10" font-weight="800" fill="#5B6B78">Protección</text>
  <line x1="18" y1="74" x2="342" y2="74" stroke="#C9D3DB" stroke-width="1"/>
  <rect x="18" y="82" width="4" height="28" rx="2" fill="#2E9D5B" stroke="#2E9D5B" stroke-width="0"/>
  <text x="28" y="100" font-size="11" font-weight="800" fill="#1E2A33">Normal</text>
  <rect x="130" y="87" width="16" height="16" rx="3" fill="#E9F5EE" stroke="#2E9D5B" stroke-width="1.5"/>
  <text x="138" y="99" text-anchor="middle" font-size="10.5" font-weight="800" fill="#2E9D5B">G</text>
  <text x="192" y="100" font-size="11" font-weight="800" fill="#0E5E6F">BSCU</text>
  <text x="252" y="93" font-size="10.5" fill="#33424D">antiskid y</text>
  <text x="252" y="107" font-size="10.5" fill="#33424D">autobrake</text>
  <line x1="18" y1="118" x2="342" y2="118" stroke="#C9D3DB" stroke-width="1"/>
  <rect x="18" y="126" width="4" height="28" rx="2" fill="#D99A00" stroke="#D99A00" stroke-width="0"/>
  <text x="28" y="137" font-size="11" font-weight="800" fill="#1E2A33">Alternate</text>
  <text x="28" y="151" font-size="11" font-weight="800" fill="#1E2A33">con antiskid</text>
  <rect x="130" y="131" width="16" height="16" rx="3" fill="#FDF3DC" stroke="#D99A00" stroke-width="1.5"/>
  <text x="138" y="143" text-anchor="middle" font-size="10.5" font-weight="800" fill="#D99A00">Y</text>
  <text x="150" y="143" font-size="10" fill="#33424D">o accu</text>
  <text x="192" y="144" font-size="11" font-weight="800" fill="#0E5E6F">ABCU</text>
  <text x="252" y="137" font-size="10.5" fill="#33424D">antiskid</text>
  <text x="252" y="151" font-size="10.5" fill="#33424D">(del BSCU)</text>
  <line x1="18" y1="162" x2="342" y2="162" stroke="#C9D3DB" stroke-width="1"/>
  <rect x="18" y="170" width="4" height="28" rx="2" fill="#C77700" stroke="#C77700" stroke-width="0"/>
  <text x="28" y="181" font-size="11" font-weight="800" fill="#1E2A33">Alternate</text>
  <text x="28" y="195" font-size="11" font-weight="800" fill="#1E2A33">sin antiskid</text>
  <rect x="130" y="175" width="16" height="16" rx="3" fill="#FDF3DC" stroke="#D99A00" stroke-width="1.5"/>
  <text x="138" y="187" text-anchor="middle" font-size="10.5" font-weight="800" fill="#D99A00">Y</text>
  <text x="150" y="187" font-size="10" fill="#33424D">o accu</text>
  <text x="192" y="188" font-size="11" font-weight="800" fill="#0E5E6F">ABCU</text>
  <text x="252" y="181" font-size="10.5" fill="#33424D">máx. 1 000 PSI</text>
  <text x="252" y="195" font-size="10.5" fill="#33424D">automático</text>
  <line x1="18" y1="206" x2="342" y2="206" stroke="#C9D3DB" stroke-width="1"/>
  <rect x="18" y="214" width="4" height="28" rx="2" fill="#33424D" stroke="#33424D" stroke-width="0"/>
  <text x="28" y="232" font-size="11" font-weight="800" fill="#1E2A33">Parking brake</text>
  <rect x="130" y="219" width="16" height="16" rx="3" fill="#FDF3DC" stroke="#D99A00" stroke-width="1.5"/>
  <text x="138" y="231" text-anchor="middle" font-size="10.5" font-weight="800" fill="#D99A00">Y</text>
  <text x="150" y="231" font-size="10" fill="#33424D">o accu</text>
  <text x="192" y="232" font-size="11" font-weight="800" fill="#0E5E6F">manija</text>
  <text x="252" y="225" font-size="10.5" fill="#33424D">presión</text>
  <text x="252" y="239" font-size="10.5" fill="#33424D">completa</text>
  <line x1="18" y1="250" x2="342" y2="250" stroke="#C9D3DB" stroke-width="1"/>
  <text x="18" y="270" font-size="10.5" fill="#33424D">Si falta Green, el paso a Yellow es automático.</text>
  <text x="18" y="286" font-size="10.5" fill="#33424D">Alternate y parking brake comparten la reserva: Yellow o el</text>
  <text x="18" y="301" font-size="10.5" fill="#33424D">accumulator (cargado, al menos 7 aplicaciones).</text>
</svg>
