<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 296" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Piezas de la presurización</title>
  <desc id="d">La cabina presurizada, con la outflow valve atrás. Su actuador tiene tres motores: el automático 1, del CPC 1, el automático 2, del CPC 2, y el manual, que funciona con el MODE SEL en MAN; cualquiera de los tres la mueve. En el mamparo trasero, dos safety valves limitan la diferencia de presión a 8,6 PSI positivos y 1 PSI negativo.</desc>
  <rect x="1" y="1" width="358" height="294" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Piezas de la presurización</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">Esquema, no a escala.</text>
  <rect x="18" y="64" width="300" height="80" rx="30" fill="#FFFFFF" stroke="#2F6FD6" stroke-width="1.4"/>
  <text x="150" y="108" text-anchor="middle" font-size="11" font-weight="700" fill="#2F6FD6">Cabina presurizada</text>
  <rect x="318" y="82" width="10" height="44" rx="2" fill="#33424D" stroke="#33424D" stroke-width="1.4"/>
  <text x="338" y="57" text-anchor="end" font-size="10" fill="#33424D">Mamparo</text>
  <circle cx="323" cy="92" r="5" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.6"/>
  <circle cx="323" cy="116" r="5" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.6"/>
  <rect x="262" y="144" width="40" height="12" rx="2" fill="#FCEBD3" stroke="#C77700" stroke-width="1.4"/>
  <text x="282" y="172" text-anchor="middle" font-size="10.5" font-weight="700" fill="#C77700">Outflow valve</text>
  <line x1="282" y1="176" x2="282" y2="192" stroke="#8C99A3" stroke-width="1.2"/>
  <rect x="20" y="196" width="96" height="40" rx="7" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.4"/>
  <text x="68" y="213.5" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1E2A33">Motor auto 1</text>
  <text x="68" y="226.5" text-anchor="middle" font-size="10" fill="#33424D">del CPC 1</text>
  <rect x="126" y="196" width="96" height="40" rx="7" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.4"/>
  <text x="174" y="213.5" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1E2A33">Motor auto 2</text>
  <text x="174" y="226.5" text-anchor="middle" font-size="10" fill="#33424D">del CPC 2</text>
  <rect x="232" y="196" width="108" height="40" rx="7" fill="#F3F5F7" stroke="#8C99A3" stroke-width="1.4"/>
  <text x="286" y="213.5" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1E2A33">Motor manual</text>
  <text x="286" y="226.5" text-anchor="middle" font-size="10" fill="#33424D">MODE SEL en MAN</text>
  <text x="180" y="258" text-anchor="middle" font-size="10.5" fill="#1E2A33">Cualquiera de los tres mueve la outflow valve.</text>
  <text x="20" y="282" font-size="10.5" font-weight="700" fill="#C0392B">Safety valves (rojo): limitan +8,6 PSI y −1 PSI.</text>
</svg>
