<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 296" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">El peso máximo de despegue del día</title>
  <desc id="d">Seis barras con el peso que permite cada límite, con números de ejemplo: estructural 77,0 t, pista 75,8 t, ascenso 72,5 t, obstáculos 74,1 t, neumáticos 76,4 t y frenos 75,3 t. La más corta, el ascenso, es el máximo del día. El EFB optimiza flaps, empuje y velocidades, y eso mueve varios límites a la vez.</desc>
  <rect x="1" y="1" width="358" height="294" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">El peso máximo de despegue del día</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">Cada límite permite un peso; manda el menor.</text>
  <text x="18" y="72" font-size="10.5" font-weight="600" fill="#33424D">Estructural (MTOW)</text>
  <rect x="150" y="60" width="143" height="16" rx="4" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.3"/>
  <text x="298" y="72" font-size="10.5" font-weight="500" fill="#33424D">77,0 t</text>
  <text x="18" y="100" font-size="10.5" font-weight="600" fill="#33424D">Pista (TOD, TOR, ASD)</text>
  <rect x="150" y="88" width="127.4" height="16" rx="4" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.3"/>
  <text x="282.4" y="100" font-size="10.5" font-weight="500" fill="#33424D">75,8 t</text>
  <text x="18" y="128" font-size="10.5" font-weight="800" fill="#C77700">Ascenso (2.º segmento)</text>
  <rect x="150" y="116" width="84.5" height="16" rx="4" fill="#FCEBD3" stroke="#C77700" stroke-width="1.3"/>
  <text x="239.5" y="128" font-size="10.5" font-weight="800" fill="#C77700">72,5 t</text>
  <text x="18" y="156" font-size="10.5" font-weight="600" fill="#33424D">Obstáculos</text>
  <rect x="150" y="144" width="105.3" height="16" rx="4" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.3"/>
  <text x="260.3" y="156" font-size="10.5" font-weight="500" fill="#33424D">74,1 t</text>
  <text x="18" y="184" font-size="10.5" font-weight="600" fill="#33424D">Neumáticos (195 kt GS)</text>
  <rect x="150" y="172" width="135.2" height="16" rx="4" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.3"/>
  <text x="290.2" y="184" font-size="10.5" font-weight="500" fill="#33424D">76,4 t</text>
  <text x="18" y="212" font-size="10.5" font-weight="600" fill="#33424D">Frenos (energía)</text>
  <rect x="150" y="200" width="120.9" height="16" rx="4" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.3"/>
  <text x="275.9" y="212" font-size="10.5" font-weight="500" fill="#33424D">75,3 t</text>
  <line x1="234.5" y1="52" x2="234.5" y2="232" stroke="#C77700" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="234.5" y="248" text-anchor="middle" font-size="11" font-weight="800" fill="#C77700">máximo del día: 72,5 t</text>
  <text x="18" y="272" font-size="10" fill="#5B6B78">Números de ejemplo. El EFB optimiza flaps, empuje y</text>
  <text x="18" y="286" font-size="10" fill="#5B6B78">velocidades, y eso mueve varios límites a la vez.</text>
</svg>
