  <title id="t">La curva de resistencia</title>
  <desc id="d">Resistencia según la velocidad: la inducida baja al acelerar, la parásita sube y la total forma una U. En su punto más bajo está L/D max, la máxima fineza, que en configuración limpia es el green dot.</desc>
