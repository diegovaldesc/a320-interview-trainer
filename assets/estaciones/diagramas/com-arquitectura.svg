<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 316" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Quién hace qué</title>
  <desc id="d">Esquema de las comunicaciones: el RMP marca la frecuencia; el ACP elige por dónde se habla y qué se escucha; la AMU conecta los paneles con las radios VHF y HF, el SELCAL y el flight interphone, y con el CIDS, que maneja el cabin interphone, el service interphone y el PA. Hasta el MSN 11293, RMP y ACP separados; desde el MSN 11482, el RMP también maneja el audio.</desc>
  <rect x="1" y="1" width="358" height="314" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Quién hace qué</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">Comunicaciones, esquema simplificado.</text>
  <defs><marker id="a33424D" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#33424D"/></marker></defs>
  <rect x="16" y="60" width="150" height="44" rx="7" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.4"/>
  <text x="91" y="79.5" text-anchor="middle" font-size="11" font-weight="800" fill="#0E5E6F">RMP</text>
  <text x="91" y="92.5" text-anchor="middle" font-size="10" fill="#33424D">marca la frecuencia</text>
  <rect x="194" y="60" width="150" height="44" rx="7" fill="#FCEBD3" stroke="#C77700" stroke-width="1.4"/>
  <text x="269" y="79.5" text-anchor="middle" font-size="11" font-weight="800" fill="#8A5300">ACP</text>
  <text x="269" y="92.5" text-anchor="middle" font-size="10" fill="#33424D">por dónde hablo y qué oigo</text>
  <rect x="105" y="138" width="150" height="40" rx="7" fill="#FFFFFF" stroke="#33424D" stroke-width="1.4"/>
  <text x="180" y="155.5" text-anchor="middle" font-size="11" font-weight="800" fill="#1E2A33">AMU</text>
  <text x="180" y="168.5" text-anchor="middle" font-size="10" fill="#33424D">conecta todo (aviónica)</text>
  <line x1="91" y1="104" x2="150" y2="134" stroke="#33424D" stroke-width="1.4" marker-end="url(#a33424D)"/>
  <line x1="269" y1="104" x2="210" y2="134" stroke="#33424D" stroke-width="1.4" marker-end="url(#a33424D)"/>
  <rect x="16" y="212" width="104" height="46" rx="7" fill="#F3F5F7" stroke="#8C99A3" stroke-width="1.4"/>
  <text x="68" y="232.5" text-anchor="middle" font-size="11" font-weight="800" fill="#1E2A33">VHF y HF</text>
  <text x="68" y="245.5" text-anchor="middle" font-size="10" fill="#33424D">radios</text>
  <rect x="128" y="212" width="104" height="46" rx="7" fill="#F3F5F7" stroke="#8C99A3" stroke-width="1.4"/>
  <text x="180" y="232.5" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1E2A33">SELCAL</text>
  <text x="180" y="245.5" text-anchor="middle" font-size="10" fill="#33424D">flight interphone</text>
  <rect x="240" y="212" width="104" height="46" rx="7" fill="#F3F5F7" stroke="#8C99A3" stroke-width="1.4"/>
  <text x="292" y="232.5" text-anchor="middle" font-size="11" font-weight="800" fill="#1E2A33">CIDS</text>
  <text x="292" y="245.5" text-anchor="middle" font-size="10" fill="#33424D">cabina, service, PA</text>
  <line x1="150" y1="178" x2="68" y2="208" stroke="#33424D" stroke-width="1.4" marker-end="url(#a33424D)"/>
  <line x1="180" y1="178" x2="180" y2="208" stroke="#33424D" stroke-width="1.4" marker-end="url(#a33424D)"/>
  <line x1="210" y1="178" x2="292" y2="208" stroke="#33424D" stroke-width="1.4" marker-end="url(#a33424D)"/>
  <text x="16" y="286" font-size="10.5" fill="#33424D">Hasta el MSN 11293: RMP y ACP separados.</text>
  <text x="16" y="302" font-size="10.5" font-weight="700" fill="#0E5E6F">Desde el MSN 11482: el RMP también maneja el audio.</text>
</svg>
