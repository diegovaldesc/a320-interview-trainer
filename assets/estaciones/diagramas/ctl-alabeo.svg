  <text x="205" y="196" text-anchor="middle" font-size="10.5" fill="#33424D">SEC 1</text>
  <rect x="232" y="140" width="42" height="40" rx="5" fill="#E9F5EE" stroke="#2E9D5B" stroke-width="1.6"/>
  <text x="253" y="157" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1E2A33">5</text>
  <text x="253" y="173" text-anchor="middle" font-size="11" font-weight="800" fill="#2E9D5B">G</text>
  <text x="253" y="196" text-anchor="middle" font-size="10.5" fill="#33424D">SEC 2</text>
