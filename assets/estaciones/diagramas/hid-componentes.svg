<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Reservorio, acumulador y priority valve</title>
  <desc id="d">El reservorio está presurizado con aire de bleed para que la bomba no cavite. La bomba genera la presión del sistema. El acumulador absorbe picos de demanda. Si la presión baja, la priority valve corta a los grandes consumidores para proteger los flight controls.</desc>
  <defs>
    <marker id="fa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5B6B78"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="358" height="298" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>

  <!-- aire al reservorio -->
  <text x="68" y="186" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5B6B78">aire HP bleed</text>
  <text x="68" y="200" text-anchor="middle" font-size="10.5" fill="#5B6B78">ENG 1 o crossbleed</text>
  <line x1="68" y1="206" x2="68" y2="224" stroke="#5B6B78" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#fa)"/>

  <!-- reservorio y bomba -->
  <rect x="20" y="228" width="96" height="40" rx="8" fill="#EAF1F6" stroke="#3D6B8C" stroke-width="2"/>
  <text x="68" y="245" text-anchor="middle" font-size="12" font-weight="700" fill="#1E2A33">Reservorio</text>
  <text x="68" y="259" text-anchor="middle" font-size="10" fill="#33424D">poca presión de aire</text>
  <line x1="116" y1="248" x2="146" y2="248" stroke="#3D6B8C" stroke-width="5"/>
  <rect x="146" y="228" width="90" height="40" rx="9" fill="#FFFFFF" stroke="#3D6B8C" stroke-width="2"/>
  <text x="191" y="245" text-anchor="middle" font-size="12" font-weight="700" fill="#1E2A33">Bomba</text>
  <text x="191" y="259" text-anchor="middle" font-size="10" fill="#33424D">genera 3000 PSI</text>

  <!-- línea principal -->
  <line x1="191" y1="228" x2="191" y2="56" stroke="#3D6B8C" stroke-width="5"/>
  <line x1="191" y1="56" x2="246" y2="56" stroke="#3D6B8C" stroke-width="5"/>
  <line x1="191" y1="116" x2="246" y2="116" stroke="#3D6B8C" stroke-width="5"/>

  <!-- acumulador -->
  <line x1="191" y1="176" x2="150" y2="176" stroke="#3D6B8C" stroke-width="4"/>
  <circle cx="132" cy="176" r="18" fill="#EAF1F6" stroke="#3D6B8C" stroke-width="2"/>
  <line x1="116" y1="176" x2="148" y2="176" stroke="#3D6B8C" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="132" y="136" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1E2A33">Acumulador</text>
  <text x="132" y="151" text-anchor="middle" font-size="10.5" fill="#33424D">absorbe picos</text>

  <!-- flight controls -->
  <rect x="246" y="36" width="104" height="40" rx="9" fill="#FFFFFF" stroke="#1E2A33" stroke-width="2"/>
  <text x="298" y="53" text-anchor="middle" font-size="12" font-weight="700" fill="#1E2A33">Flight controls</text>
  <text x="298" y="67" text-anchor="middle" font-size="10" fill="#33424D">siempre protegidos</text>

  <!-- priority valve y gran consumo -->
  <path d="M201 104 L201 128 L219 116 Z M237 104 L237 128 L219 116 Z" fill="#FFFFFF" stroke="#C0392B" stroke-width="2" stroke-linejoin="round"/>
  <rect x="246" y="96" width="104" height="40" rx="9" fill="#F7F9FA" stroke="#8A99A6" stroke-width="2"/>
  <text x="298" y="113" text-anchor="middle" font-size="12" font-weight="700" fill="#1E2A33">Gran consumo</text>
  <text x="298" y="127" text-anchor="middle" font-size="10" fill="#33424D">tren, flaps y slats</text>
  <text x="270" y="156" text-anchor="middle" font-size="11.5" font-weight="700" fill="#A93226">Priority valve</text>
  <text x="270" y="171" text-anchor="middle" font-size="10.5" fill="#A93226">si baja la presión, corta</text>
  <text x="270" y="185" text-anchor="middle" font-size="10.5" fill="#A93226">a los grandes consumidores</text>
</svg>
