  <line x1="110" y1="279" x2="120" y2="279" stroke="#1E2A33" stroke-width="1.2" marker-end="url(#a1E2A33)"/>
  <rect x="250" y="250" width="92" height="58" rx="8" fill="#FFFFFF" stroke="#C9D3DB" stroke-width="1.4"/>
  <text x="296" y="266" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1E2A33">FAC 1 (FAC 2)</text>
  <text x="296" y="280" text-anchor="middle" font-size="9.5" fill="#5B6B78">yaw damper</text>
  <text x="296" y="292" text-anchor="middle" font-size="9.5" fill="#5B6B78">rudder trim</text>
  <text x="296" y="304" text-anchor="middle" font-size="9.5" fill="#5B6B78">travel limit</text>
  <line x1="250" y1="279" x2="240" y2="279" stroke="#1E2A33" stroke-width="1.2" marker-end="url(#a1E2A33)"/>
  <rect x="18" y="322" width="13" height="13" rx="3" fill="#E9F5EE" stroke="#2E9D5B" stroke-width="1.5"/>
  <text x="24.5" y="332.3" text-anchor="middle" font-size="10" font-weight="700" fill="#2E9D5B">G</text>
  <text x="36" y="332" font-size="10" fill="#1E2A33">Green</text>
  <rect x="80" y="322" width="13" height="13" rx="3" fill="#EAF1FC" stroke="#2F6FD6" stroke-width="1.5"/>
