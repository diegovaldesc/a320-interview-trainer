<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 288" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Radio Management Panel</title>
  <desc id="d">Un RMP: ventanas ACTIVE y STBY con la tecla de transferencia entre las dos; teclas de radio VHF 1, VHF 2, VHF 3, HF 1 y HF 2 con luz verde en la elegida; botones NAV y AM; la luz SEL ámbar; y las perillas concéntricas: la exterior para los enteros y la interior para los decimales.</desc>
  <rect x="1" y="1" width="358" height="286" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Radio Management Panel</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">Sus partes.</text>
  <rect x="16" y="56" width="328" height="132" rx="8" fill="#3B4A55" stroke="#2A353D" stroke-width="1.4"/>
  <rect x="28" y="66" width="104" height="30" rx="3" fill="#000" stroke="#9AA6AF" stroke-width="1.4"/>
  <text x="80" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#3DDC84">118.700</text>
  <rect x="228" y="66" width="104" height="30" rx="3" fill="#000" stroke="#9AA6AF" stroke-width="1.4"/>
  <text x="280" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#3DDC84">121.500</text>
  <text x="80" y="108" text-anchor="middle" font-size="10" fill="#FFFFFF">ACTIVE</text>
  <text x="280" y="108" text-anchor="middle" font-size="10" fill="#FFFFFF">STBY</text>
  <rect x="150" y="68" width="60" height="26" rx="3" fill="#1E272E" stroke="#9AA6AF" stroke-width="1.4"/>
  <text x="180" y="84.5" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">⇄</text>
  <text x="180" y="108" text-anchor="middle" font-size="10" fill="#FFFFFF">transferencia</text>
  <rect x="28" y="120" width="42" height="22" rx="3" fill="#1E272E" stroke="#9AA6AF" stroke-width="1.4"/>
  <text x="49" y="134.5" text-anchor="middle" font-size="10" font-weight="700" fill="#3DDC84">VHF 1</text>
  <rect x="74" y="120" width="42" height="22" rx="3" fill="#1E272E" stroke="#9AA6AF" stroke-width="1.4"/>
  <text x="95" y="134.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">VHF 2</text>
  <rect x="120" y="120" width="42" height="22" rx="3" fill="#1E272E" stroke="#9AA6AF" stroke-width="1.4"/>
  <text x="141" y="134.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">VHF 3</text>
  <rect x="166" y="120" width="42" height="22" rx="3" fill="#1E272E" stroke="#9AA6AF" stroke-width="1.4"/>
  <text x="187" y="134.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">HF 1</text>
  <rect x="212" y="120" width="42" height="22" rx="3" fill="#1E272E" stroke="#9AA6AF" stroke-width="1.4"/>
  <text x="233" y="134.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">HF 2</text>
  <rect x="28" y="152" width="42" height="22" rx="3" fill="#1E272E" stroke="#9AA6AF" stroke-width="1.4"/>
  <text x="49" y="166.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">NAV</text>
  <rect x="74" y="152" width="42" height="22" rx="3" fill="#1E272E" stroke="#9AA6AF" stroke-width="1.4"/>
  <text x="95" y="166.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">AM</text>
  <text x="150" y="167" text-anchor="middle" font-size="10.5" font-weight="800" fill="#F5A623">SEL</text>
  <circle cx="290" cy="150" r="24" fill="#C9D3DB" stroke="#9AA6AF" stroke-width="1.5"/>
  <circle cx="290" cy="150" r="12" fill="#8C99A3" stroke="#9AA6AF" stroke-width="1.5"/>
  <text x="16" y="210" font-size="10.5" fill="#33424D">Tecla de radio con luz verde: qué radio controla este RMP.</text>
  <text x="16" y="226" font-size="10.5" fill="#33424D">Perillas: exterior = enteros; interior = decimales.</text>
  <text x="16" y="242" font-size="10.5" fill="#33424D">Transferencia: intercambia ACTIVE y STBY.</text>
  <text x="16" y="258" font-size="10.5" fill="#33424D">SEL ámbar: tu radio la sintoniza otro RMP.</text>
  <text x="16" y="274" font-size="10.5" fill="#33424D">AM: solo con un HF. NAV (con tapa): respaldo de radioayudas.</text>
</svg>
