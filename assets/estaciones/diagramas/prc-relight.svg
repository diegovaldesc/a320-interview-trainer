<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 336" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Sin motores: relight o aterrizaje</title>
  <desc id="d">Si hay tiempo para un relight, sin daño y con combustible: relight a molinete a la optimum relight speed, los dos motores a la vez, con 30 s en OFF entre intentos. Si no enciende, bajo FL 200 y con APU bleed: relight con starter a green dot, un motor a la vez. Si no se puede intentar: green dot, para tener más tiempo y distancia, y el APU bajo FL 250. Si ningún motor enciende: aterrizaje forzoso con el tren abajo por gravedad, o ditching con el tren arriba y el DITCHING pb en ON.</desc>
  <rect x="1" y="1" width="358" height="334" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <defs><marker id="a33424D" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#33424D"/></marker></defs>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Sin motores: relight o aterrizaje</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">El QRH ALL ENG FAIL cubre todo, hasta el contacto</text>
  <rect x="18" y="56" width="324" height="36" rx="7" fill="#F3F5F7" stroke="#C9D3DB" stroke-width="1.4"/>
  <text x="180" y="78" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1E2A33">¿Hay tiempo para un relight, sin daño y con combustible?</text>
  <line x1="100" y1="92" x2="100" y2="110" stroke="#33424D" stroke-width="1.4" marker-end="url(#a33424D)"/>
  <text x="106" y="104" font-size="10" fill="#5B6B78">sí</text>
  <line x1="270" y1="92" x2="270" y2="110" stroke="#33424D" stroke-width="1.4" marker-end="url(#a33424D)"/>
  <text x="276" y="104" font-size="10" fill="#5B6B78">no</text>
  <rect x="18" y="112" width="164" height="62" rx="7" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.4"/>
  <text x="100" y="127.5" text-anchor="middle" font-size="10.5" font-weight="800" fill="#0E5E6F">Relight a molinete</text>
  <text x="100" y="140.5" text-anchor="middle" font-size="10" fill="#33424D">optimum relight speed</text>
  <text x="100" y="152.5" text-anchor="middle" font-size="10" fill="#33424D">los dos motores a la vez</text>
  <text x="100" y="164.5" text-anchor="middle" font-size="10" fill="#33424D">30 s en OFF entre intentos</text>
  <rect x="196" y="112" width="146" height="62" rx="7" fill="#FFFFFF" stroke="#C9D3DB" stroke-width="1.4"/>
  <text x="269" y="134" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1E2A33">Green dot</text>
  <text x="269" y="147" text-anchor="middle" font-size="10" fill="#33424D">más tiempo y distancia</text>
  <text x="269" y="159" text-anchor="middle" font-size="10" fill="#33424D">APU bajo FL 250</text>
  <line x1="100" y1="174" x2="100" y2="192" stroke="#33424D" stroke-width="1.4" marker-end="url(#a33424D)"/>
  <text x="106" y="186" font-size="10" fill="#5B6B78">bajo FL 200, con APU bleed</text>
  <rect x="18" y="194" width="164" height="50" rx="7" fill="#FFFFFF" stroke="#C9D3DB" stroke-width="1.4"/>
  <text x="100" y="210" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1E2A33">Relight con starter</text>
  <text x="100" y="223" text-anchor="middle" font-size="10" fill="#33424D">a green dot</text>
  <text x="100" y="235" text-anchor="middle" font-size="10" fill="#33424D">un motor a la vez</text>
  <line x1="100" y1="244" x2="100" y2="258" stroke="#33424D" stroke-width="1.4"/>
  <line x1="269" y1="174" x2="269" y2="258" stroke="#33424D" stroke-width="1.4"/>
  <line x1="100" y1="258" x2="269" y2="258" stroke="#33424D" stroke-width="1.4"/>
  <line x1="98" y1="258" x2="98" y2="274" stroke="#33424D" stroke-width="1.4" marker-end="url(#a33424D)"/>
  <line x1="266" y1="258" x2="266" y2="274" stroke="#33424D" stroke-width="1.4" marker-end="url(#a33424D)"/>
  <rect x="122" y="250" width="116" height="15" rx="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.4"/>
  <text x="180" y="261" text-anchor="middle" font-size="10" fill="#5B6B78">ningún motor enciende</text>
  <rect x="18" y="276" width="160" height="46" rx="7" fill="#FCEBD3" stroke="#C77700" stroke-width="1.4"/>
  <text x="98" y="296.5" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1E2A33">Aterrizaje forzoso</text>
  <text x="98" y="309.5" text-anchor="middle" font-size="10" fill="#33424D">tren abajo, por gravedad</text>
  <rect x="190" y="276" width="152" height="46" rx="7" fill="#FCEBD3" stroke="#C77700" stroke-width="1.4"/>
  <text x="266" y="296.5" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1E2A33">Ditching</text>
  <text x="266" y="309.5" text-anchor="middle" font-size="10" fill="#33424D">tren arriba, DITCHING pb ON</text>
</svg>
