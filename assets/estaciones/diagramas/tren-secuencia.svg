<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 236" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Subir o bajar el tren</title>
  <desc id="d">La palanca va de UP a DOWN, o al revés, en un solo movimiento, sin detenerse. El tren se mueve en tres pasos: se abren las doors, cada pata va a la posición elegida y se traba, y se cierran las doors. Los LGCIU ordenan la secuencia y Green mueve el tren; en tierra, la palanca queda trabada en DOWN.</desc>
  <rect x="1" y="1" width="358" height="234" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <defs><marker id="a33424D" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#33424D"/></marker><marker id="b33424D" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#33424D"/></marker></defs>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Subir o bajar el tren</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">La palanca: un movimiento. El tren: tres pasos.</text>
  <rect x="26" y="58" width="14" height="52" rx="7" fill="#F3F5F7" stroke="#8C99A3" stroke-width="1.2"/>
  <circle cx="33" cy="66" r="7" fill="#FFFFFF" stroke="#33424D" stroke-width="1.6"/>
  <circle cx="33" cy="102" r="7" fill="none" stroke="#8C99A3" stroke-width="1"/>
  <line x1="33" y1="75" x2="33" y2="92" stroke="#33424D" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#a33424D)"/>
  <text x="48" y="70" font-size="10" font-weight="800" fill="#33424D">UP</text>
  <text x="48" y="106" font-size="10" font-weight="800" fill="#33424D">DOWN</text>
  <text x="96" y="78" font-size="11" font-weight="800" fill="#1E2A33">Palanca: de una posición a la otra</text>
  <text x="96" y="93" font-size="10.5" fill="#33424D">en un solo movimiento, sin detenerse.</text>
  <rect x="18" y="128" width="100" height="54" rx="8" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.4"/>
  <circle cx="33" cy="144" r="8.5" fill="#0E5E6F" stroke="none" stroke-width="1"/>
  <text x="33" y="147.8" text-anchor="middle" font-size="10.5" font-weight="800" fill="#FFFFFF">1</text>
  <text x="76" y="148" text-anchor="middle" font-size="11" font-weight="800" fill="#1E2A33">Se abren</text>
  <text x="68" y="168" text-anchor="middle" font-size="10.5" fill="#33424D">las doors</text>
  <line x1="118" y1="155" x2="128" y2="155" stroke="#33424D" stroke-width="1.2" marker-end="url(#a33424D)"/>
  <rect x="130" y="128" width="100" height="54" rx="8" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.4"/>
  <circle cx="145" cy="144" r="8.5" fill="#0E5E6F" stroke="none" stroke-width="1"/>
  <text x="145" y="147.8" text-anchor="middle" font-size="10.5" font-weight="800" fill="#FFFFFF">2</text>
  <text x="188" y="148" text-anchor="middle" font-size="11" font-weight="800" fill="#1E2A33">Cada pata va</text>
  <text x="180" y="168" text-anchor="middle" font-size="10.5" fill="#33424D">y se traba</text>
  <line x1="230" y1="155" x2="240" y2="155" stroke="#33424D" stroke-width="1.2" marker-end="url(#a33424D)"/>
  <rect x="242" y="128" width="100" height="54" rx="8" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.4"/>
  <circle cx="257" cy="144" r="8.5" fill="#0E5E6F" stroke="none" stroke-width="1"/>
  <text x="257" y="147.8" text-anchor="middle" font-size="10.5" font-weight="800" fill="#FFFFFF">3</text>
  <text x="300" y="148" text-anchor="middle" font-size="11" font-weight="800" fill="#1E2A33">Se cierran</text>
  <text x="292" y="168" text-anchor="middle" font-size="10.5" fill="#33424D">las doors</text>
  <text x="18" y="206" font-size="10.5" fill="#33424D">Los LGCIU ordenan la secuencia y Green mueve el tren.</text>
  <text x="18" y="222" font-size="10.5" fill="#33424D">En tierra, la palanca queda trabada en DOWN.</text>
</svg>
