  <text x="135" y="286" font-size="10" fill="#1E2A33">DC BAT BUS se</text>
  <text x="135" y="300" font-size="10" fill="#1E2A33">conecta a baterías</text>
  <rect x="240" y="252" width="106" height="66" rx="8" fill="#FCEBD3" stroke="#D98A00" stroke-width="1.2"/>
  <text x="248" y="269" font-size="10.5" font-weight="700" fill="#8A5300">Bajo 50 kt</text>
  <text x="248" y="286" font-size="10" fill="#1E2A33">AC ESS cortado:</text>
  <text x="248" y="300" font-size="10" fill="#1E2A33">sin pantallas</text>
