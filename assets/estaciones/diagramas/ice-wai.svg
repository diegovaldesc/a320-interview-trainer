<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 334" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Wing anti-ice</title>
  <desc id="d">Esquema del wing anti-ice. El aire caliente de los bleed de los motores 1 y 2, unidos por el crossbleed, sube por una válvula en cada ala hasta los slats 3, 4 y 5. Un solo pushbutton WING manda las dos válvulas. En tierra, test de 30 segundos. Con una fuga se cierra la válvula de ese lado; sin energía eléctrica se cierran las dos.</desc>
  <rect x="1" y="1" width="358" height="332" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Wing anti-ice</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">Esquema simplificado.</text>
  <defs><marker id="aC77700" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#C77700"/></marker></defs>
  <rect x="16" y="60" width="120" height="34" rx="7" fill="#FCEBD3" stroke="#C77700" stroke-width="1.4"/>
