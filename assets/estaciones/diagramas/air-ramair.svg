<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Emergency ram air</title>
  <desc id="d">El aire exterior entra por el RAM AIR a la mixing unit. Con ΔP menor que 1 PSI entra aire y la outflow valve abre cerca del 50 % en automático. Con ΔP de 1 PSI o más, la check valve no abre, no entra aire y la outflow valve sigue con su control normal. En manual, la outflow valve no abre sola.</desc>
  <rect x="1" y="1" width="358" height="268" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <defs><marker id="a2F6FD6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2F6FD6"/></marker></defs>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Emergency ram air</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">Para humo o si fallan los dos packs.</text>
  <rect x="20" y="64" width="90" height="30" rx="7" fill="#F3F5F7" stroke="#8C99A3" stroke-width="1.4"/>
  <text x="65" y="83" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1E2A33">Aire exterior</text>
  <line x1="110" y1="79" x2="200" y2="79" stroke="#2F6FD6" stroke-width="2.2" marker-end="url(#a2F6FD6)"/>
  <text x="155" y="70" text-anchor="middle" font-size="10" font-weight="700" fill="#33424D">RAM AIR</text>
  <rect x="204" y="64" width="136" height="30" rx="7" fill="#EAF1FC" stroke="#2F6FD6" stroke-width="1.4"/>
  <text x="272" y="83" text-anchor="middle" font-size="10.5" font-weight="800" fill="#2F6FD6">Mixing unit</text>
  <rect x="18" y="118" width="156" height="112" rx="6" fill="#E5F4EA" stroke="#2E9D5B" stroke-width="1.4"/>
  <rect x="186" y="118" width="156" height="112" rx="6" fill="#F8E1DE" stroke="#C0392B" stroke-width="1.4"/>
  <text x="96" y="140" text-anchor="middle" font-size="11" font-weight="800" fill="#2E9D5B">ΔP menor que 1 PSI</text>
  <text x="264" y="140" text-anchor="middle" font-size="11" font-weight="800" fill="#C0392B">ΔP de 1 PSI o más</text>
  <text x="30" y="164" font-size="10.5" fill="#1E2A33">Entra aire.</text>
  <text x="30" y="184" font-size="10.5" fill="#1E2A33">Outflow valve: abre</text>
  <text x="30" y="198" font-size="10.5" fill="#1E2A33">cerca del 50 % en</text>
  <text x="30" y="212" font-size="10.5" fill="#1E2A33">automático.</text>
  <text x="198" y="164" font-size="10.5" fill="#1E2A33">No entra aire: la</text>
  <text x="198" y="178" font-size="10.5" fill="#1E2A33">check valve no abre.</text>
  <text x="198" y="198" font-size="10.5" fill="#1E2A33">Outflow valve: control</text>
  <text x="198" y="212" font-size="10.5" fill="#1E2A33">normal.</text>
  <text x="180" y="254" text-anchor="middle" font-size="10" fill="#5B6B78">En manual, la outflow valve no abre sola.</text>
</svg>
