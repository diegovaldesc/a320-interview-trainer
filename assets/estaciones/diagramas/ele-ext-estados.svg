  <path d="M69 124 L96 124" fill="none" stroke="#A9B4BD" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="57.5" y="119.5" width="9" height="9" rx="2" fill="#FFFFFF" stroke="#A9B4BD" stroke-width="1.6"/>
  <text x="62" y="146" text-anchor="middle" font-size="10.5" font-weight="400" fill="#33424D">line contactor</text>
  <text x="62" y="159" text-anchor="middle" font-size="11" font-weight="700" fill="#5B6B78">abierto</text>
  <text x="62" y="172" text-anchor="middle" font-size="10.5" font-weight="400" fill="#33424D">no alimenta</text>
  <rect x="126" y="12" width="108" height="178" rx="10" fill="#F6F8FA" stroke="#DDE3E8"/>
  <circle cx="146" cy="30" r="9" fill="#33424D"/>
  <text x="146" y="34" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">2</text>
  <text x="188" y="34" text-anchor="middle" font-size="11" font-weight="700" fill="#33424D">Presionado</text>
  <text x="180" y="58" text-anchor="middle" font-size="10" font-weight="700" fill="#33424D">EXT PWR</text>
  <rect x="160" y="64" width="40" height="36" rx="4" fill="#2C363F"/>
  <line x1="164" y1="82" x2="196" y2="82" stroke="#46525C" stroke-width="1"/>
  <text x="180" y="77.5" text-anchor="middle" font-size="10" font-weight="700" fill="#8A949C">AVAIL</text>
  <text x="180" y="95" text-anchor="middle" font-size="10" font-weight="700" fill="#62B4FF">ON</text>
