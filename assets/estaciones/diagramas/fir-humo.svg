<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 262" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Detección de humo</title>
  <desc id="d">Aviónica: un detector en el ducto de extracción; con humo por más de 5 segundos, alerta AVIONICS SMOKE, Single Chime, MASTER CAUTION y luces SMOKE del GEN 1 LINE y FAULT de BLOWER y EXTRACT. Lavatorio: un detector en el ducto de extracción, señal a la SDCU o al CIDS y alerta en el cockpit y en la cabina de pasajeros; el wastebin tiene extintor automático.</desc>
  <rect x="1" y="1" width="358" height="260" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Detección de humo</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">Aviónica y lavatorios.</text>
  <rect x="16" y="58" width="328" height="92" rx="6" fill="#FFFFFF" stroke="#C9D3DB" stroke-width="1.4"/>
  <text x="28" y="78" font-size="11" font-weight="800" fill="#1E2A33">Aviónica</text>
  <text x="112" y="76" font-size="10.5" fill="#33424D">Un detector en el ducto de extracción.</text>
  <text x="112" y="91" font-size="10.5" fill="#33424D">Humo por más de 5 s: AVIONICS SMOKE,</text>
  <text x="112" y="106" font-size="10.5" fill="#33424D">Single Chime y MASTER CAUTION;</text>
  <text x="112" y="121" font-size="10.5" fill="#33424D">luces SMOKE (GEN 1 LINE) y FAULT.</text>
  <rect x="16" y="156" width="328" height="92" rx="6" fill="#FFFFFF" stroke="#C9D3DB" stroke-width="1.4"/>
  <text x="28" y="176" font-size="11" font-weight="800" fill="#1E2A33">Lavatorio</text>
  <text x="112" y="174" font-size="10.5" fill="#33424D">Un detector en el ducto de extracción.</text>
  <text x="112" y="189" font-size="10.5" fill="#33424D">SDCU o CIDS → alerta en el cockpit</text>
  <text x="112" y="204" font-size="10.5" fill="#33424D">y en la cabina de pasajeros.</text>
  <text x="112" y="219" font-size="10.5" fill="#33424D">Wastebin: extintor automático.</text>
</svg>
