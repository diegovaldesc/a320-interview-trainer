  <line x1="60" y1="115" x2="60" y2="158" stroke="#C0392B" stroke-width="1.6"/>
  <line x1="67" y1="108" x2="80" y2="108" stroke="#C0392B" stroke-width="1.6"/>
  <rect x="140" y="58" width="84" height="26" rx="7" fill="#F3F5F7" stroke="#8C99A3" stroke-width="1.4"/>
  <text x="182" y="75" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1E2A33">FWD CABIN</text>
  <line x1="182" y1="130" x2="182" y2="86" stroke="#2F6FD6" stroke-width="2.2" marker-end="url(#a2F6FD6)"/>
