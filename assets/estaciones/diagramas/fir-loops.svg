<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 298" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Detección de fuego del motor</title>
  <desc id="d">Un motor con dos loops de detección, A y B, en paralelo, que pasan por el pylon y la nacelle, el core y el fan, y llegan a la FDU. Hay fire warning si los dos loops detectan fuego, si uno detecta y el otro está fallado, si los dos se cortan con menos de 5 segundos de diferencia, o con un test. Con un loop fallado aparece una caution y el otro sigue detectando.</desc>
  <rect x="1" y="1" width="358" height="296" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Detección de fuego del motor</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">Esquema simplificado.</text>
  <rect x="20" y="64" width="190" height="96" rx="24" fill="#F3F5F7" stroke="#8C99A3" stroke-width="1.4"/>
  <text x="66" y="150" text-anchor="middle" font-size="10" fill="#33424D">Pylon/nacelle</text>
  <text x="124" y="150" text-anchor="middle" font-size="10" fill="#33424D">Core</text>
  <text x="172" y="150" text-anchor="middle" font-size="10" fill="#33424D">Fan</text>
  <polyline points="30,92 200,92" fill="none" stroke="#C0392B" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="30,116 200,116" fill="none" stroke="#C77700" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 3"/>
  <text x="36" y="86" font-size="10" font-weight="700" fill="#C0392B">Loop A</text>
  <text x="36" y="130" font-size="10" font-weight="700" fill="#C77700">Loop B</text>
  <line x1="200" y1="92" x2="236" y2="104" stroke="#C0392B" stroke-width="1.6"/>
  <line x1="200" y1="116" x2="236" y2="108" stroke="#C77700" stroke-width="1.6"/>
  <rect x="238" y="86" width="104" height="40" rx="7" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.4"/>
  <text x="290" y="103.5" text-anchor="middle" font-size="11" font-weight="800" fill="#0E5E6F">FDU</text>
  <text x="290" y="116.5" text-anchor="middle" font-size="10" fill="#33424D">procesa las señales</text>
  <text x="16" y="188" font-size="11" font-weight="800" fill="#1E2A33">Fire warning si:</text>
  <text x="28" y="206" font-size="10.5" fill="#1E2A33">• los dos loops detectan fuego,</text>
  <text x="28" y="222" font-size="10.5" fill="#1E2A33">• uno detecta y el otro está fallado,</text>
  <text x="28" y="238" font-size="10.5" fill="#1E2A33">• los dos se cortan con menos de 5 s (flame effect),</text>
  <text x="28" y="254" font-size="10.5" fill="#1E2A33">• o se hace un test.</text>
  <text x="16" y="284" font-size="10.5" font-weight="700" fill="#0E5E6F">Un loop fallado: caution; el otro sigue detectando.</text>
</svg>
