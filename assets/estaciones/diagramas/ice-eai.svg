<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Engine anti-ice</title>
  <desc id="d">Dos esquemas del engine anti-ice. A320 con motores IAE o CFM: aire del HP compressor, una válvula abierta o cerrada, y la entrada de aire del motor; sin aire, la válvula se cierra. A320neo: aire del HP compressor, dos PRSOV que regulan en cascada, y la entrada de aire; con un ducto roto se cierran las dos.</desc>
  <rect x="1" y="1" width="358" height="298" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Engine anti-ice</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">Cada motor, su propia entrada de aire.</text>
  <defs><marker id="aC77700" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#C77700"/></marker></defs>
  <text x="16" y="70" font-size="11" font-weight="800" fill="#0E5E6F">A320 con motores IAE o CFM</text>
  <rect x="16" y="80" width="92" height="36" rx="7" fill="#F3F5F7" stroke="#8C99A3" stroke-width="1.4"/>
  <text x="62" y="95.5" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1E2A33">HP compressor</text>
  <text x="62" y="108.5" text-anchor="middle" font-size="10" fill="#33424D">del motor</text>
  <rect x="236" y="80" width="108" height="36" rx="7" fill="#FCEBD3" stroke="#C77700" stroke-width="1.4"/>
  <text x="290" y="95.5" text-anchor="middle" font-size="10.5" font-weight="800" fill="#C77700">Entrada de aire</text>
  <text x="290" y="108.5" text-anchor="middle" font-size="10" fill="#33424D">del motor</text>
  <line x1="108" y1="98" x2="232" y2="98" stroke="#C77700" stroke-width="3" marker-end="url(#aC77700)"/>
  <circle cx="170" cy="98" r="7" fill="#FFFFFF" stroke="#33424D" stroke-width="1.5"/>
  <line x1="163" y1="98" x2="177" y2="98" stroke="#33424D" stroke-width="1.8"/>
  <text x="170" y="122" text-anchor="middle" font-size="10" fill="#33424D">Válvula</text>
  <text x="16" y="140" font-size="10.5" fill="#33424D">Una válvula: abierta o cerrada.</text>
  <text x="16" y="154" font-size="10.5" fill="#33424D">Sin aire (motor detenido), se cierra.</text>
  <text x="16" y="190" font-size="11" font-weight="800" fill="#0E5E6F">A320neo</text>
  <rect x="16" y="200" width="92" height="36" rx="7" fill="#F3F5F7" stroke="#8C99A3" stroke-width="1.4"/>
  <text x="62" y="215.5" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1E2A33">HP compressor</text>
  <text x="62" y="228.5" text-anchor="middle" font-size="10" fill="#33424D">del motor</text>
  <rect x="236" y="200" width="108" height="36" rx="7" fill="#FCEBD3" stroke="#C77700" stroke-width="1.4"/>
  <text x="290" y="215.5" text-anchor="middle" font-size="10.5" font-weight="800" fill="#C77700">Entrada de aire</text>
  <text x="290" y="228.5" text-anchor="middle" font-size="10" fill="#33424D">del motor</text>
  <line x1="108" y1="218" x2="232" y2="218" stroke="#C77700" stroke-width="3" marker-end="url(#aC77700)"/>
  <circle cx="150" cy="218" r="7" fill="#FFFFFF" stroke="#33424D" stroke-width="1.5"/>
  <line x1="143" y1="218" x2="157" y2="218" stroke="#33424D" stroke-width="1.8"/>
  <text x="150" y="242" text-anchor="middle" font-size="10" fill="#33424D">PRSOV</text>
  <circle cx="192" cy="218" r="7" fill="#FFFFFF" stroke="#33424D" stroke-width="1.5"/>
  <line x1="185" y1="218" x2="199" y2="218" stroke="#33424D" stroke-width="1.8"/>
  <text x="192" y="242" text-anchor="middle" font-size="10" fill="#33424D">PRSOV</text>
  <text x="16" y="260" font-size="10.5" fill="#33424D">Dos PRSOV que regulan en cascada.</text>
  <text x="16" y="274" font-size="10.5" fill="#33424D">Ducto roto: se cierran las dos.</text>
</svg>
