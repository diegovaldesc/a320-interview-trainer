<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 254" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Antiskid</title>
  <desc id="d">Gráfico de velocidad en el tiempo: la velocidad de referencia del avión baja en línea recta, y la de la rueda va un poco debajo; cuando la rueda cae a 0,87 veces la referencia, el antiskid suelta el freno y la rueda vuelve a acelerar. La referencia sale de los ADIRU, y bajo 20 kt de ground speed el antiskid se desactiva.</desc>
  <rect x="1" y="1" width="358" height="252" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <defs><marker id="a8C99A3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8C99A3"/></marker><marker id="b8C99A3" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#8C99A3"/></marker></defs>
  <text x="18" y="26" font-size="12.5" font-weight="800" fill="#0E5E6F">Antiskid</text>
  <text x="18" y="42" font-size="10" fill="#5B6B78">Cada rueda, justo antes de patinar.</text>
  <line x1="40" y1="200" x2="340" y2="200" stroke="#8C99A3" stroke-width="1.2" marker-end="url(#a8C99A3)"/>
  <line x1="40" y1="200" x2="40" y2="60" stroke="#8C99A3" stroke-width="1.2" marker-end="url(#a8C99A3)"/>
  <text x="340" y="216" text-anchor="end" font-size="9.5" fill="#5B6B78">tiempo →</text>
  <text x="46" y="64" font-size="9.5" fill="#5B6B78">velocidad</text>
  <polyline points="40,70 336,140" fill="none" stroke="#0E5E6F" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="40,86.9 48,88.5 56,90.2 64,91.8 72,93.5 80,95.1 88,96.8 96,98.4 104,100.1 112,101.7 120,103.4 128,105 136,106.7 144,108.3 152,109.9 160,111.6 168,113.2 176,114.9 184,116.5 192,118.2 200,119.8 208,121.5 216,123.1 224,124.8 232,126.4 240,128 248,129.7 256,131.3 264,133 272,134.6 280,136.3 288,137.9 296,139.6 304,141.2 312,142.9 320,144.5 328,146.2 336,147.8" fill="none" stroke="#C0392B" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 3"/>
  <polyline points="40,71.9 44,74.5 48,77.1 52,79.6 56,82.1 60,84.5 64,87 68,89.4 72,91.8 76,94.2 80,91.9 84,89.3 88,86.6 92,84.1 96,86.5 100,88.9 104,91.2 108,93.5 112,95.9 116,98.1 120,100.4 124,102.7 128,104.9 132,103 136,100.6 140,98.4 144,96.2 148,98.4 152,100.7 156,102.9 160,105 164,107.2 168,109.3 172,111.4 176,113.5 180,115.6 184,114 188,112 192,110.1 196,108.3 200,110.4 204,112.5 208,114.5 212,116.5 216,118.5 220,120.5 224,122.5 228,124.4 232,126.3 236,125 240,123.4 244,121.9 248,120.4 252,122.3 256,124.3 260,126.2 264,128 268,129.9 272,131.7 276,133.5 280,135.3 284,137 288,136 292,134.8 296,133.6 300,132.5 304,134.3 308,136.1 312,137.8 316,139.5 320,141.2 324,142.9 328,144.5 332,146.1 336,147.7" fill="none" stroke="#1E2A33" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="262" y="113.5" text-anchor="middle" font-size="9.5" font-weight="800" fill="#0E5E6F" stroke="#FFFFFF" stroke-width="3" paint-order="stroke">avión (referencia)</text>
  <text x="262" y="149.6" text-anchor="middle" font-size="9.5" font-weight="800" fill="#C0392B" stroke="#FFFFFF" stroke-width="3" paint-order="stroke">0,87 × referencia</text>
  <text x="70" y="112" font-size="9.5" font-weight="800" fill="#1E2A33" stroke="#FFFFFF" stroke-width="3" paint-order="stroke">rueda</text>
  <text x="190" y="184" text-anchor="middle" font-size="9" fill="#33424D" stroke="#FFFFFF" stroke-width="3" paint-order="stroke">al llegar a 0,87 suelta el freno y la rueda vuelve a girar</text>
  <text x="18" y="226" font-size="9.2" fill="#33424D">La referencia sale de los ADIRU; si fallan los tres, de la rueda más rápida.</text>
  <text x="18" y="241" font-size="9.2" fill="#33424D">Bajo 20 kt de ground speed el antiskid se desactiva.</text>
</svg>
