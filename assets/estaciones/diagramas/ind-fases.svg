  <text x="188" y="261" font-size="10.5" fill="#33424D">7. 800 ft</text>
  <text x="188" y="276" font-size="10.5" fill="#33424D">8. Touchdown</text>
  <text x="188" y="291" font-size="10.5" fill="#33424D">9. 80 kt</text>
  <text x="188" y="306" font-size="10.5" fill="#33424D">10. 2º motor OFF</text>
  <text x="16" y="330" font-size="10.5" fill="#5B6B78">5 minutos después de la fase 10, vuelve a la 1.</text>
