  <text x="205.9" y="122.1" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1E2A33">67°</text>
  <text x="18.1" y="122.1" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1E2A33">67°</text>
