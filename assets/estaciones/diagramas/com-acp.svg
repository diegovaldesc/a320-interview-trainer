<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 296" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Audio Control Panel</title>
  <desc id="d">Un ACP: teclas de transmisión VHF 1, VHF 2, VHF 3, HF 1, HF 2, INT, CAB y PA; debajo, las perillas de recepción; abajo, el selector INT/RAD (RAD momentáneo, INT fijo), la tecla VOICE, que filtra la identificación de VOR y ADF, y la tecla RESET del SELCAL. El botón RADIO del sidestick manda sobre INT.</desc>
  <rect x="1" y="1" width="358" height="294" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Audio Control Panel</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">Por dónde hablo y qué escucho.</text>
  <rect x="16" y="56" width="328" height="140" rx="8" fill="#3B4A55" stroke="#2A353D" stroke-width="1.4"/>
  <rect x="24" y="66" width="36" height="22" rx="3" fill="#1E272E" stroke="#9AA6AF" stroke-width="1.4"/>
  <text x="42" y="80.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">VHF1</text>
  <rect x="64" y="66" width="36" height="22" rx="3" fill="#1E272E" stroke="#9AA6AF" stroke-width="1.4"/>
  <text x="82" y="80.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">VHF2</text>
  <rect x="104" y="66" width="36" height="22" rx="3" fill="#1E272E" stroke="#9AA6AF" stroke-width="1.4"/>
  <text x="122" y="80.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">VHF3</text>
  <rect x="144" y="66" width="36" height="22" rx="3" fill="#1E272E" stroke="#9AA6AF" stroke-width="1.4"/>
  <text x="162" y="80.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">HF1</text>
  <rect x="184" y="66" width="36" height="22" rx="3" fill="#1E272E" stroke="#9AA6AF" stroke-width="1.4"/>
  <text x="202" y="80.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">HF2</text>
  <rect x="224" y="66" width="36" height="22" rx="3" fill="#1E272E" stroke="#9AA6AF" stroke-width="1.4"/>
  <text x="242" y="80.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">INT</text>
  <rect x="264" y="66" width="36" height="22" rx="3" fill="#1E272E" stroke="#9AA6AF" stroke-width="1.4"/>
  <text x="282" y="80.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">CAB</text>
  <rect x="304" y="66" width="36" height="22" rx="3" fill="#1E272E" stroke="#9AA6AF" stroke-width="1.4"/>
  <text x="322" y="80.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">PA</text>
  <circle cx="42" cy="110" r="10" fill="#C9D3DB" stroke="#9AA6AF" stroke-width="1.3"/>
  <circle cx="82" cy="110" r="10" fill="#C9D3DB" stroke="#9AA6AF" stroke-width="1.3"/>
  <circle cx="122" cy="110" r="10" fill="#C9D3DB" stroke="#9AA6AF" stroke-width="1.3"/>
  <circle cx="162" cy="110" r="10" fill="#C9D3DB" stroke="#9AA6AF" stroke-width="1.3"/>
  <circle cx="202" cy="110" r="10" fill="#C9D3DB" stroke="#9AA6AF" stroke-width="1.3"/>
  <circle cx="242" cy="110" r="10" fill="#C9D3DB" stroke="#9AA6AF" stroke-width="1.3"/>
  <circle cx="282" cy="110" r="10" fill="#C9D3DB" stroke="#9AA6AF" stroke-width="1.3"/>
  <circle cx="322" cy="110" r="10" fill="#C9D3DB" stroke="#9AA6AF" stroke-width="1.3"/>
  <text x="180" y="136" text-anchor="middle" font-size="10" fill="#FFFFFF">perillas de recepción (afuera = escucho)</text>
  <rect x="28" y="150" width="90" height="36" rx="4" fill="#1E272E" stroke="#9AA6AF" stroke-width="1.4"/>
  <text x="73" y="165" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">INT  •  RAD</text>
  <text x="73" y="180" text-anchor="middle" font-size="10" fill="#C9D3DB">INT/RAD</text>
  <rect x="150" y="156" width="60" height="24" rx="3" fill="#1E272E" stroke="#9AA6AF" stroke-width="1.4"/>
  <text x="180" y="171.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">VOICE</text>
  <rect x="240" y="156" width="70" height="24" rx="3" fill="#1E272E" stroke="#9AA6AF" stroke-width="1.4"/>
  <text x="275" y="171.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">RESET</text>
  <text x="16" y="218" font-size="10.5" fill="#33424D">Tecla de transmisión: por dónde hablo (tres líneas verdes).</text>
  <text x="16" y="234" font-size="10.5" fill="#33424D">RAD (momentáneo): a la radio elegida. INT: queda puesto.</text>
  <text x="16" y="250" font-size="10.5" font-weight="700" fill="#0E5E6F">RADIO del sidestick manda sobre INT.</text>
  <text x="16" y="266" font-size="10.5" fill="#33424D">VOICE: filtra la identificación de VOR y ADF.</text>
  <text x="16" y="282" font-size="10.5" fill="#33424D">RESET: apaga el buzzer del SELCAL.</text>
</svg>
