<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 344" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Si el tren no se traba</title>
  <desc id="d">Diagrama de pasos ante L/G GEAR NOT DOWNLOCKED. Primero, mirar la página WHEEL: si hay un triángulo verde por pata, el tren está abajo y trabado, y no se aplica nada más. Si no, el procedimiento del ECAM pide un recycle (palanca UP, esperar el tren arriba y las doors cerradas, palanca DOWN), que cambia el LGCIU activo. Si sigue sin éxito después de 120 segundos, se aplica la L/G GRAVITY EXTENSION: si hay tiempo, hasta 4 recycles, esperando 60 segundos después de cada DOWN, y si no resulta, esperar 120 segundos; después, tirar la manivela y girarla en sentido horario hasta el tope, unas 3 vueltas, aunque se sienta resistencia; palanca DOWN y revisar las indicaciones. Las doors quedan abiertas y no se resetea en vuelo.</desc>
  <rect x="1" y="1" width="358" height="342" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <defs><marker id="a33424D" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#33424D"/></marker><marker id="b33424D" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#33424D"/></marker></defs>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Si el tren no se traba</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">L/G GEAR NOT DOWNLOCKED</text>
  <rect x="18" y="54" width="228" height="40" rx="7" fill="#E5F4EA" stroke="#2E9D5B" stroke-width="1.4"/>
  <text x="132" y="71.5" text-anchor="middle" font-size="11" font-weight="800" fill="#1E2A33">¿Un triángulo verde por pata?</text>
  <text x="132" y="84.5" text-anchor="middle" font-size="10" fill="#33424D">en la página WHEEL</text>
  <line x1="246" y1="74" x2="262" y2="74" stroke="#33424D" stroke-width="1.2" marker-end="url(#a33424D)"/>
  <text x="254" y="68" text-anchor="middle" font-size="10" font-weight="800" fill="#2E9D5B">sí</text>
  <rect x="264" y="54" width="78" height="40" rx="7" fill="#FFFFFF" stroke="#2E9D5B" stroke-width="1.4"/>
  <text x="303" y="65" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1E2A33">Está abajo</text>
  <text x="303" y="78" text-anchor="middle" font-size="10" fill="#33424D">y trabado:</text>
  <text x="303" y="90" text-anchor="middle" font-size="10" fill="#33424D">no aplicar</text>
  <line x1="132" y1="94" x2="132" y2="108" stroke="#33424D" stroke-width="1.2" marker-end="url(#a33424D)"/>
  <text x="140" y="105" font-size="10" font-weight="800" fill="#33424D">no</text>
  <rect x="18" y="110" width="228" height="54" rx="7" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.4"/>
  <text x="28" y="126" font-size="10" font-weight="800" fill="#0E5E6F">Procedimiento del ECAM</text>
  <text x="28" y="141" font-size="10.5" fill="#1E2A33">Recycle: UP, esperar arriba y</text>
  <text x="28" y="155" font-size="10.5" fill="#1E2A33">doors cerradas, DOWN.</text>
  <text x="264" y="132" font-size="10" fill="#33424D">cambia el</text>
  <text x="264" y="145" font-size="10" fill="#33424D">LGCIU activo</text>
  <line x1="132" y1="164" x2="132" y2="180" stroke="#33424D" stroke-width="1.2" marker-end="url(#a33424D)"/>
  <text x="140" y="176" font-size="10" font-weight="800" fill="#33424D">sin éxito tras 120 s</text>
  <rect x="18" y="182" width="228" height="128" rx="7" fill="#FCEBD3" stroke="#C77700" stroke-width="1.4"/>
  <text x="28" y="198" font-size="10" font-weight="800" fill="#C77700">L/G GRAVITY EXTENSION</text>
  <text x="28" y="214" font-size="10.5" fill="#1E2A33">Si hay tiempo: hasta 4 recycles,</text>
  <text x="28" y="228" font-size="10.5" fill="#1E2A33">60 s después de cada DOWN.</text>
  <text x="28" y="242" font-size="10.5" fill="#1E2A33">Si no resulta, esperar 120 s.</text>
  <line x1="24" y1="251" x2="240" y2="251" stroke="#C77700" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="28" y="267" font-size="10.5" font-weight="800" fill="#1E2A33">Manivela: tirar y girar en sentido</text>
  <text x="28" y="281" font-size="10.5" font-weight="800" fill="#1E2A33">horario hasta el tope (unas 3 vueltas).</text>
  <text x="28" y="298" font-size="10.5" fill="#1E2A33">Palanca DOWN y revisar indicaciones.</text>
  <text x="264" y="263" font-size="10" fill="#33424D">aunque se</text>
  <text x="264" y="276" font-size="10" fill="#33424D">sienta</text>
  <text x="264" y="289" font-size="10" fill="#33424D">resistencia</text>
  <text x="18" y="330" font-size="10.5" fill="#33424D">Después: las doors quedan abiertas y no se resetea el sistema.</text>
</svg>
