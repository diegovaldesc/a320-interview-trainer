<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 346" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Tren y frenos: quién hace qué</title>
  <desc id="d">Tren: la palanca manda a los dos LGCIU, uno por ciclo, que comandan con Green las patas y las doors; de respaldo, la manivela de gravedad. Frenos: el BSCU con Green para el frenado normal, el antiskid y el autobrake; el ABCU con Yellow para el alternate; el accumulator de respaldo con al menos 7 aplicaciones; el parking brake con Yellow o el accumulator; y el steering con Yellow, comandado por el BSCU.</desc>
  <rect x="1" y="1" width="358" height="344" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <defs><marker id="a33424D" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#33424D"/></marker><marker id="b33424D" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#33424D"/></marker></defs>
  <text x="18" y="26" font-size="12.5" font-weight="800" fill="#0E5E6F">Tren y frenos: quién hace qué</text>
  <text x="18" y="42" font-size="10" fill="#5B6B78">Comando eléctrico, fuerza hidráulica.</text>
  <text x="18" y="64" font-size="10.5" font-weight="800" fill="#0E5E6F">TREN</text>
  <rect x="18" y="72" width="72" height="34" rx="7" fill="#FFFFFF" stroke="#C9D3DB" stroke-width="1.4"/>
  <text x="54" y="87" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1E2A33">Palanca</text>
  <text x="54" y="99" text-anchor="middle" font-size="9" fill="#5B6B78">UP · DOWN</text>
  <rect x="110" y="72" width="104" height="34" rx="7" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.4"/>
  <text x="162" y="87" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1E2A33">LGCIU 1 · LGCIU 2</text>
  <text x="162" y="99" text-anchor="middle" font-size="9" fill="#5B6B78">uno por ciclo</text>
  <rect x="236" y="72" width="106" height="34" rx="7" fill="#FFFFFF" stroke="#C9D3DB" stroke-width="1.4"/>
  <text x="289" y="87" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1E2A33">Patas y doors</text>
  <text x="289" y="99" text-anchor="middle" font-size="9" fill="#5B6B78">  </text>
  <rect x="246" y="88" width="14" height="13" rx="3" fill="#E9F5EE" stroke="#2E9D5B" stroke-width="1.5"/>
  <text x="253" y="98.3" text-anchor="middle" font-size="10" font-weight="700" fill="#2E9D5B">G</text>
  <text x="266" y="98" font-size="9" fill="#33424D">Green</text>
  <line x1="90" y1="89" x2="106" y2="89" stroke="#33424D" stroke-width="1.2" marker-end="url(#a33424D)"/>
  <line x1="214" y1="89" x2="232" y2="89" stroke="#33424D" stroke-width="1.2" marker-end="url(#a33424D)"/>
  <rect x="110" y="116" width="104" height="30" rx="7" fill="#FFFFFF" stroke="#C9D3DB" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="162" y="129" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1E2A33">Manivela</text>
  <text x="162" y="141" text-anchor="middle" font-size="9" fill="#5B6B78">3 vueltas</text>
  <line x1="214" y1="131" x2="232" y2="116" stroke="#33424D" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a33424D)"/>
  <text x="289" y="136" text-anchor="middle" font-size="9" fill="#5B6B78">respaldo:</text>
  <text x="289" y="147" text-anchor="middle" font-size="9" font-weight="700" fill="#33424D">por gravedad</text>
  <line x1="18" y1="160" x2="342" y2="160" stroke="#E4EAEF" stroke-width="1"/>
  <text x="18" y="180" font-size="10.5" font-weight="800" fill="#0E5E6F">FRENOS Y STEERING</text>
  <rect x="18" y="184" width="96" height="54" rx="7" fill="#E9F5EE" stroke="#2E9D5B" stroke-width="1.4"/>
  <text x="66" y="209" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1E2A33">BSCU</text>
  <text x="66" y="221" text-anchor="middle" font-size="9" fill="#5B6B78">normal · antiskid</text>
  <text x="66" y="232" text-anchor="middle" font-size="9" fill="#5B6B78">autobrake</text>
  <rect x="18" y="246" width="96" height="32" rx="7" fill="#FDF3DC" stroke="#D99A00" stroke-width="1.4"/>
  <text x="66" y="260" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1E2A33">ABCU</text>
  <text x="66" y="272" text-anchor="middle" font-size="9" fill="#5B6B78">alternate</text>
  <rect x="246" y="196" width="96" height="40" rx="7" fill="#FFFFFF" stroke="#C9D3DB" stroke-width="1.4"/>
  <text x="294" y="214" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1E2A33">Frenos</text>
  <text x="294" y="226" text-anchor="middle" font-size="9" fill="#5B6B78">4 ruedas principales</text>
  <line x1="114" y1="206" x2="242" y2="210" stroke="#2E9D5B" stroke-width="1.6" marker-end="url(#a33424D)"/>
  <text x="176" y="202" text-anchor="middle" font-size="9" font-weight="700" fill="#2E9D5B">Green</text>
  <line x1="114" y1="260" x2="242" y2="226" stroke="#D99A00" stroke-width="1.6" marker-end="url(#a33424D)"/>
  <text x="170" y="238" text-anchor="middle" font-size="9" font-weight="700" fill="#D99A00">Yellow</text>
  <rect x="140" y="262" width="92" height="30" rx="7" fill="#FFFFFF" stroke="#D99A00" stroke-width="1.4"/>
  <text x="186" y="275" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1E2A33">Accumulator</text>
  <text x="186" y="287" text-anchor="middle" font-size="9" fill="#5B6B78">≥ 7 aplicaciones</text>
  <line x1="232" y1="270" x2="252" y2="238" stroke="#D99A00" stroke-width="1.4" marker-end="url(#a33424D)"/>
  <rect x="246" y="250" width="96" height="30" rx="7" fill="#FFFFFF" stroke="#D99A00" stroke-width="1.4"/>
  <text x="294" y="263" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1E2A33">Parking brake</text>
  <text x="294" y="275" text-anchor="middle" font-size="9" fill="#5B6B78">Yellow o accu</text>
  <rect x="246" y="290" width="96" height="30" rx="7" fill="#FFFFFF" stroke="#C9D3DB" stroke-width="1.4"/>
  <text x="294" y="303" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1E2A33">Steering</text>
  <text x="294" y="315" text-anchor="middle" font-size="9" fill="#5B6B78">  </text>
  <rect x="256" y="306" width="14" height="13" rx="3" fill="#FDF3DC" stroke="#D99A00" stroke-width="1.5"/>
  <text x="263" y="316.3" text-anchor="middle" font-size="10" font-weight="700" fill="#D99A00">Y</text>
  <text x="276" y="316" font-size="9" fill="#33424D">Yellow</text>
  <polyline points="30,238 30,305 242,305" fill="none" stroke="#33424D" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a33424D)"/>
  <text x="120" y="300" text-anchor="middle" font-size="9" fill="#5B6B78">el BSCU comanda el steering</text>
  <text x="18" y="336" font-size="9" fill="#5B6B78">En los A320 más antiguos, el steering usa Green.</text>
</svg>
