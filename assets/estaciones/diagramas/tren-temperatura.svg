<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 236" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Temperatura de los frenos</title>
  <desc id="d">Escala de temperatura: sobre 100 °C, arco verde en la rueda más caliente; 150 °C, máximo indicado para despegar con fans; 290 °C, se apaga el BRAKES HOT; 300 °C, aviso BRAKES HOT y máximo para despegar sin fans.</desc>
  <rect x="1" y="1" width="358" height="234" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="18" y="26" font-size="12.5" font-weight="800" fill="#0E5E6F">Temperatura de los frenos</text>
  <text x="18" y="42" font-size="10" fill="#5B6B78">Los umbrales de la página WHEEL y del despegue.</text>
  <rect x="24" y="111" width="89.1" height="18" rx="4" fill="#E5F4EA" stroke="#2E9D5B" stroke-width="1"/>
  <rect x="113.1" y="111" width="178.3" height="18" rx="0" fill="#FCEBD3" stroke="#C77700" stroke-width="1"/>
  <rect x="291.4" y="111" width="44.6" height="18" rx="4" fill="#F8E1DE" stroke="#C0392B" stroke-width="1"/>
  <line x1="24" y1="108" x2="24" y2="132" stroke="#1E2A33" stroke-width="1.4"/>
  <line x1="113.1" y1="108" x2="113.1" y2="132" stroke="#1E2A33" stroke-width="1.4"/>
  <line x1="157.7" y1="108" x2="157.7" y2="132" stroke="#1E2A33" stroke-width="1.4"/>
  <line x1="282.5" y1="108" x2="282.5" y2="132" stroke="#1E2A33" stroke-width="1.4"/>
  <line x1="291.4" y1="108" x2="291.4" y2="132" stroke="#1E2A33" stroke-width="1.4"/>
  <text x="24" y="146" text-anchor="middle" font-size="9" fill="#5B6B78">0</text>
  <line x1="113.1" y1="108" x2="113.1" y2="84" stroke="#5B6B78" stroke-width="0.9"/>
  <text x="113.1" y="66" text-anchor="middle" font-size="9.6" font-weight="800" fill="#2E9D5B">arco verde en la rueda</text>
  <text x="113.1" y="79" text-anchor="middle" font-size="9" fill="#33424D">más caliente</text>
  <line x1="291.4" y1="108" x2="291.4" y2="84" stroke="#5B6B78" stroke-width="0.9"/>
  <text x="295.4" y="66" text-anchor="end" font-size="9.6" font-weight="800" fill="#C0392B">BRAKES HOT</text>
  <text x="295.4" y="79" text-anchor="end" font-size="9" fill="#33424D">máx. despegue sin fans</text>
  <line x1="157.7" y1="132" x2="157.7" y2="156" stroke="#5B6B78" stroke-width="0.9"/>
  <text x="157.7" y="168" text-anchor="middle" font-size="9.6" font-weight="800" fill="#C77700">máx. despegue</text>
  <text x="157.7" y="181" text-anchor="middle" font-size="9" fill="#33424D">con fans (indicada)</text>
  <line x1="282.5" y1="132" x2="282.5" y2="156" stroke="#5B6B78" stroke-width="0.9"/>
  <text x="286.5" y="168" text-anchor="end" font-size="9.6" font-weight="800" fill="#33424D">290: se apaga</text>
  <text x="286.5" y="181" text-anchor="end" font-size="9" fill="#33424D">BRAKES HOT</text>
  <text x="113.1" y="124" text-anchor="middle" font-size="8.5" font-weight="800" fill="#1E2A33" stroke="#FFFFFF" stroke-width="3" paint-order="stroke">100</text>
  <text x="157.7" y="124" text-anchor="middle" font-size="8.5" font-weight="800" fill="#1E2A33" stroke="#FFFFFF" stroke-width="3" paint-order="stroke">150</text>
  <text x="291.4" y="124" text-anchor="middle" font-size="8.5" font-weight="800" fill="#1E2A33" stroke="#FFFFFF" stroke-width="3" paint-order="stroke">300</text>
  <text x="336" y="146" text-anchor="end" font-size="9" fill="#5B6B78">°C</text>
  <text x="18" y="208" font-size="9.3" fill="#33424D">Con fans la indicación es menor que la real: por eso 150 °C con fans.</text>
  <text x="18" y="222" font-size="9.3" fill="#33424D">En tierra con BRAKES HOT: chocks en vez de parking brake.</text>
</svg>
