<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 487" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Giro de 180° en la pista</title>
  <desc id="d">Pista de 30 m vista desde arriba, a escala aproximada, con un A320 en el momento clave: abierto 25° a la izquierda del eje y con el asiento del capitán, marcado en rojo, sobre el borde izquierdo. En amarillo, el camino de la rueda de nariz y del tren principal al girar a la derecha con todo el tiller: los dos quedan dentro de la pista. Pasos: 1, rodar por el lado derecho entre 5 y 8 kt; 2, abrir 25° a la izquierda; 3, con el capitán sobre el borde, todo el tiller a la derecha; 4, alinear con el eje y dejar el tiller en neutro. Prohibido el brake pivot.</desc>
