<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 298" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Altitudes del APU</title>
  <desc id="d">Altitudes del APU, no a escala: electricidad y arranque normal en todo el envelope; arranque con solo baterías hasta 25 000 ft; bleed con un pack hasta 22 500 ft (20 000 ft en algunos aviones); bleed para arrancar un motor hasta 20 000 ft; bleed con dos packs hasta 15 000 ft. Nunca bleed del APU para el wing anti-ice.</desc>
  <rect x="1" y="1" width="358" height="296" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Altitudes del APU</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">No a escala.</text>
  <rect x="16" y="58" width="328" height="32" rx="5" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.4"/>
  <text x="28" y="78" font-size="10.5" font-weight="700" fill="#1E2A33">Electricidad y arranque normal</text>
  <text x="332" y="78" text-anchor="end" font-size="10.5" font-weight="800" fill="#0E5E6F">todo el envelope</text>
  <rect x="16" y="96" width="328" height="32" rx="5" fill="#F3F5F7" stroke="#8C99A3" stroke-width="1.4"/>
  <text x="28" y="116" font-size="10.5" font-weight="700" fill="#1E2A33">Arranque con solo baterías</text>
  <text x="332" y="116" text-anchor="end" font-size="10.5" font-weight="800" fill="#8C99A3">hasta 25 000 ft</text>
  <rect x="16" y="134" width="328" height="32" rx="5" fill="#FCEBD3" stroke="#C77700" stroke-width="1.4"/>
  <text x="28" y="154" font-size="10.5" font-weight="700" fill="#1E2A33">Bleed con un pack</text>
  <text x="332" y="154" text-anchor="end" font-size="10.5" font-weight="800" fill="#C77700">hasta 22 500 ft*</text>
  <rect x="16" y="172" width="328" height="32" rx="5" fill="#FCEBD3" stroke="#C77700" stroke-width="1.4"/>
  <text x="28" y="192" font-size="10.5" font-weight="700" fill="#1E2A33">Bleed para arrancar un motor</text>
  <text x="332" y="192" text-anchor="end" font-size="10.5" font-weight="800" fill="#C77700">hasta 20 000 ft</text>
  <rect x="16" y="210" width="328" height="32" rx="5" fill="#FCEBD3" stroke="#C77700" stroke-width="1.4"/>
  <text x="28" y="230" font-size="10.5" font-weight="700" fill="#1E2A33">Bleed con dos packs</text>
  <text x="332" y="230" text-anchor="end" font-size="10.5" font-weight="800" fill="#C77700">hasta 15 000 ft</text>
  <text x="16" y="266" font-size="10" fill="#5B6B78">* 20 000 ft en algunos aviones.</text>
  <text x="16" y="284" font-size="10.5" font-weight="700" fill="#C0392B">Nunca bleed del APU para el wing anti-ice.</text>
</svg>
