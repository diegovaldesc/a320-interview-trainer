<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 282" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Bank en normal law</title>
  <desc id="d">Hasta 33° de bank, con el sidestick suelto, el bank se mantiene; entre 33° y 67°, al soltar el sidestick vuelve a 33°; 67° es el máximo con el sidestick a tope. Con la protección de AOA o de pitch attitude activa, el máximo baja a 45°, y con la de high speed a 40°.</desc>
