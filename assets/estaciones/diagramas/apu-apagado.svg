<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Apagar el APU</title>
  <desc id="d">Tres formas de apagar el APU. Manual, con el MASTER SW a OFF: si se usó el bleed, 60 a 120 segundos de enfriamiento, y la flap se cierra a 7 % de N. Automático, por el ECB ante una falla: sin enfriamiento, con la alerta APU AUTO SHUT DOWN. De emergencia, con el APU FIRE pb o el APU SHUT OFF, que está afuera del avión: inmediato, sin enfriamiento.</desc>
  <rect x="1" y="1" width="358" height="268" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Apagar el APU</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">Tres formas.</text>
  <rect x="16" y="58" width="328" height="60" rx="6" fill="#E5F4EA" stroke="#2E9D5B" stroke-width="1.4"/>
  <text x="28" y="80" font-size="11.5" font-weight="800" fill="#2E9D5B">Manual</text>
  <text x="28" y="98" font-size="10" fill="#33424D">MASTER SW a OFF</text>
  <text x="184" y="80" font-size="10.5" font-weight="700" fill="#1E2A33">Con bleed usado: 60 a 120 s</text>
  <text x="184" y="98" font-size="10" fill="#33424D">de enfriamiento; flap a 7 %</text>
  <rect x="16" y="126" width="328" height="60" rx="6" fill="#FCEBD3" stroke="#C77700" stroke-width="1.4"/>
  <text x="28" y="148" font-size="11.5" font-weight="800" fill="#C77700">Automático</text>
  <text x="28" y="166" font-size="10" fill="#33424D">el ECB, ante una falla</text>
  <text x="184" y="148" font-size="10.5" font-weight="700" fill="#1E2A33">Sin enfriamiento</text>
  <text x="184" y="166" font-size="10" fill="#33424D">alerta APU AUTO SHUT DOWN</text>
  <rect x="16" y="194" width="328" height="60" rx="6" fill="#F8E1DE" stroke="#C0392B" stroke-width="1.4"/>
  <text x="28" y="216" font-size="11.5" font-weight="800" fill="#C0392B">Emergencia</text>
  <text x="28" y="234" font-size="10" fill="#33424D">APU FIRE pb o APU SHUT OFF</text>
  <text x="184" y="216" font-size="10.5" font-weight="700" fill="#1E2A33">Inmediato, sin enfriamiento</text>
  <text x="184" y="234" font-size="10" fill="#33424D">SHUT OFF: afuera del avión</text>
</svg>
