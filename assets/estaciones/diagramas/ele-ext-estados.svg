<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 276" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">EXT PWR pb: AVAIL y ON</title>
  <desc id="d">Tres estados del EXT PWR pb. 1: external power conectado y normal, AVAIL verde, line contactor abierto, todavía no alimenta. 2: al presionarlo, ON azul y el contactor cerrado, alimenta la red. 3: al presionarlo otra vez, vuelve AVAIL y el contactor se abre; AVAIL sigue hasta que lo desconectan. ON sigue encendida aunque los engine generators tomen la red.</desc>
  <rect x="1" y="1" width="358" height="274" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <rect x="8" y="12" width="108" height="178" rx="10" fill="#F6F8FA" stroke="#DDE3E8"/>
  <circle cx="28" cy="30" r="9" fill="#33424D"/>
  <text x="28" y="34" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">1</text>
  <text x="70" y="34" text-anchor="middle" font-size="11" font-weight="700" fill="#33424D">Conectado</text>
  <text x="62" y="58" text-anchor="middle" font-size="10" font-weight="700" fill="#33424D">EXT PWR</text>
  <rect x="42" y="64" width="40" height="36" rx="4" fill="#2C363F"/>
  <line x1="46" y1="82" x2="78" y2="82" stroke="#46525C" stroke-width="1"/>
  <text x="62" y="77.5" text-anchor="middle" font-size="10" font-weight="700" fill="#62D394">AVAIL</text>
  <text x="62" y="95" text-anchor="middle" font-size="10" font-weight="700" fill="#8A949C">ON</text>
