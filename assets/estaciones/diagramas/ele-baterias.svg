<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 286" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Baterías: HOT BUS, BCL y contactor</title>
  <desc id="d">DC BUS 1 alimenta el DC BAT BUS. El BCL cierra el contactor de BAT 1 para cargarla y abre el de BAT 2, ya cargada. Los HOT BUS están siempre conectados a las baterías. El overhead muestra el voltaje.</desc>
  <rect x="1" y="1" width="358" height="284" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <path d="M40 92 L40 40" fill="none" stroke="#2E9D5B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M150 40 L150 92" fill="none" stroke="#2E9D5B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M270 40 L270 92" fill="none" stroke="#A9B4BD" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M150 118 L150 146" fill="none" stroke="#2E9D5B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M270 118 L270 146" fill="none" stroke="#2E9D5B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="145.5" y="59.5" width="9" height="9" rx="2" fill="#2E9D5B" stroke="#2E9D5B" stroke-width="1.6"/>
  <rect x="265.5" y="59.5" width="9" height="9" rx="2" fill="#FFFFFF" stroke="#A9B4BD" stroke-width="1.6"/>
  <rect x="14" y="22" width="332" height="18" rx="5" fill="#E9F5EE" stroke="#2E9D5B" stroke-width="1.6"/>
  <text x="180" y="34.96" text-anchor="middle" font-size="11" font-weight="700" fill="#1F6E41">DC BAT BUS</text>
  <rect x="14" y="92" width="82" height="18" rx="5" fill="#E9F5EE" stroke="#2E9D5B" stroke-width="1.6"/>
  <text x="55" y="104.96" text-anchor="middle" font-size="11" font-weight="700" fill="#1F6E41">DC BUS 1</text>
  <text x="55" y="126" text-anchor="middle" font-size="10" fill="#5B6B78">en vuelo, desde TR 1</text>
  <rect x="126" y="92" width="48" height="26" rx="5" fill="#FFFFFF" stroke="#8C99A3" stroke-width="1.6"/>
  <text x="150" y="108.96" text-anchor="middle" font-size="11" font-weight="700" fill="#1E2A33">BAT 1</text>
  <rect x="246" y="92" width="48" height="26" rx="5" fill="#FFFFFF" stroke="#8C99A3" stroke-width="1.6"/>
  <text x="270" y="108.96" text-anchor="middle" font-size="11" font-weight="700" fill="#1E2A33">BAT 2</text>
  <text x="160" y="61" font-size="10.5" font-weight="600" fill="#1F6E41">BCL: cerrado</text>
  <text x="160" y="74" font-size="10" fill="#5B6B78">se está cargando</text>
  <text x="280" y="61" font-size="10.5" font-weight="600" fill="#5B6B78">BCL: abierto</text>
  <text x="280" y="74" font-size="10" fill="#5B6B78">ya cargada</text>
  <rect x="118" y="146" width="64" height="16" rx="5" fill="#E9F5EE" stroke="#2E9D5B" stroke-width="1.6"/>
  <text x="150" y="157.6" text-anchor="middle" font-size="10" font-weight="700" fill="#1F6E41">HOT BUS 1</text>
  <rect x="238" y="146" width="64" height="16" rx="5" fill="#E9F5EE" stroke="#2E9D5B" stroke-width="1.6"/>
  <text x="270" y="157.6" text-anchor="middle" font-size="10" font-weight="700" fill="#1F6E41">HOT BUS 2</text>
  <text x="210" y="180" text-anchor="middle" font-size="10.5" fill="#33424D">Los HOT BUS siempre tienen energía</text>
  <rect x="125" y="192" width="50" height="24" rx="3" fill="#1B2228"/>
  <text x="150" y="208.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#E9EEF2">26.8 V</text>
  <rect x="245" y="192" width="50" height="24" rx="3" fill="#1B2228"/>
  <text x="270" y="208.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#E9EEF2">27.9 V</text>
  <text x="42" y="205" font-size="10.5" font-weight="600" fill="#33424D">Overhead:</text>
  <text x="42" y="218" font-size="10.5" fill="#33424D">voltaje</text>
  <rect x="14" y="230" width="332" height="44" rx="8" fill="#F3F5F7" stroke="#DDE3E8"/>
  <text x="24" y="248" font-size="10.5" fill="#1E2A33">Antes del vuelo: más de 25.5 V (carga sobre 50 %).</text>
  <text x="24" y="264" font-size="10.5" fill="#1E2A33">Si no: unos 20 min de carga con BAT en AUTO y EXT PWR en ON.</text>
</svg>
