<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 254" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Ángulo máximo de la rueda de nariz</title>
  <desc id="d">Dos gráficos del ángulo máximo según la ground speed: con el tiller, 75° hasta 20 kt y 0° a 80 kt; con los pedales, 6° hasta 40 kt y 0° a 130 kt.</desc>
  <rect x="1" y="1" width="358" height="252" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <defs><marker id="a8C99A3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8C99A3"/></marker><marker id="b8C99A3" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#8C99A3"/></marker></defs>
  <text x="18" y="26" font-size="12.5" font-weight="800" fill="#0E5E6F">Ángulo máximo de la rueda de nariz</text>
  <text x="18" y="42" font-size="10" fill="#5B6B78">Depende del mando y de la ground speed.</text>
  <text x="28" y="66" font-size="10.5" font-weight="800" fill="#0E5E6F">Tiller (handwheel)</text>
  <line x1="28" y1="186" x2="174" y2="186" stroke="#8C99A3" stroke-width="1.2" marker-end="url(#a8C99A3)"/>
  <line x1="28" y1="186" x2="28" y2="76" stroke="#8C99A3" stroke-width="1.2" marker-end="url(#a8C99A3)"/>
  <polyline points="28,95.8 48,95.8 108,186" fill="none" stroke="#0E5E6F" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="32" y="89.8" font-size="10.5" font-weight="800" fill="#0E5E6F">±75°</text>
  <line x1="48" y1="186" x2="48" y2="190" stroke="#1E2A33" stroke-width="1.2"/>
  <text x="48" y="202" text-anchor="middle" font-size="9.5" font-weight="700" fill="#33424D">20</text>
  <line x1="108" y1="186" x2="108" y2="190" stroke="#1E2A33" stroke-width="1.2"/>
  <text x="108" y="202" text-anchor="middle" font-size="9.5" font-weight="700" fill="#33424D">80</text>
  <line x1="48" y1="95.8" x2="48" y2="186" stroke="#C9D3DB" stroke-width="1.2" stroke-dasharray="2 3"/>
  <text x="196" y="66" font-size="10.5" font-weight="800" fill="#C77700">Pedales</text>
  <line x1="196" y1="186" x2="342" y2="186" stroke="#8C99A3" stroke-width="1.2" marker-end="url(#a8C99A3)"/>
  <line x1="196" y1="186" x2="196" y2="76" stroke="#8C99A3" stroke-width="1.2" marker-end="url(#a8C99A3)"/>
  <polyline points="196,95.8 236,95.8 326,186" fill="none" stroke="#C77700" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="200" y="89.8" font-size="10.5" font-weight="800" fill="#C77700">±6°</text>
  <line x1="236" y1="186" x2="236" y2="190" stroke="#1E2A33" stroke-width="1.2"/>
  <text x="236" y="202" text-anchor="middle" font-size="9.5" font-weight="700" fill="#33424D">40</text>
  <line x1="326" y1="186" x2="326" y2="190" stroke="#1E2A33" stroke-width="1.2"/>
  <text x="326" y="202" text-anchor="middle" font-size="9.5" font-weight="700" fill="#33424D">130</text>
  <line x1="236" y1="95.8" x2="236" y2="186" stroke="#C9D3DB" stroke-width="1.2" stroke-dasharray="2 3"/>
  <text x="180" y="214" text-anchor="middle" font-size="9" fill="#5B6B78">ground speed (kt)</text>
  <text x="18" y="230" font-size="9.6" fill="#33424D">Tiller: 75° hasta 20 kt, y 0° a 80 kt.</text>
  <text x="18" y="244" font-size="9.6" fill="#33424D">Pedales: 6° hasta 40 kt, y 0° a 130 kt.</text>
</svg>
