<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 298" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Fases del FMS y su velocidad</title>
  <desc id="d">Takeoff: V2 (V2 + 10 en el aire), empieza con SRS y N1 sobre 85 % o GS sobre 90 kt. Climb: ECON CLB, desde la acceleration altitude. Cruise: ECON CRZ MACH, al llegar al nivel de crucero. Descent: ECON DES, al bajar del nivel de crucero. Approach: VAPP, al pasar el DECEL en NAV o a mano. Go-around: VAPP o la velocidad actual, green dot en la ACC ALT, con TOGA. Antes, preflight; 30 s después del aterrizaje, done.</desc>
  <rect x="1" y="1" width="358" height="296" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">Fases del FMS y su velocidad</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">Qué hace cambiar de fase y qué velocidad usa cada una</text>
  <text x="18" y="66" font-size="10" font-weight="700" fill="#5B6B78">Fase</text>
  <text x="116" y="66" font-size="10" font-weight="700" fill="#5B6B78">Velocidad managed</text>
  <rect x="16" y="72" width="92" height="28" rx="6" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.4"/>
  <text x="62" y="90" text-anchor="middle" font-size="10.5" font-weight="800" fill="#0E5E6F">TAKEOFF</text>
  <text x="116" y="84" font-size="10.5" font-weight="700" fill="#1E2A33">V2 (V2 + 10 en el aire)</text>
  <text x="116" y="97" font-size="10" fill="#5B6B78">empieza con: SRS y N1 &gt; 85 % o GS &gt; 90 kt</text>
  <rect x="16" y="106" width="92" height="28" rx="6" fill="#F3F5F7" stroke="#C9D3DB" stroke-width="1.4"/>
  <text x="62" y="124" text-anchor="middle" font-size="10.5" font-weight="800" fill="#0E5E6F">CLIMB</text>
  <text x="116" y="118" font-size="10.5" font-weight="700" fill="#1E2A33">ECON CLB SPD/MACH</text>
  <text x="116" y="131" font-size="10" fill="#5B6B78">empieza con: acceleration altitude</text>
  <rect x="16" y="140" width="92" height="28" rx="6" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.4"/>
  <text x="62" y="158" text-anchor="middle" font-size="10.5" font-weight="800" fill="#0E5E6F">CRUISE</text>
  <text x="116" y="152" font-size="10.5" font-weight="700" fill="#1E2A33">ECON CRZ MACH</text>
  <text x="116" y="165" font-size="10" fill="#5B6B78">empieza con: llegar al nivel de crucero</text>
  <rect x="16" y="174" width="92" height="28" rx="6" fill="#F3F5F7" stroke="#C9D3DB" stroke-width="1.4"/>
  <text x="62" y="192" text-anchor="middle" font-size="10.5" font-weight="800" fill="#0E5E6F">DESCENT</text>
  <text x="116" y="186" font-size="10.5" font-weight="700" fill="#1E2A33">ECON DES MACH/SPD</text>
  <text x="116" y="199" font-size="10" fill="#5B6B78">empieza con: descenso bajo el CRZ FL (T/D)</text>
  <rect x="16" y="208" width="92" height="28" rx="6" fill="#DCEEF1" stroke="#0E5E6F" stroke-width="1.4"/>
  <text x="62" y="226" text-anchor="middle" font-size="10.5" font-weight="800" fill="#0E5E6F">APPROACH</text>
  <text x="116" y="220" font-size="10.5" font-weight="700" fill="#1E2A33">VAPP (GS mini)</text>
  <text x="116" y="233" font-size="10" fill="#5B6B78">empieza con: pasar el DECEL en NAV, o a mano</text>
  <rect x="16" y="242" width="92" height="28" rx="6" fill="#F3F5F7" stroke="#C9D3DB" stroke-width="1.4"/>
  <text x="62" y="260" text-anchor="middle" font-size="10.5" font-weight="800" fill="#0E5E6F">GO-AROUND</text>
  <text x="116" y="254" font-size="10.5" font-weight="700" fill="#1E2A33">VAPP o actual; green dot</text>
  <text x="116" y="267" font-size="10" fill="#5B6B78">empieza con: TOGA</text>
  <text x="18" y="288" font-size="10" fill="#33424D">Antes: PREFLIGHT · Después del aterrizaje (30 s): DONE</text>
</svg>
