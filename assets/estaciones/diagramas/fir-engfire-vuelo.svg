<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 310" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">ENG FIRE en vuelo</title>
  <desc id="d">Las acciones ante ENG FIRE en vuelo, en orden: THR LEVER del motor afectado en IDLE; ENG MASTER en OFF; ENG FIRE pb PUSH; AGENT 1 después de 10 segundos; ATC NOTIFY; y si el fuego sigue 30 segundos después, AGENT 2. LAND ASAP. Los 10 segundos dejan que baje el N1, con menos ventilación, y el agente rinde más.</desc>
  <rect x="1" y="1" width="358" height="308" rx="14" fill="#FFFFFF" stroke="#DDE3E8"/>
  <text x="18" y="27" font-size="13" font-weight="800" fill="#0E5E6F">ENG FIRE en vuelo</text>
  <text x="18" y="44" font-size="10.5" fill="#5B6B78">LAND ASAP.</text>
  <circle cx="30" cy="72" r="8.5" fill="#0E5E6F" stroke="none" stroke-width="1"/>
  <text x="30" y="75.8" text-anchor="middle" font-size="10.5" font-weight="800" fill="#FFFFFF">1</text>
  <text x="46" y="76" font-size="11" font-weight="700" fill="#1E2A33">THR LEVER (afectado) ....... IDLE</text>
  <circle cx="30" cy="110" r="8.5" fill="#0E5E6F" stroke="none" stroke-width="1"/>
  <text x="30" y="113.8" text-anchor="middle" font-size="10.5" font-weight="800" fill="#FFFFFF">2</text>
  <text x="46" y="114" font-size="11" font-weight="700" fill="#1E2A33">ENG MASTER (afectado) ....... OFF</text>
  <circle cx="30" cy="148" r="8.5" fill="#0E5E6F" stroke="none" stroke-width="1"/>
  <text x="30" y="151.8" text-anchor="middle" font-size="10.5" font-weight="800" fill="#FFFFFF">3</text>
  <text x="46" y="152" font-size="11" font-weight="700" fill="#1E2A33">ENG FIRE pb (afectado) ...... PUSH</text>
  <circle cx="30" cy="186" r="8.5" fill="#0E5E6F" stroke="none" stroke-width="1"/>
  <text x="30" y="189.8" text-anchor="middle" font-size="10.5" font-weight="800" fill="#FFFFFF">4</text>
  <text x="46" y="190" font-size="11" font-weight="700" fill="#1E2A33">AGENT 1 después de 10 s ..... DISCH</text>
  <circle cx="30" cy="224" r="8.5" fill="#0E5E6F" stroke="none" stroke-width="1"/>
  <text x="30" y="227.8" text-anchor="middle" font-size="10.5" font-weight="800" fill="#FFFFFF">5</text>
  <text x="46" y="228" font-size="11" font-weight="700" fill="#1E2A33">ATC ...................... NOTIFY</text>
  <circle cx="30" cy="262" r="8.5" fill="#C0392B" stroke="none" stroke-width="1"/>
  <text x="30" y="265.8" text-anchor="middle" font-size="10.5" font-weight="800" fill="#FFFFFF">6</text>
  <text x="46" y="266" font-size="11" font-weight="700" fill="#C0392B">Si sigue 30 s después: AGENT 2 . DISCH</text>
  <text x="16" y="296" font-size="10.5" fill="#33424D">10 s: baja el N1, menos ventilación, el agente rinde más.</text>
</svg>
